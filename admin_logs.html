    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot,
                 doc, deleteDoc, getDocs, where }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ API KEY CORREGIDA (era X5, debe ser Q5)
        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",
            storageBucket: "habitatcar-pro.firebasestorage.app",
            messagingSenderId: "311691258694",
            appId: "1:311691258694:web:17a09051dcea7707af9347"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        let todosLosLogs = [];
        let logsFiltrados = [];
        let mapaLeads = {};
        
        let estadoOrden = {
            campo: 'timestamp',
            direccion: 'desc'
        };

        /* ── CONTADORES NAVBAR ── */
        async function actualizarContadores() {
            const el = id => document.getElementById(id);
            try {
                const [todosSnap, vipsSnap, comSnap] = await Promise.all([
                    getDocs(collection(db,"leads")),
                    getDocs(query(collection(db,"leads"),where("convertidoVIP","==",true))),
                    getDocs(collection(db,"comercios")),
                ]);
                if(el('cont-comercios')) el('cont-comercios').innerText = comSnap.size;
                if(el('cont-leads'))     el('cont-leads').innerText     = todosSnap.size - vipsSnap.size;
                if(el('cont-vips'))      el('cont-vips').innerText      = vipsSnap.size;
                try{const t=await getDocs(collection(db,"tutoriales"));if(el('cont-tutoriales'))el('cont-tutoriales').innerText=t.size;}catch(e){}
                for(const[col,elId]of[['postulaciones_comercios','cont-validaciones-comercios'],['postulaciones_martilleros','cont-validaciones-martilleros'],['postulaciones_colaboradores','cont-validaciones-colaboradores']]){
                    try{const s=await getDocs(query(collection(db,col),where("estado","==","pendiente")));if(el(elId))el(elId).innerText=s.size;}catch(e){}
                }

                mapaLeads = {};
                todosSnap.forEach(d => {
                    const data = d.data();
                    mapaLeads[d.id] = {
                        provincia: (data.provincia||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(),
                        localidad: (data.localidad||data.ciudad||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(),
                        nombreCompleto: `${data.apellido || ''} ${data.nombres || ''}`.trim(),
                        whatsapp: data.whatsapp || ''
                    };
                });
            } catch(e){console.error(e);}
        }
        actualizarContadores();
        setInterval(actualizarContadores, 30000);

        /* ── PROVINCIAS / LOCALIDADES ── */
        async function cargarProvinciasLog() {
            try {
                const res  = await fetch('https://apis.datos.gob.ar/georef/api/provincias?campos=nombre&max=100');
                const data = await res.json();
                const combo = document.getElementById('filtroProvincia');
                combo.innerHTML = '<option value="">TODAS LAS PROVINCIAS</option>';
                data.provincias.map(p=>p.nombre).sort((a,b)=>a.localeCompare(b)).forEach(n=>{
                    const o=document.createElement('option');
                    o.value=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
                    o.textContent=n; combo.appendChild(o);
                });
            } catch(e){console.error(e);}
        }

        window.onProvLog = async provNorm => {
            const combo = document.getElementById('filtroLocalidad');
            combo.innerHTML = '<option value="">TODAS LAS LOCALIDADES</option>';
            if (provNorm) {
                try {
                    const res  = await fetch(`https://apis.datos.gob.ar/georef/api/municipios?provincia=${encodeURIComponent(provNorm)}&max=1000&campos=nombre`);
                    const data = await res.json();
                    (data.municipios||[]).map(m=>m.nombre).sort((a,b)=>a.localeCompare(b)).forEach(n=>{
                        const o=document.createElement('option');
                        o.value=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
                        o.textContent=n; combo.appendChild(o);
                    });
                } catch(e){console.error(e);}
            }
            filtrar();
        };
        cargarProvinciasLog();

        /* ── SNAPSHOT LOGS EN TIEMPO REAL ── */
        const qLogs = query(collection(db,"logs_actividad"), orderBy("timestamp","desc"), limit(1000));
        onSnapshot(qLogs, snap => {
            todosLosLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            filtrar();
        });

        /* ── CLASIFICAR TIPO ── */
        function clasificar(log) {
            const accion = (log.accion||'').toUpperCase();
            const tipo   = (log.tipo||'').toUpperCase();
            
            if (accion.includes('NUEVO REGISTRO VIP') || accion.includes('INSCRIPCIÓN VIP') || accion.includes('NUEVO VIP')) {
                return { cls:'b-nuevo-vip', label:'⭐ NUEVO VIP', tipoLabel: 'INSCRIPCIÓN VIP' };
            }
            if (accion.includes('INSCRIPCIÓN') || accion.includes('INSCRIPCION') || tipo.includes('INSCRIPCION')) {
                return { cls:'b-inscripcion', label:'📝 INSCRIPCIÓN', tipoLabel: 'INSCRIPCIÓN' };
            }
            if (accion.includes('CANJE VIP') || (accion.includes('CANJE') && tipo==='VIP')) {
                return { cls:'b-canje-vip', label:'💎 CANJE VIP', tipoLabel: 'CANJE VIP' };
            }
            if (accion.includes('CANJE LEAD') || (accion.includes('CANJE') && tipo==='LEAD') || tipo==='CANJE') {
                return { cls:'b-canje-lead', label:'🔄 CANJE LEAD', tipoLabel: 'CANJE LEAD' };
            }
            if (tipo==='VIP' || accion.includes('SUSPENDER VIP') || accion.includes('ACTIVAR VIP') || 
                accion.includes('BAJA VIP') || accion.includes('RESTABLECER CUPONES VIP') || accion.includes('ELIMINAR VIP')) {
                if (accion.includes('BAJA VIP')) return { cls:'b-gestion-vip', label:'⬇️ BAJA VIP', tipoLabel: 'BAJA VIP' };
                if (accion.includes('RESTABLECER')) return { cls:'b-gestion-vip', label:'🔄 RESTABLECER', tipoLabel: 'RESTABLECER' };
                if (accion.includes('ELIMINAR')) return { cls:'b-gestion-vip', label:'🗑️ ELIMINAR VIP', tipoLabel: 'ELIMINAR' };
                return { cls:'b-gestion-vip', label:'⚙️ GESTIÓN VIP', tipoLabel: 'GESTIÓN VIP' };
            }
            if (tipo==='GESTION LEAD' || accion.includes('SUSPENDER LEAD') || accion.includes('ACTIVAR LEAD') || 
                accion.includes('ELIMINAR LEAD') || accion.includes('RESTABLECER LEAD')) {
                return { cls:'b-gestion-lead', label:'⚙️ GESTIÓN LEAD', tipoLabel: 'GESTIÓN LEAD' };
            }
            if (tipo==='LEAD') {
                return { cls:'b-gestion-lead', label:'👤 LEAD', tipoLabel: 'LEAD' };
            }
            return { cls:'b-sistema', label:'💻 SISTEMA', tipoLabel: tipo || 'SISTEMA' };
        }

        /* ── CATEGORÍA MÓDULO ── */
        function categoriaModulo(log) {
            const accion = (log.accion||'').toUpperCase();
            const tipo   = (log.tipo||'').toUpperCase();
            
            if (accion.includes('NUEVO REGISTRO VIP') || accion.includes('INSCRIPCIÓN VIP')) return 'INSCRIPCION';
            if (accion.includes('CANJE')) return 'CANJE';
            if (tipo==='VIP' || tipo==='VIPS') return 'VIP';
            if (tipo==='GESTION LEAD' || accion.includes('SUSPENDER LEAD') || accion.includes('ACTIVAR LEAD') || 
                accion.includes('ELIMINAR LEAD') || accion.includes('RESTABLECER')) return 'GESTION';
            if (tipo==='LEAD') return 'LEAD';
            if (accion.includes('INSCRIPCIÓN') || accion.includes('INSCRIPCION')) return 'INSCRIPCION';
            return 'OTRO';
        }
        
        function esFechaEnRango(timestamp, rango) {
            if (!timestamp) return false;
            const fecha = new Date(timestamp);
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            if (rango === 'hoy') {
                const fechaInicio = new Date(fecha);
                fechaInicio.setHours(0, 0, 0, 0);
                return fechaInicio.getTime() === hoy.getTime();
            }
            if (rango === '7d') {
                const hace7Dias = new Date();
                hace7Dias.setDate(hace7Dias.getDate() - 7);
                return fecha >= hace7Dias;
            }
            if (rango === '30d') {
                const hace30Dias = new Date();
                hace30Dias.setDate(hace30Dias.getDate() - 30);
                return fecha >= hace30Dias;
            }
            return true;
        }

        /* ── ORDENAMIENTO ── */
        function ordenarLogs(logs, campo, direccion) {
            const sorted = [...logs];
            sorted.sort((a, b) => {
                let valA = a[campo];
                let valB = b[campo];
                if (campo === 'modulo') {
                    valA = clasificar(a).tipoLabel || '';
                    valB = clasificar(b).tipoLabel || '';
                }
                if (campo === 'tipoLabel') {
                    valA = clasificar(a).label || '';
                    valB = clasificar(b).label || '';
                }
                if (campo === 'detalle') {
                    valA = (a.detalle || a.nombre || '').toLowerCase();
                    valB = (b.detalle || b.nombre || '').toLowerCase();
                }
                if (valA === undefined || valA === null) valA = '';
                if (valB === undefined || valB === null) valB = '';
                if (direccion === 'asc') {
                    return valA > valB ? 1 : (valA < valB ? -1 : 0);
                } else {
                    return valA < valB ? 1 : (valA > valB ? -1 : 0);
                }
            });
            return sorted;
        }
        
        function actualizarIndicadoresOrden(campo, direccion) {
            ['timestamp', 'modulo', 'detalle', 'tipoLabel'].forEach(c => {
                const span = document.getElementById(`orden-${c}`);
                if (span) span.innerHTML = '';
            });
            const spanActual = document.getElementById(`orden-${campo}`);
            if (spanActual) spanActual.innerHTML = direccion === 'asc' ? '▲' : '▼';
        }
        
        window.ordenarPor = (campo) => {
            if (estadoOrden.campo === campo) {
                estadoOrden.direccion = estadoOrden.direccion === 'asc' ? 'desc' : 'asc';
            } else {
                estadoOrden.campo = campo;
                estadoOrden.direccion = campo === 'timestamp' ? 'desc' : 'asc';
            }
            actualizarIndicadoresOrden(estadoOrden.campo, estadoOrden.direccion);
            filtrar();
        };

        /* ── FILTRAR Y RENDERIZAR ── */
        window.filtrar = () => {
            const texto   = document.getElementById('buscadorTexto').value.toLowerCase();
            const modulo  = document.getElementById('filtroModulo').value;
            const provSel = document.getElementById('filtroProvincia').value;
            const locSel  = document.getElementById('filtroLocalidad').value;
            const fechaRango = document.getElementById('filtroFecha').value;

            let filtrados = todosLosLogs.filter(log => {
                const haystack = `${log.nombre||''} ${log.detalle||''} ${log.accion||''} ${log.whatsapp||''}`.toLowerCase();
                if (texto && !haystack.includes(texto)) return false;
                if (modulo && categoriaModulo(log) !== modulo) return false;
                if (fechaRango && !esFechaEnRango(log.timestamp, fechaRango)) return false;

                if (provSel || locSel) {
                    const uid  = log.usuarioId || '';
                    const info = mapaLeads[uid] || { provincia:'', localidad:'' };
                    if (provSel && info.provincia !== provSel) return false;
                    if (locSel  && info.localidad !== locSel)  return false;
                }
                return true;
            });
            
            logsFiltrados = ordenarLogs(filtrados, estadoOrden.campo, estadoOrden.direccion);
            renderizar(logsFiltrados);
            actualizarChipsFiltros();
        };
        
        function actualizarChipsFiltros() {
            const container = document.getElementById('filtrosActivos');
            const texto = document.getElementById('buscadorTexto').value;
            const modulo = document.getElementById('filtroModulo').value;
            const prov = document.getElementById('filtroProvincia').value;
            const loc = document.getElementById('filtroLocalidad').value;
            const fecha = document.getElementById('filtroFecha').value;
            
            let chips = [];
            if (texto) chips.push({ label: `🔍 "${texto}"`, limpiar: () => { document.getElementById('buscadorTexto').value = ''; filtrar(); } });
            if (modulo) chips.push({ label: `📌 ${modulo}`, limpiar: () => { document.getElementById('filtroModulo').value = ''; filtrar(); } });
            if (prov) chips.push({ label: `📍 Provincia`, limpiar: () => { document.getElementById('filtroProvincia').value = ''; document.getElementById('filtroLocalidad').innerHTML = '<option value="">TODAS LAS LOCALIDADES</option>'; filtrar(); } });
            if (loc) chips.push({ label: `🏘️ Localidad`, limpiar: () => { document.getElementById('filtroLocalidad').value = ''; filtrar(); } });
            if (fecha) {
                let textoFecha = fecha === 'hoy' ? 'HOY' : fecha === '7d' ? 'ÚLTIMOS 7 DÍAS' : 'ÚLTIMOS 30 DÍAS';
                chips.push({ label: `📅 ${textoFecha}`, limpiar: () => { document.getElementById('filtroFecha').value = ''; filtrar(); } });
            }
            
            if (chips.length === 0) { container.innerHTML = ''; return; }
            
            container.innerHTML = chips.map(chip => `
                <div class="filtro-chip">
                    ${chip.label}
                    <button onclick="(function(){ ${chip.limpiar.toString()} })()">✕</button>
                </div>
            `).join('');
        }

        function renderizar(logs) {
            const lista = document.getElementById('lista-logs');
            lista.innerHTML = '';
            
            if (logs.length === 0) {
                lista.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px;">📭 No hay registros de actividad que coincidan con los filtros</td></tr>';
                return;
            }
            
            logs.forEach(log => {
                const fecha  = log.timestamp
                    ? new Date(log.timestamp).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' })
                    : (log.fecha||'---');
                const badge  = clasificar(log);
                const modAcc = badge.tipoLabel || log.tipo || 'SISTEMA';

                let detalle = '';
                const accionUp = (log.accion||'').toUpperCase();

                if (accionUp === 'CANJE LEAD' || accionUp === 'CANJE LEADS') {
                    const comercio = log.nombreComercio || log.comercio || '';
                    const codigo   = log.idValidacion || '';
                    const usoNum   = log.usoNumero != null ? log.usoNumero : '';
                    const usosTot  = log.usosTotales != null ? log.usosTotales : '';
                    const usuario  = log.nombre || '';
                    const wapp     = log.whatsapp || '';

                    if (comercio) {
                        detalle = `${codigo ? '<span style="color:var(--oro);font-weight:bold;">' + codigo + '</span> — ' : ''}canjeó beneficio en <b>${comercio}</b>`;
                        if (usoNum !== '' && usosTot !== '') detalle += ` <span style="color:#8892b0;">(uso ${usoNum} de ${usosTot})</span>`;
                        if (usuario) detalle += ` · <b>${usuario}</b>`;
                        if (wapp)    detalle += ` <span class="wapp-badge">📱 ${wapp}</span>`;
                    } else {
                        detalle = log.detalle || log.nombre || '---';
                    }

                } else if (accionUp === 'CANJE VIP') {
                    const comercio = log.nombreComercio || log.comercio || '';
                    const codigo   = log.idValidacion || '';
                    const usoNum   = log.usoNumero != null ? log.usoNumero : '';
                    const usuario  = log.nombre || '';
                    const wapp     = log.whatsapp || '';

                    if (comercio) {
                        detalle = `${codigo ? '<span style="color:var(--dorado);font-weight:bold;">' + codigo + '</span> — ' : ''}canjeó beneficio VIP en <b>${comercio}</b>`;
                        if (usoNum !== '') detalle += ` <span style="color:#8892b0;">(uso ${usoNum})</span>`;
                        if (usuario) detalle += ` · <b>${usuario}</b>`;
                        if (wapp)    detalle += ` <span class="wapp-badge">📱 ${wapp}</span>`;
                    } else {
                        detalle = log.detalle || log.nombre || '---';
                    }

                } else if (accionUp.includes('NUEVO REGISTRO VIP') || accionUp.includes('INSCRIPCIÓN VIP')) {
                    detalle = `✨ ${log.detalle || log.nombre || 'Nuevo socio VIP'} ✨`;
                } else {
                    detalle = log.detalle || log.nombre || '---';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="date-col">${fecha}</td>
                    <td class="modulo-col">${modAcc}</td>
                    <td class="detalle-col">${detalle}</td>
                    <td><span class="badge ${badge.cls}">${badge.label}</span></td>
                    <td><button class="btn-del-log" onclick="borrarLog('${log.id}')">🗑️</button></td>
                `;
                lista.appendChild(tr);
            });
        }

        window.borrarLog = async id => {
            if (confirm("¿Eliminar este registro del log?"))
                await deleteDoc(doc(db,"logs_actividad",id));
        };

        window.limpiarLogs = async () => {
            if (!confirm("⚠️ ¿BORRAR TODO EL HISTORIAL DE ACTIVIDAD?\nEsta acción no se puede deshacer.")) return;
            const pass = prompt("🔒 Clave ADMIN para borrar historial:");
            if (pass !== "admin1234") { alert("Clave incorrecta"); return; }
            
            const snap = await getDocs(collection(db,"logs_actividad"));
            let contador = 0;
            for (const d of snap.docs) {
                await deleteDoc(d.ref);
                contador++;
            }
            alert(`✅ ${contador} registros eliminados del historial.`);
        };
        
        actualizarIndicadoresOrden('timestamp', 'desc');
        
        window.borrarLog = window.borrarLog;
        window.limpiarLogs = window.limpiarLogs;
        window.ordenarPor = window.ordenarPor;
        window.filtrar = window.filtrar;
        window.onProvLog = window.onProvLog;
    </script>

<!-- BOTÓN FLOTANTE CERRAR SESIÓN -->
<button id="btn-logout" onclick="cerrarSesion()" style="position:fixed;bottom:30px;right:30px;width:60px;height:60px;background:#dc3545;color:white;border:none;border-radius:50%;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.4);font-size:24px;z-index:10000;transition:all 0.3s;" title="Cerrar Sesión">🚪</button>

<script>
async function cerrarSesion() {
    if(confirm('¿Cerrar sesión?')) {
        try {
            const { getAuth } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
            const auth = getAuth();
            await auth.signOut();
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'index.html';
        } catch(error) {
            console.error('Error:', error);
            alert('Error al cerrar sesión');
        }
    }
}
</script>
