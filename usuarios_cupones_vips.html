    <style>
        :root {
            --dorado: #d4af37;
            --dorado-brillante: #f9f295;
            --negro-fondo: #0a0a0a;
            --negro-card: #141414;
            --azul-lindo: #0056b3;
            --verde: #2e7d32;
            --rosa: #c2185b;
            --naranja-sorteo: #f57c00;
            --gris-volver: #757575;
            --facebook: #1877f2;
            --instagram: #e4405f;
            --tiktok: #000000;
            --azul-web: #0066cc;
            --verde-claro: #4caf50;
            --gris-texto: #cccccc;
            --celeste: #0288d1;
            --naranja: #ff8c00;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--negro-fondo); 
            color: white;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            padding-bottom: 120px; 
            width: 100vw;
            overflow-x: hidden;
            overscroll-behavior-y: contain; 
        }

        .header-vip { padding: 25px 15px; text-align: center; background: var(--negro-fondo); border-bottom: 2px solid var(--dorado); }
        .logo-box { 
            display: inline-block; 
            border: 3px solid var(--dorado); 
            padding: 0; 
            border-radius: 15px; 
            background: #000; 
            overflow: hidden; 
        }
        .logo-box img { width: 100%; max-width: 650px; height: auto; display: block; }

        .top-nav { display: flex; gap: 10px; padding: 15px 20px; }
        .btn-top {
            flex: 1; padding: 14px; border-radius: 12px; border: 3px solid var(--dorado);
            color: white; font-weight: 800; font-size: 0.9em; text-align: center; text-decoration: none;
            background: rgba(0,0,0,0.5); text-transform: uppercase;
        }

        /* ========== FILTROS AGREGADOS ========== */
        .filtros-container {
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-bottom: 1px solid var(--dorado);
        }
        
        .fila-filtros {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .fila-filtros:last-child {
            margin-bottom: 0;
        }
        
        .filtro-select {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            font-size: 13px;
            font-weight: 500;
            background: #1a1a1a;
            color: white;
            text-align: center;
            cursor: pointer;
        }
        
        .filtro-boton {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            font-size: 12px;
            font-weight: 600;
            background: var(--azul-lindo);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .filtro-boton.activo {
            background: var(--verde);
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--verde);
        }
        
        .filtro-boton.ubicacion-activa {
            background: var(--naranja-sorteo);
            animation: pulsoSuave 1.5s infinite;
        }
        
        @keyframes pulsoSuave {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .filtro-busqueda {
            flex: 2;
            position: relative;
        }
        
        .filtro-busqueda input {
            width: 100%;
            padding: 10px 10px 10px 32px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            font-size: 13px;
            box-sizing: border-box;
            background: #1a1a1a;
            color: white;
        }
        
        .filtro-busqueda::before {
            content: "🔍";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            pointer-events: none;
            z-index: 1;
        }
        
        .info-ubicacion {
            font-size: 11px;
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .badge-distancia {
            background: var(--verde);
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
            white-space: nowrap;
        }

        .info-txt { 
            display: block; 
            font-size: 12px; 
            color: var(--gris-texto); 
            margin: 5px 0; 
            font-weight: 500; 
        }
        .ico-large { font-size: 14px; vertical-align: middle; margin-right: 4px; }
        /* ========== FIN FILTROS ========== */

        .grilla { padding: 5px 20px; }
        .card-vip { 
            background: var(--negro-card); border-radius: 25px; padding: 25px; 
            margin-bottom: 35px; text-align: center; border: 3px solid var(--dorado); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        
        .logo-container { 
            width: 180px; 
            height: 180px; 
            margin: 0 auto 15px; 
            border-radius: 50%; 
            background: white; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: 4px solid var(--dorado);
        }
        .logo-c { width: 100%; height: 100%; object-fit: cover; }
        
        .nombre-c { font-size: 1.7em; font-weight: 800; color: var(--dorado-brillante); margin: 5px 0; text-transform: uppercase; }
        .beneficio-c { font-size: 1.8em; font-weight: 900; color: white; margin: 5px 0; }
        .vence-vip { color: var(--dorado); font-weight: 700; font-size: 0.9em; display: block; margin: 10px 0 15px; text-transform: uppercase; }

        .btn-stack { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .btn-act { 
            width: 100%; padding: 18px; border-radius: 15px; border: 3px solid var(--dorado);
            color: white; font-size: 1.05em; font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        
        .btn-conozca { background-color: var(--azul-lindo); }
        .btn-sorteo { 
            background-color: var(--naranja-sorteo);
            position: relative;
            overflow: visible;
        }
        .btn-llegar { background-color: var(--verde); }
        .btn-validar { background-color: var(--rosa); }
        .btn-usar { background-color: #222; color: #555; border-color: #444; pointer-events: none; }
        
        .btn-usar.activo { 
            background: #000; 
            color: var(--dorado-brillante); 
            pointer-events: auto; 
            border: 3px solid var(--dorado);
            animation: glow-pulse 1.5s infinite;
        }

        @keyframes glow-pulse {
            0% { box-shadow: 0 0 5px var(--dorado); border-color: var(--dorado); }
            50% { box-shadow: 0 0 20px var(--dorado); border-color: var(--dorado-brillante); }
            100% { box-shadow: 0 0 5px var(--dorado); border-color: var(--dorado); }
        }

        @keyframes destello-centrifugo {
            0% { 
                box-shadow: 0 0 0 0 rgba(245, 124, 0, 0.9);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 25px rgba(245, 124, 0, 0.4);
                transform: scale(1.03);
            }
            100% { 
                box-shadow: 0 0 0 45px rgba(245, 124, 0, 0);
                transform: scale(1);
            }
        }

        @keyframes borde-brillante {
            0%, 100% { 
                border-color: var(--naranja-sorteo);
                box-shadow: 0 0 10px var(--naranja-sorteo), 0 0 20px rgba(245, 124, 0, 0.5);
            }
            50% { 
                border-color: #ff9800;
                box-shadow: 0 0 25px var(--naranja-sorteo), 0 0 50px rgba(245, 124, 0, 0.8);
            }
        }

        .btn-sorteo.animar-pulso {
            animation: 
                destello-centrifugo 1.5s infinite,
                borde-brillante 1.5s infinite;
            position: relative;
            z-index: 1;
        }

        .btn-sorteo.animar-pulso::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 15px;
            background: rgba(245, 124, 0, 0.3);
            animation: onda-expansiva 1.5s infinite;
            z-index: -1;
        }

        @keyframes onda-expansiva {
            0% {
                width: 100%;
                height: 100%;
                opacity: 1;
            }
            100% {
                width: 140%;
                height: 140%;
                opacity: 0;
            }
        }

        .sin-pulso {
            animation: none !important;
        }
        .sin-pulso::before {
            display: none !important;
        }

        .contador-nube { background: var(--dorado); color: black; padding: 4px 12px; border-radius: 10px; margin-left: 10px; font-size: 1.2em; font-weight: 900; }

        .redes-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);
            display:flex; justify-content:center; align-items:center; z-index:8000;
        }
        .redes-box {
            background: #1a1a1a; padding: 25px; border-radius: 20px; border: 3px solid var(--dorado);
            width: 80%; max-width: 300px; text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-red { 
            display: block; 
            width: 90%; 
            margin: 10px auto; 
            padding: 15px; 
            border-radius: 10px;
            text-decoration: none; 
            color: white; 
            font-weight: bold; 
            text-transform: uppercase;
            text-align: center;
            box-sizing: border-box;
        }

        .advertencia-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000;
        }
        .advertencia-contenido {
            background: white; border-radius: 20px; padding: 30px; text-align: center; 
            width: 85%; max-width: 340px; color: #000; border: 5px solid var(--dorado);
            box-sizing: border-box;
        }
        .btn-si, .btn-no { padding: 16px; font-size: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-si { background: #d32f2f; color: white; }
        .btn-no { background: var(--gris-volver); color: white; }

        .success-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 6000; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 10px;
        }
        .success-card {
            border: 5px solid var(--dorado); border-radius: 30px; padding: 25px 15px;
            width: 94%; max-width: 400px; background: #111; box-sizing: border-box;
        }
        
        .logo-exito-box { 
            display: inline-block; 
            border: 2px solid var(--dorado); 
            padding: 0; 
            border-radius: 12px; 
            background: #000; 
            overflow: hidden; 
            width: 220px; 
            margin-bottom: 15px;
        }
        .logo-exito-box img { width: 100%; height: auto; display: block; }

        .timer-circle { font-size: 60px; font-weight: 800; color: var(--dorado); line-height: 1; }
        .aviso-cajero-vip { margin-top: 15px; padding: 12px; font-size: 19px; font-weight: 900; color: var(--dorado-brillante); animation: parpadeoVIP 1.2s infinite; }
        @keyframes parpadeoVIP { 0% { background: transparent; } 50% { background: rgba(212, 175, 55, 0.5); } 100% { background: transparent; } }

        /* ========== FOOTER CON BOTONES ========== */
        .footer-identificacion {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top: 4px solid var(--dorado);
            padding: 6px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 900;
        }
        
        .footer-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            position: relative;
        }
        
        .footer-link {
            text-decoration: none;
            color: var(--celeste);
            font-weight: 700;
            font-size: 14px;
        }
        
        .btn-footer {
            padding: 5px 12px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 11px;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-instalar-footer {
            background: var(--dorado);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            cursor: pointer;
            border: none;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Botón POSTULACIONES original (sin modificar) */
        .btn-postulaciones {
            background: var(--azul-lindo);
            width: 140px;
            padding: 5px 12px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 11px;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-instalacion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }
        
        .popup-contenido {
            background: #111;
            border-radius: 25px;
            padding: 25px;
            width: 85%;
            max-width: 280px;
            text-align: center;
            border: 4px solid var(--dorado);
        }
        
        .popup-contenido h3 {
            color: var(--dorado);
            margin: 5px 0 10px;
            font-size: 1.3em;
        }
        
        .popup-contenido p {
            color: #ccc;
            font-size: 13px;
            margin: 0 0 15px;
        }
        
        .popup-botones {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn-popup {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        
        .btn-popup-aceptar {
            background: var(--verde);
            color: white;
        }
        
        .btn-popup-cancelar {
            background: var(--gris-volver);
            color: white;
        }
        /* ========== FIN FOOTER ========== */

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #reader { width: 300px; background: white; border-radius: 15px; overflow: hidden; border: 4px solid var(--dorado); }

        .custom-overlay-error {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9500;
        }
        .error-box-vip {
            background: #111; width: 85%; max-width: 350px; border-radius: 20px;
            border: 5px solid var(--dorado); text-align: center; padding: 25px; box-sizing: border-box;
        }
        .error-icon-vip { width: 60px; margin-bottom: 15px; filter: drop-shadow(0 0 5px red); }

        .barcode-container {
            background: white;
            padding: 8px;
            border-radius: 10px;
            margin: 15px 0;
            display: inline-block;
            width: 90%;
        }

        .popup-estandar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }
        .popup-contenido-estandar {
            background: #111;
            border-radius: 25px;
            padding: 25px;
            width: 85%;
            max-width: 280px;
            text-align: center;
            border: 4px solid var(--dorado);
        }
        .popup-contenido-estandar h3 {
            color: var(--dorado);
            margin: 0 0 15px;
            font-size: 1.3em;
            font-weight: 700;
        }
        .btn-popup-postulacion {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-popup-postulacion.comercio {
            background: var(--azul-lindo);
            color: white;
            border: 2px solid var(--dorado);
        }
        .btn-popup-postulacion.comercio:hover {
            background: var(--azul-lindo);
            transform: scale(1.02);
        }
        .btn-popup-postulacion.martillero, .btn-popup-postulacion.colaborador {
            background: #333;
            color: #ccc;
            border: 1px solid #666;
        }
        .btn-popup-postulacion.cerrar {
            background: var(--gris-volver);
            color: white;
            margin-top: 15px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header-vip">
        <div class="logo-box">
            <img src="https://github.com/habitatcar/habitatcar.github.io/blob/main/logo.png?raw=true" alt="Habitat Car">
        </div>
    </div>

    <div class="top-nav">
        <a href="usuarios_terminos.html" class="btn-top">Beneficios</a>
        <a href="usuarios_tutoriales.html" class="btn-top">Tutorial</a>
    </div>

    <!-- ========== FILTROS AGREGADOS ========== -->
    <div class="filtros-container">
        <div class="fila-filtros">
            <select id="filtroProvincia" class="filtro-select" onchange="cambiarFiltroProvincia(this.value)">
                <option value="">TODAS LAS PROVINCIAS</option>
            </select>
            <select id="filtroLocalidad" class="filtro-select" onchange="cambiarFiltroLocalidad(this.value)">
                <option value="">TODAS LAS LOCALIDADES</option>
            </select>
        </div>
        <div class="fila-filtros">
            <button id="btnFiltroProvincia" class="filtro-boton" onclick="toggleFiltroProvincia()">
                📍 MI PROVINCIA
            </button>
            <button id="btnFiltroLocalidad" class="filtro-boton" onclick="toggleFiltroLocalidad()">
                🏘️ MI LOCALIDAD
            </button>
            <button id="btnFiltroCercanos" class="filtro-boton" onclick="toggleFiltroCercania()">
                📱 CERCA DE MÍ
            </button>
        </div>
        <div class="fila-filtros">
            <div class="filtro-busqueda">
                <input type="text" id="filtroNombre" placeholder="Buscar comercio..." oninput="aplicarFiltros()">
            </div>
            <select id="filtroVence" class="filtro-select" style="flex: 0.8;" onchange="aplicarFiltros()">
                <option value="todos">VENCE</option>
                <option value="3">3 días</option>
                <option value="5">5 días</option>
                <option value="7">7 días</option>
                <option value="15">15 días</option>
            </select>
        </div>
        <div id="infoUbicacion" class="info-ubicacion" style="display: none;">
            <i>📍</i> <span id="infoTexto"></span>
            <span id="infoDistancia" class="badge-distancia"></span>
        </div>
    </div>
    <!-- ========== FIN FILTROS ========== -->

    <div class="grilla" id="contenedor-vip"></div>

    <div id="modal-qr" class="modal">
        <h2 style="color:var(--dorado)">Escanee el QR del local</h2>
        <div id="reader"></div>
        <button onclick="cerrarScanner()" style="margin-top:20px; padding:12px 25px; background:var(--dorado); color:black; border-radius:10px; font-weight:bold; border:none;">CANCELAR</button>
    </div>

    <div id="overlay-error-vip" class="custom-overlay-error">
        <div class="error-box-vip">

    <script type="module">
        (function () {

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, increment, serverTimestamp, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",

        const app = initializeApp(firebaseConfig);

        let scanner = null;

        let comerciosCompletos = [];

        // Estado de los filtros
        let filtroProvinciaActivo = false;

        // ============================================
        // FUNCIÓN PARA NORMALIZAR TEXTO (sin acentos, minúsculas)
        // ============================================
        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim();
        }

        // ============================================
        // FUNCIONES DE GEOLOCALIZACIÓN
        // ============================================
        function obtenerUbicacion() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        ubicacionUsuario = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude
                        };
                        document.getElementById('infoTexto').innerHTML = `📍 Ubicación obtenida`;
                        document.getElementById('infoUbicacion').style.display = 'flex';
                        resolve(ubicacionUsuario);
                    },
                    (error) => {
                        let mensaje = "❌ No se pudo obtener ubicación";
                        if (error.code === 1) mensaje = "❌ Permiso denegado";
                        if (error.code === 2) mensaje = "❌ Ubicación no disponible";
                        if (error.code === 3) mensaje = "⏳ Tiempo agotado";
                        document.getElementById('infoTexto').innerHTML = mensaje;
                        document.getElementById('infoUbicacion').style.display = 'flex';
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
                );
            });
        }

        function calcularDistancia(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // ============================================
        // CARGAR PROVINCIAS Y LOCALIDADES
        // ============================================
        async function cargarProvincias() {
            try {
                const res = await fetch("https://apis.datos.gob.ar/georef/api/provincias?campos=nombre&max=100");
                const data = await res.json();
                const comboProv = document.getElementById('filtroProvincia');
                comboProv.innerHTML = '<option value="">TODAS LAS PROVINCIAS</option>';
                todasLasProvincias = data.provincias.map(p => p.nombre);
                todasLasProvincias.sort();
                todasLasProvincias.forEach(prov => {
                    const opt = document.createElement('option');
                    opt.value = prov;
                    opt.textContent = prov;
                    comboProv.appendChild(opt);
                });
            } catch(e) { console.error("Error cargando provincias:", e); }
        }

        window.cargarLocalidades = async (provincia) => {
            const comboLoc = document.getElementById('filtroLocalidad');
            comboLoc.innerHTML = '<option value="">TODAS LAS LOCALIDADES</option>';
            if (!provincia) return;
            try {
                const res = await fetch(`https://apis.datos.gob.ar/georef/api/municipios?provincia=${encodeURIComponent(provincia)}&max=500&campos=nombre`);
                const data = await res.json();
                todasLasLocalidades = (data.municipios || []).map(m => m.nombre);
                todasLasLocalidades.sort();
                todasLasLocalidades.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc;
                    opt.textContent = loc;
                    comboLoc.appendChild(opt);
                });
            } catch(e) { console.error("Error cargando localidades:", e); }
        };

        // ============================================
        // OBTENER DATOS DEL USUARIO
        // ============================================
        const leadId = localStorage.getItem('leadId_v16') || localStorage.getItem('leadId_habitat');
        if (leadId) {
            getDoc(doc(db, "leads", leadId)).then(docSnap => {
                if (docSnap.exists()) {
                    usuarioData = docSnap.data();
                    if (!window.provinciasCargadas) {
                        cargarProvincias();
                        window.provinciasCargadas = true;
                    }
                }
            }).catch(e => console.error("Error cargando usuario:", e));
        } else {
            cargarProvincias();
        }

        // ============================================
        // FUNCIONES DE FILTRO
        // ============================================
        function resetearFiltrosRapidos() {
            filtroProvinciaActivo = false;
            filtroLocalidadActivo = false;
            filtroCercaniaActivo = false;
            document.getElementById('btnFiltroProvincia').classList.remove('activo');
            document.getElementById('btnFiltroLocalidad').classList.remove('activo');
            document.getElementById('btnFiltroCercanos').classList.remove('activo');
            document.getElementById('btnFiltroCercanos').classList.remove('ubicacion-activa');
        }
        
        window.toggleFiltroProvincia = () => {
            if (!usuarioData || !usuarioData.provincia) {
                alert("No tenemos tu provincia registrada.");
                return;
            }
            if (filtroProvinciaActivo) {
                filtroProvinciaActivo = false;
                document.getElementById('btnFiltroProvincia').classList.remove('activo');
                document.getElementById('infoTexto').innerHTML = ``;
                document.getElementById('infoUbicacion').style.display = 'none';
                resetearFiltrosRapidos();
            } else {
                resetearFiltrosRapidos();
                filtroProvinciaActivo = true;
                document.getElementById('btnFiltroProvincia').classList.add('activo');
                document.getElementById('infoTexto').innerHTML = `📍 Mostrando comercios de ${usuarioData.provincia}`;
                document.getElementById('infoUbicacion').style.display = 'flex';
            }
            aplicarFiltros();
        };
        
        window.toggleFiltroLocalidad = () => {
            if (!usuarioData || !usuarioData.localidad) {
                alert("No tenemos tu localidad registrada.");
                return;
            }
            if (filtroLocalidadActivo) {
                filtroLocalidadActivo = false;
                document.getElementById('btnFiltroLocalidad').classList.remove('activo');
                document.getElementById('infoTexto').innerHTML = ``;
                document.getElementById('infoUbicacion').style.display = 'none';
                resetearFiltrosRapidos();
            } else {
                resetearFiltrosRapidos();
                filtroLocalidadActivo = true;
                document.getElementById('btnFiltroLocalidad').classList.add('activo');
                document.getElementById('infoTexto').innerHTML = `🏘️ Mostrando comercios de ${usuarioData.localidad}`;
                document.getElementById('infoUbicacion').style.display = 'flex';
            }
            aplicarFiltros();
        };
        
        window.toggleFiltroCercania = async () => {
            if (filtroCercaniaActivo) {
                filtroCercaniaActivo = false;
                document.getElementById('btnFiltroCercanos').classList.remove('activo');
                document.getElementById('btnFiltroCercanos').classList.remove('ubicacion-activa');
                document.getElementById('infoTexto').innerHTML = ``;
                document.getElementById('infoUbicacion').style.display = 'none';
                resetearFiltrosRapidos();
                aplicarFiltros();
                return;
            }
            resetearFiltrosRapidos();
            document.getElementById('infoTexto').innerHTML = `📍 Obteniendo ubicación...`;
            document.getElementById('infoUbicacion').style.display = 'flex';
            await obtenerUbicacion();
            if (ubicacionUsuario) {
                filtroCercaniaActivo = true;
                document.getElementById('btnFiltroCercanos').classList.add('activo');
                document.getElementById('btnFiltroCercanos').classList.add('ubicacion-activa');
                document.getElementById('infoTexto').innerHTML = `🗺️ Comercios a menos de 10km`;
                aplicarFiltros();
            } else {
                filtroCercaniaActivo = false;
                document.getElementById('btnFiltroCercanos').classList.remove('activo');
                document.getElementById('infoTexto').innerHTML = `❌ No se pudo obtener ubicación`;
                setTimeout(() => {
                    if (!filtroCercaniaActivo) {
                        document.getElementById('infoUbicacion').style.display = 'none';
                    }
                }, 3000);
            }
        };
        
        window.cambiarFiltroProvincia = (provincia) => {
            resetearFiltrosRapidos();
            if (!provincia) {
                document.getElementById('filtroLocalidad').value = "";
                document.getElementById('filtroLocalidad').innerHTML = '<option value="">TODAS LAS LOCALIDADES</option>';
            } else {
                window.cargarLocalidades(provincia);
            }
            aplicarFiltros();
        };
        
        window.cambiarFiltroLocalidad = (localidad) => {
            resetearFiltrosRapidos();
            aplicarFiltros();
        };

        // ============================================
        // APLICAR FILTROS - CON BÚSQUEDA SIN ACENTOS
        // ============================================
        function aplicarFiltros() {
            const texto = document.getElementById('filtroNombre').value.toLowerCase();
            const textoNormalizado = normalizarTexto(texto);
            const vencimiento = document.getElementById('filtroVence').value;
            const provSeleccionada = document.getElementById('filtroProvincia').value;
            const locSeleccionada = document.getElementById('filtroLocalidad').value;
            
            let filtrados = [...comerciosCompletos];
            
            if (texto) {
                filtrados = filtrados.filter(c => {
                    const nombreNormalizado = normalizarTexto(c.nombre || '');
                    return nombreNormalizado.includes(textoNormalizado);
                });
            }
            
            if (filtroProvinciaActivo && usuarioData && usuarioData.provincia) {
                filtrados = filtrados.filter(c => c.provincia === usuarioData.provincia);
            } else if (filtroLocalidadActivo && usuarioData && usuarioData.localidad) {
                filtrados = filtrados.filter(c => (c.localidad || c.ciudad) === usuarioData.localidad);
            } else if (filtroCercaniaActivo && ubicacionUsuario) {
                filtrados = filtrados.filter(c => {
                    if (c.coordenadas && c.coordenadas.lat && c.coordenadas.lng) {
                        const dist = calcularDistancia(ubicacionUsuario.lat, ubicacionUsuario.lng, c.coordenadas.lat, c.coordenadas.lng);
                        c.distanciaCalculada = dist;
                        return dist <= 10;
                    }
                    return false;
                });
                filtrados.sort((a, b) => (a.distanciaCalculada || 999) - (b.distanciaCalculada || 999));
            } else {
                if (provSeleccionada) {
                    filtrados = filtrados.filter(c => c.provincia === provSeleccionada);
                }
                if (locSeleccionada) {
                    filtrados = filtrados.filter(c => (c.localidad || c.ciudad) === locSeleccionada);
                }
            }
            
            if (vencimiento !== 'todos') {
                const diasLimite = parseInt(vencimiento);
                filtrados = filtrados.filter(c => {
                    const vigencia = parseInt(c.vigenciaVip) || 0;
                    if (vigencia === 0) return true;
                    const inicios = JSON.parse(localStorage.getItem('inicios_cupones_vip') || "{}");
                    const inicio = inicios[c.id] || Date.now();
                    const transcurrido = Date.now() - inicio;
                    const diasPasados = Math.floor(transcurrido / (1000 * 60 * 60 * 24));
                    const diasRestantes = vigencia - diasPasados;
                    return diasRestantes <= diasLimite && diasRestantes >= 0;
                });
            }
            
            renderizarComercios(filtrados);
        }
        window.aplicarFiltros = aplicarFiltros;

        // ============================================
        // RENDERIZAR COMERCIOS
        // ============================================
        function renderizarComercios(comercios) {
            const contenedor = document.getElementById('contenedor-vip');
            let html = "";
            const inicios = JSON.parse(localStorage.getItem('inicios_cupones_vip') || "{}");
            
            comercios.forEach(c => {
                const nUso = parseInt(localStorage.getItem('uso_vip_' + c.id) || "0");
                const vigenciaTotal = parseInt(c.vigenciaVip) || 0;
                let diasRestantes = vigenciaTotal;
                let mostrarReloj = vigenciaTotal > 0;
                if (mostrarReloj) {
                    if (!inicios[c.id]) inicios[c.id] = Date.now();
                    const transcurrido = Date.now() - inicios[c.id];
                    const diasPasados = Math.floor(transcurrido / (1000 * 60 * 60 * 24));
                    diasRestantes = vigenciaTotal - diasPasados;
                }
                if (mostrarReloj && diasRestantes < 0) return;
                
                let distanciaHtml = '';
                if (filtroCercaniaActivo && ubicacionUsuario && c.coordenadas && c.distanciaCalculada) {
                    distanciaHtml = `<span class="badge-distancia">📍 a ${c.distanciaCalculada.toFixed(1)}km</span>`;
                }
                
                const htmlLogo = c.logoUrl ? `<div class="logo-container"><img src="${c.logoUrl}" class="logo-c" loading="lazy"></div>` : '';
                const tieneRedes = (c.facebook || c.instagram || c.web || c.sitioWeb);
                const tieneSorteoOPromo = c.titulo_sorteo || c.titulo_promo;
                const yaTocado = localStorage.getItem('toco_sorteo_' + c.id) === 'true';
                const claseAnimacion = yaTocado ? 'sin-pulso' : 'animar-pulso';
                
                const botonSorteo = tieneSorteoOPromo ? 
                    `<button class="btn-act btn-sorteo ${claseAnimacion}" id="btn-sorteo-${c.id}" onclick="tocarSorteo('${c.id}', '${(c.nombre||'').replace(/'/g,"\\'")}')">🎁 SORTEOS y PROMOS</button>` : '';
                
                const mapsUrl = c.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((c.direccion || '') + ' ' + (c.ciudad || '') + ' ' + (c.provincia || ''))}`;
                
                const infoVencimiento = !mostrarReloj
                    ? `★ Sin vencimiento ★`
                    : `★ Vence en ${diasRestantes} días ★`;

                // ── BENEFICIO VIP: leer descVip y detalleVip de Firestore ──
                const descVipRaw   = (c.descVip   || '').toString().trim();
                const detalleVip   = (c.detalleVip || '').toString().trim();
                const descVipDisplay = descVipRaw
                    ? (descVipRaw.includes('%') ? descVipRaw : descVipRaw + '%')
                    : '';
                const beneficioVipTexto = [descVipDisplay, detalleVip].filter(Boolean).join(' ') || 'Consultar';
                const beneficioVipParaLog = beneficioVipTexto.replace(/'/g, "\\'");

                // ── BOTÓN USAR BENEFICIO: verificar límite de usos ──
                const limitUsos = parseInt(c.usosVip) || 0;
                const usosAgotados = limitUsos > 0 && nUso >= limitUsos;
                const botonUsarBeneficio = usosAgotados
                    ? `<button class="btn-act btn-usar" id="btn-usar-${c.id}" style="background:#111;color:#444;border-color:#333;pointer-events:none;cursor:not-allowed;">Beneficio agotado <span class="contador-nube" style="background:#444;">${nUso}/${limitUsos}</span></button>`
                    : `<button class="btn-act btn-usar" id="btn-usar-${c.id}" onclick="preguntarCajeroVIP('${c.id}', '${(c.nombre||'').replace(/'/g,"\\'")}', '${beneficioVipParaLog}')">Usar beneficio <span class="contador-nube">${nUso}</span></button>`;
                
                html += `
                    <div class="card-vip" data-nombre="${(c.nombre || '').toLowerCase()}">
                        ${htmlLogo}
                        <div class="nombre-c">${c.nombre || ''}</div>
                        <div class="beneficio-c">${beneficioVipTexto}</div>
                        <div class="vence-vip">${infoVencimiento} ${distanciaHtml}</div>
                        ${c.direccion ? `<div class="info-txt"><span class="ico-large">📍</span>${c.direccion}</div>` : ""}
                        <div class="btn-stack">
                            ${tieneRedes ? `<button class="btn-act btn-conozca" onclick="verRedes('${c.id}')">Conozca el comercio</button>` : ''}
                            ${botonSorteo}
                            <button class="btn-act btn-llegar" onclick="window.open('${mapsUrl}')">Cómo llegar</button>
                            <button class="btn-act btn-validar" id="btn-val-${c.id}" onclick="abrirQR('${c.id}', '${c.tokenQR}')">Validar con QR</button>
                            ${botonUsarBeneficio}
                        </div>
                    </div>`;
            });
            
            localStorage.setItem('inicios_cupones_vip', JSON.stringify(inicios));
            contenedor.innerHTML = html;
            
            if (scrollPosition > 0) setTimeout(() => window.scrollTo({ top: scrollPosition, behavior: 'auto' }), 100);
        }

        window.tocarSorteo = (id, nombre) => {
            const btn = document.getElementById(`btn-sorteo-${id}`);
            if (btn) {
                btn.classList.remove('animar-pulso');
                btn.classList.add('sin-pulso');
                localStorage.setItem('toco_sorteo_' + id, 'true');
            }
            window.location.href = `usuarios_sorteos_promos.html?id=${encodeURIComponent(nombre)}`;
        };

        window.verRedes = (id) => {
            const c = listaComercios.find(x => x.id === id);
            const overlay = document.createElement('div');
            overlay.className = 'redes-overlay';
            overlay.onclick = () => overlay.remove();
            
            let btns = "";
            if(c.facebook) btns += `<a href="${c.facebook}" target="_blank" class="btn-red" style="background:var(--facebook)">Facebook</a>`;
            if(c.instagram) btns += `<a href="${c.instagram}" target="_blank" class="btn-red" style="background:var(--instagram)">Instagram</a>`;
            if(c.web) btns += `<a href="${c.web}" target="_blank" class="btn-red" style="background:var(--tiktok); border:1px solid white;">TikTok</a>`;
            if(c.sitioWeb) btns += `<a href="${c.sitioWeb}" target="_blank" class="btn-red" style="background:var(--azul-web)">Sitio Web</a>`;
            
            overlay.innerHTML = `<div class="redes-box" onclick="event.stopPropagation()">
                <h3 style="color:var(--dorado); margin-top:0;">${c.nombre}</h3>
                ${btns}
                <button onclick="this.closest('.redes-overlay').remove()" style="margin-top:15px; background:none; border:none; color:gray; font-weight:bold;">CERRAR</button>
            </div>`;
            document.body.appendChild(overlay);
        };

        window.abrirQR = (id, token) => {
            scrollPosition = window.pageYOffset;
            document.getElementById('modal-qr').style.display = 'flex';
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                if (text.trim() === token.trim()) {
                    cerrarScanner();
                    document.getElementById(`btn-usar-${id}`).classList.add('activo');
                    document.getElementById(`btn-val-${id}`).style.display = 'none';
                    
                    const overlay = document.createElement('div');
                    overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;justify-content:center;align-items:center;z-index:9000;";
                    overlay.innerHTML = `
                        <div style="background:white;padding:30px;border-radius:20px;text-align:center;max-width:80%; border:5px solid var(--dorado);">
                            <div style="font-size:60px; margin-bottom:15px;">✅</div>
                            <b style="color:black;font-size:24px;display:block;margin-bottom:10px;">QR VALIDADO</b>
                            <p style="color:#333;font-size:18px;margin:0;font-weight:600;">Ahora pulse el botón "USAR BENEFICIO"</p>
                        </div>`;
                    document.body.appendChild(overlay);
                    setTimeout(() => overlay.remove(), 4000);
                } else {
                    cerrarScanner();
                    document.getElementById('overlay-error-vip').style.display = 'flex';
                }
            }).catch(e => console.error(e));
        };

        window.cerrarScanner = () => {
            document.getElementById('modal-qr').style.display = 'none';
            if(scanner) scanner.stop().then(() => scanner.clear());
        };

        window.cerrarErrorVIP = () => {
            document.getElementById('overlay-error-vip').style.display = 'none';
        };

        window.preguntarCajeroVIP = (id, nombre, beneficio) => {
            const btn = document.getElementById(`btn-usar-${id}`);
            if (!btn.classList.contains('activo')) return;
            const alerta = document.createElement('div');
            alerta.className = 'advertencia-overlay';
            alerta.id = 'alerta-cajero';
            alerta.innerHTML = `
                <div class="advertencia-contenido">
                    <h3 style="color:red;">⚠️ ATENCIÓN</h3>
                    <p>¿Avisaste al cajero que usarás el cupón <b>VIP</b>?<br><br><b>Si no avisaste, perderás el beneficio.</b></p>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-si" onclick="finalizarVIP('${id}', '${nombre.replace(/'/g,"\\'")}', '${beneficio}')">SÍ</button>
                        <button class="btn-no" onclick="document.getElementById('alerta-cajero').remove()">NO</button>
                    </div>
                </div>`;
            document.body.appendChild(alerta);
        };

        // ============================================
        // FINALIZAR VIP — CON LOG COMPLETO
        // ============================================
        window.finalizarVIP = async (id, nom, ben) => {
            document.getElementById('alerta-cajero').remove();
            
            try {
                const ahora = Date.now();
                const fechaLegible = new Date().toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                const comercioRef = doc(db, "comercios", id);
                
                const snapComercio = await getDoc(comercioRef);
                const dataCom = snapComercio.data();
                const proximoNro = (dataCom.totalVips || 0) + 1;
                const codigoIdentidad = "VIP-" + proximoNro.toString().padStart(4, '0');

                await updateDoc(comercioRef, {
                    totalVips: increment(1),
                    vipsHoy: increment(1),
                    vipsSemana: increment(1),
                    vipsMes: increment(1),
                    vipsAnio: increment(1),
                    lastSubmission: fechaLegible 
                });

                const leadIdLocal = localStorage.getItem('leadId_v16') || localStorage.getItem('leadId_habitat');

                const nUsoLocal = parseInt(localStorage.getItem('uso_vip_' + id) || "0") + 1;

                const nombreUsuario = usuarioData
                    ? `${(usuarioData.apellido || '').toUpperCase()}, ${(usuarioData.nombres || usuarioData.nombre || '').toUpperCase()}`.trim().replace(/^,\s*/, '')
                    : '';
                const whatsappUsuario = usuarioData ? (usuarioData.whatsapp || '') : '';

                if (leadIdLocal) {
                    const idComercioLimpio = nom.replace(/\s+/g, '_');
                    const horaL = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                    const fechaD = new Date().toLocaleDateString();

                    await updateDoc(doc(db, "leads", leadIdLocal), {
                        [`canjes_por_comercio.${idComercioLimpio}`]: {
                            comercio: nom,
                            codigo: codigoIdentidad,
                            fecha: fechaD,
                            hora: horaL,
                            cantidad_usos: increment(1)
                        },
                        usos_count: increment(1)
                    });
                }

                JsBarcode("#barcodeVIP", codigoIdentidad, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 2.2,
                    height: 45,
                    displayValue: true,
                    fontSize: 18,
                    fontOptions: "bold" 
                });

                document.getElementById('exito-comercio').innerText = nom;
                document.getElementById('exito-beneficio').innerText = ben;
                document.getElementById('pantalla-exito').style.display = 'flex';

                await addDoc(collection(db, "logs_actividad"), {
                    timestamp: ahora,
                    tipo: "canje",
                    accion: "CANJE VIP",
                    nombreComercio: nom,
                    idValidacion: codigoIdentidad,
                    usoNumero: nUsoLocal,
                    nombre: nombreUsuario,
                    whatsapp: whatsappUsuario,
                    usuarioId: leadIdLocal || '',
                    comercioId: id,
                    modulo: "VIPS",
                    detalle: `${nombreUsuario}${whatsappUsuario ? ' · ' + whatsappUsuario : ''} canjeó beneficio VIP en ${nom} (uso ${nUsoLocal})`
                });

                await addDoc(collection(db, "logs_vip"), { 
                    comercio: nom, 
                    comercioId: id,
                    fecha: serverTimestamp(), 
                    uso_nro: nUsoLocal,
                    tipo: "VIP",
                    beneficio: ben,
                    codigoGenerado: codigoIdentidad,
                    nombre: nombreUsuario,
                    whatsapp: whatsappUsuario
                });

                localStorage.setItem('uso_vip_' + id, nUsoLocal);

                let s = 30;
                const t = setInterval(() => {
                    s--;
                    document.getElementById('countdown').innerText = s;
                    if(s <= 0) { 
                        clearInterval(t); 
                        location.reload(); 
                    }
                }, 1000);
            } catch(e) { 
                console.error("Error al registrar en Log:", e);
                alert("Error de conexión con el servidor de Logs.");
            }
        };

        onSnapshot(collection(db, "comercios"), async (snap) => {
            const comercios = [];
            for (const d of snap.docs) {
                const c = d.data();
                if (c.estado === "inactivo") continue;
                comercios.push({ id: d.id, ...c });
            }
            comerciosCompletos = comercios;
            listaComercios = comercios;
            aplicarFiltros();
        });

        // ============================================
        // FUNCIÓN PARA POSTULACIONES (desde footer)
        // ============================================
        window.abrirPopupPostulaciones = () => {
            const overlay = document.createElement('div');
            overlay.className = 'popup-estandar';
            overlay.innerHTML = `
                <div class="popup-contenido-estandar">
                    <h3>¿QUÉ DESEAS POSTULAR?</h3>
                    <button class="btn-popup-postulacion comercio" onclick="window.location.href='usuarios_comercios_postulacion.html'">🏪 COMERCIO</button>
                    <button class="btn-popup-postulacion martillero" onclick="alert('Próximamente podrás postularte como MARTILLERO')">🔑 MARTILLERO (próximamente)</button>
                    <button class="btn-popup-postulacion colaborador" onclick="alert('Próximamente podrás postularte como COLABORADOR')">👥 COLABORADOR (próximamente)</button>
                    <button class="btn-popup-postulacion cerrar" onclick="this.closest('.popup-estandar').remove()">CERRAR</button>
                </div>
            `;
            document.body.appendChild(overlay);
        };
    </script>

    <script>
    (function() {
        let deferredPrompt;
        const yaInstalado = localStorage.getItem('habitat_pwa_instalada') === 'true';
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
        function mostrarMensajeInstalacion() {
            const popupAnterior = document.querySelector('.popup-instalacion');
            if (popupAnterior) popupAnterior.remove();
            const overlay = document.createElement('div');
            overlay.className = 'popup-instalacion';
            const logoSvg = `<svg width="60" height="60" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="20" fill="#003D80"/><path d="M30 30H70V40H30V30Z" fill="white"/><path d="M30 45H60V55H30V45Z" fill="white"/><path d="M30 60H50V70H30V60Z" fill="white"/><circle cx="75" cy="75" r="15" fill="#FFD700"/><path d="M70 70L80 80M80 70L70 80" stroke="#003D80" stroke-width="3"/></svg>`;
            if (yaInstalado) {
                overlay.innerHTML = `<div class="popup-contenido">${logoSvg}<h3>¡YA ESTÁ INSTALADA!</h3><p><strong>Nuestra aplicación ya se encuentra en tu dispositivo.</strong><br>Buscá el ícono de Hábitat-Car entre tus aplicaciones.</p><div class="popup-botones"><button class="btn-popup btn-popup-aceptar" id="btn-ok-instalada">ACEPTAR</button></div></div>`;
            } else if (!deferredPrompt) {
                overlay.innerHTML = `<div class="popup-contenido">${logoSvg}<h3>INSTALACIÓN</h3><p>Para instalar la aplicación, buscá en el menú de tu navegador la opción <strong>"Agregar a pantalla de inicio"</strong>.</p><div class="popup-botones"><button class="btn-popup btn-popup-aceptar" id="btn-ok-soporte">ENTENDIDO</button></div></div>`;
            } else {
                overlay.innerHTML = `<div class="popup-contenido">${logoSvg}<h3>¡INSTALÁ LA APLICACIÓN!</h3><p><strong>Para no perderte los beneficios</strong> y tener acceso rápido desde tu pantalla de inicio.</p><div class="popup-botones"><button class="btn-popup btn-popup-aceptar" id="btn-instalar-confirmar">INSTALAR</button><button class="btn-popup btn-popup-cancelar" id="btn-instalar-cancelar">RECHAZAR</button></div></div>`;
            }
            document.body.appendChild(overlay);
            if (yaInstalado) document.getElementById('btn-ok-instalada')?.addEventListener('click', () => overlay.remove());
            else if (!deferredPrompt) document.getElementById('btn-ok-soporte')?.addEventListener('click', () => overlay.remove());
            else {
                document.getElementById('btn-instalar-confirmar')?.addEventListener('click', () => { overlay.remove(); if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then((choiceResult) => { if (choiceResult.outcome === 'accepted') localStorage.setItem('habitat_pwa_instalada', 'true'); deferredPrompt = null; }); } });
                document.getElementById('btn-instalar-cancelar')?.addEventListener('click', () => overlay.remove());
            }
        }
        document.addEventListener('DOMContentLoaded', () => { document.getElementById('btn-instalar-footer')?.addEventListener('click', mostrarMensajeInstalacion); });
    })();
    </script>
</body>
</html>
