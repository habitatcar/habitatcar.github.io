<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Premium | Hábitat-Car</title>

    <!-- Fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hábitat-Car">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --dorado: #d4af37;
            --dorado-brillante: #f9f295;
            --negro-fondo: #0a0a0a;
            --negro-card: #141414;
            --azul-lindo: #0056b3;
            --verde: #2e7d32;
            --verde-claro: #4caf50;
            --rosa: #c2185b;
            --naranja-sorteo: #f57c00;
            --gris-volver: #757575;
            --facebook: #1877f2;
            --instagram: #e4405f;
            --tiktok: #000000;
            --azul-web: #0066cc;
            --rojo-error: #e63946;
            --gris-desactivado: #cccccc;
            --rojo-agotado: #b71c1c;
            --gris-texto: #cccccc;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--negro-fondo); 
            color: white;
            font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif; 
            padding-bottom: 95px; 
            width: 100vw;
            overflow-x: hidden;
            overscroll-behavior-y: contain; 
        }

        .header-vip { padding: 25px 15px; text-align: center; background: var(--negro-fondo); border-bottom: 2px solid var(--dorado); }
        .logo-box { 
            display: inline-block; 
            border: 3px solid var(--dorado); 
            padding: 0; 
            border-radius: 15px; 
            background: #000; 
            overflow: hidden; 
        }
        .logo-box img { width: 100%; max-width: 650px; height: auto; display: block; }

        .top-nav { display: flex; gap: 10px; padding: 15px 20px; }
        .btn-top {
            flex: 1; padding: 14px; border-radius: 12px; border: 3px solid var(--dorado);
            color: white; font-weight: 600; font-size: 0.9em; text-align: center; text-decoration: none;
            background: rgba(0,0,0,0.5); text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }

        /* FILTROS COMPACTOS */
        .filtros-container {
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-bottom: 1px solid var(--dorado);
        }
        
        .fila-filtros {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .fila-filtros:last-child {
            margin-bottom: 0;
        }
        
        .filtro-select {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
            cursor: pointer;
        }
        
        .filtro-boton {
            flex: 1;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            background: var(--azul-lindo);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .filtro-boton.activo {
            background: var(--verde);
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--verde);
        }
        
        .filtro-boton.ubicacion-activa {
            background: var(--naranja-sorteo);
            animation: pulsoSuave 1.5s infinite;
        }
        
        @keyframes pulsoSuave {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .filtro-busqueda {
            flex: 2;
            position: relative;
        }
        
        .filtro-busqueda input {
            width: 100%;
            padding: 10px 10px 10px 32px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            font-size: 13px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            background: #1a1a1a;
            color: white;
        }
        
        .filtro-busqueda::before {
            content: "🔍";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            pointer-events: none;
            z-index: 1;
        }
        
        .info-ubicacion {
            font-size: 11px;
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .badge-distancia {
            background: var(--verde);
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
            white-space: nowrap;
        }

        .info-txt { 
            display: block; 
            font-size: 12px; 
            color: var(--gris-texto); 
            margin: 5px 0; 
            font-weight: 500; 
        }
        .ico-large { font-size: 14px; vertical-align: middle; margin-right: 4px; }

        .grilla { padding: 5px 15px; }
        .card-vip { 
            background: var(--negro-card); border-radius: 25px; padding: 20px; 
            margin-bottom: 20px; text-align: center; border: 2px solid var(--dorado); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        .logo-container { 
            width: 140px; 
            height: 140px; 
            margin: 0 auto 12px; 
            border-radius: 50%; 
            background: white; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: 3px solid var(--dorado);
        }
        .logo-c { width: 100%; height: 100%; object-fit: cover; }
        
        .nombre-c { font-size: 1.4em; font-weight: 700; color: var(--dorado-brillante); margin: 5px 0; text-transform: uppercase; }
        .beneficio-c { font-size: 1.4em; font-weight: 700; color: white; margin: 5px 0; white-space: pre-wrap; word-break: break-word; }
        .vence-vip { color: var(--dorado); font-weight: 600; font-size: 0.85em; display: block; margin: 8px 0; text-transform: uppercase; }

        .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-act { 
            width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--dorado);
            color: white; font-size: 0.9em; font-weight: 600; cursor: pointer; text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-conozca { background-color: var(--azul-lindo); }
        .btn-sorteo { background-color: var(--naranja-sorteo); position: relative; overflow: visible; }
        .btn-llegar { background-color: var(--verde); }
        .btn-validar { background-color: var(--rosa); }
        
        .btn-usar { 
            background-color: var(--gris-desactivado); 
            color: white;
            border-color: #444; 
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-usar.activo { 
            background: #000; 
            color: var(--dorado-brillante); 
            pointer-events: auto; 
            border: 2px solid var(--dorado);
            animation: glow-pulse 1.5s infinite;
        }
        
        .contador-inline {
            background: var(--verde-claro);
            color: white;
            padding: 2px 8px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
            min-width: 35px;
            display: inline-block;
            text-align: center;
        }
        .contador-inline.agotado { background: var(--rojo-agotado); }

        @keyframes glow-pulse {
            0% { box-shadow: 0 0 5px var(--dorado); border-color: var(--dorado); }
            50% { box-shadow: 0 0 15px var(--dorado); border-color: var(--dorado-brillante); }
            100% { box-shadow: 0 0 5px var(--dorado); border-color: var(--dorado); }
        }

        @keyframes destello-centrifugo {
            0% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0.9); transform: scale(1); }
            50% { box-shadow: 0 0 0 25px rgba(245, 124, 0, 0.4); transform: scale(1.03); }
            100% { box-shadow: 0 0 0 45px rgba(245, 124, 0, 0); transform: scale(1); }
        }

        @keyframes borde-brillante {
            0%, 100% { border-color: var(--naranja-sorteo); box-shadow: 0 0 10px var(--naranja-sorteo); }
            50% { border-color: #ff9800; box-shadow: 0 0 25px var(--naranja-sorteo); }
        }

        .btn-sorteo.animar-pulso {
            animation: destello-centrifugo 1.5s infinite, borde-brillante 1.5s infinite;
            position: relative;
            z-index: 1;
        }
        .btn-sorteo.animar-pulso::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: rgba(245, 124, 0, 0.3);
            animation: onda-expansiva 1.5s infinite;
            z-index: -1;
        }
        @keyframes onda-expansiva {
            0% { width: 100%; height: 100%; opacity: 1; }
            100% { width: 140%; height: 140%; opacity: 0; }
        }
        .sin-pulso { animation: none !important; }
        .sin-pulso::before { display: none !important; }

        .redes-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);
            display:flex; justify-content:center; align-items:center; z-index:8000;
        }
        .redes-box {
            background: #1a1a1a; padding: 20px; border-radius: 20px; border: 3px solid var(--dorado);
            width: 80%; max-width: 280px; text-align: center;
        }
        .btn-red { 
            display: block; 
            width: 90%; 
            margin: 8px auto; 
            padding: 12px; 
            border-radius: 10px;
            text-decoration: none; 
            color: white; 
            font-weight: 600; 
            text-transform: uppercase;
            text-align: center;
        }

        .advertencia-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000;
        }
        .advertencia-contenido {
            background: white; border-radius: 20px; padding: 25px; text-align: center; 
            width: 85%; max-width: 320px; color: #000; border: 5px solid var(--dorado);
        }
        .btn-si, .btn-no { padding: 12px; font-size: 15px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; flex: 1; }
        .btn-si { background: #d32f2f; color: white; }
        .btn-no { background: var(--gris-volver); color: white; }

        .success-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 6000; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 10px;
        }
        .success-card {
            border: 5px solid var(--dorado); border-radius: 25px; padding: 20px 15px;
            width: 94%; max-width: 380px; background: #111;
        }
        .logo-exito-box { 
            display: inline-block; 
            border: 2px solid var(--dorado); 
            padding: 0; 
            border-radius: 10px; 
            background: #000; 
            overflow: hidden; 
            width: 180px; 
            margin-bottom: 10px;
        }
        .logo-exito-box img { width: 100%; height: auto; }
        .timer-circle { font-size: 48px; font-weight: 800; color: var(--dorado); line-height: 1; }
        .aviso-cajero-vip { margin-top: 10px; padding: 8px; font-size: 16px; font-weight: 900; color: var(--dorado-brillante); animation: parpadeoVIP 1.2s infinite; }
        @keyframes parpadeoVIP { 0% { background: transparent; } 50% { background: rgba(212, 175, 55, 0.5); } 100% { background: transparent; } }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #reader { width: 280px; background: white; border-radius: 15px; overflow: hidden; border: 4px solid var(--dorado); }

        .custom-overlay-error {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9500;
        }
        .error-box-vip {
            background: #111; width: 85%; max-width: 320px; border-radius: 20px;
            border: 5px solid var(--dorado); text-align: center; padding: 20px;
        }
        .error-icon-vip { width: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 5px red); }

        .barcode-container {
            background: white;
            padding: 8px;
            border-radius: 10px;
            margin: 10px 0;
            display: inline-block;
            width: 90%;
        }

        #overlay-ganadores {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .popup-ganadores {
            background: #111;
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            border: 3px solid var(--dorado);
            max-height: 80vh;
            overflow-y: auto;
        }
        .popup-ganadores h2 { color: var(--dorado); font-size: 1.5em; margin: 0 0 15px; }
        .ganador-item {
            background: rgba(0,0,0,0.3);
            border-left: 4px solid var(--dorado);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: left;
        }
        .ganador-nombre { font-size: 1.1em; font-weight: bold; color: var(--dorado); margin-bottom: 3px; }
        .ganador-localidad { font-size: 0.85em; color: #ccc; }
        .btn-cerrar-ganadores {
            background: var(--dorado);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
        }

        .qr-validado-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9000;
        }
        .qr-validado-contenido {
            background: white;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            max-width: 200px;
            width: 70%;
            border: 4px solid var(--dorado);
        }
        .qr-validado-contenido .check-icon { font-size: 40px; margin-bottom: 5px; }
        .qr-validado-contenido h3 { color: black; font-size: 18px; margin: 5px 0; }
        .qr-validado-contenido p { color: #333; font-size: 13px; margin: 0; }

        .popup-estandar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }
        .popup-contenido-estandar {
            background: #111;
            border-radius: 25px;
            padding: 25px;
            width: 85%;
            max-width: 280px;
            text-align: center;
            border: 4px solid var(--dorado);
        }
        .popup-contenido-estandar h3 { color: var(--dorado); margin: 0 0 15px; font-size: 1.3em; font-weight: 700; }
        .btn-popup-postulacion {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-popup-postulacion.comercio {
            background: var(--azul-lindo);
            color: white;
            border: 2px solid var(--dorado);
        }
        .btn-popup-postulacion.comercio:hover { background: var(--azul-lindo); transform: scale(1.02); }
        .btn-popup-postulacion.martillero, .btn-popup-postulacion.colaborador {
            background: #333;
            color: #ccc;
            border: 1px solid #666;
        }
        .btn-popup-postulacion.cerrar {
            background: var(--gris-volver);
            color: white;
            margin-top: 15px;
            border: none;
        }

        .footer-identificacion {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top: 4px solid var(--dorado);
            padding: 6px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 900;
        }
        .footer-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            position: relative;
        }
        .footer-link {
            text-decoration: none;
            color: #000;
            font-weight: 600;
            font-size: 12px;
        }
        .btn-footer {
            padding: 5px 12px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 11px;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-instalar-footer {
            background: var(--dorado);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            cursor: pointer;
            border: none;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }
        .popup-instalacion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }
        .popup-contenido {
            background: #111;
            border-radius: 25px;
            padding: 25px;
            width: 85%;
            max-width: 280px;
            text-align: center;
            border: 4px solid var(--dorado);
        }
        .popup-contenido h3 { color: var(--dorado); margin: 5px 0 10px; font-size: 1.3em; }
        .popup-contenido p { color: #ccc; font-size: 13px; margin: 0 0 15px; }
        .popup-botones { display: flex; gap: 10px; justify-content: center; }
        .btn-popup { flex: 1; padding: 8px; border: none; border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .btn-popup-aceptar { background: var(--verde); color: white; }
        .btn-popup-cancelar { background: var(--rojo-error); color: white; }
    </style>
</head>
<body>

    <div class="header-vip">
        <div class="logo-box">
            <img src="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png" alt="Habitat Car">
        </div>
    </div>

    <div class="top-nav">
        <a href="usuarios_terminos.html" class="btn-top">Beneficios</a>
        <a href="usuarios_tutoriales.html" class="btn-top">Tutorial</a>
    </div>

    <div class="filtros-container">
        <div class="fila-filtros">
            <select id="filtroProvincia" class="filtro-select" onchange="cambiarFiltroProvincia(this.value)">
                <option value="">TODAS LAS PROVINCIAS</option>
            </select>
            <select id="filtroLocalidad" class="filtro-select" onchange="cambiarFiltroLocalidad(this.value)">
                <option value="">TODAS LAS LOCALIDADES</option>
            </select>
        </div>
        <div class="fila-filtros">
            <button id="btnFiltroProvincia" class="filtro-boton" onclick="toggleFiltroProvincia()">
                📍 MI PROVINCIA
            </button>
            <button id="btnFiltroLocalidad" class="filtro-boton" onclick="toggleFiltroLocalidad()">
                🏘️ MI LOCALIDAD
            </button>
            <button id="btnFiltroCercanos" class="filtro-boton" onclick="toggleFiltroCercania()">
                📱 CERCA DE MÍ
            </button>
        </div>
        <div class="fila-filtros">
            <div class="filtro-busqueda">
                <input type="text" id="filtroNombre" placeholder="Buscar comercio..." onkeyup="aplicarFiltros()">
            </div>
            <select id="filtroVence" class="filtro-select" style="flex: 0.8;" onchange="aplicarFiltros()">
                <option value="todos">VENCE</option>
                <option value="3">3 días</option>
                <option value="5">5 días</option>
                <option value="7">7 días</option>
                <option value="15">15 días</option>
            </select>
        </div>
        <div id="infoUbicacion" class="info-ubicacion" style="display: none;">
            <i>📍</i> <span id="infoTexto"></span>
            <span id="infoDistancia" class="badge-distancia"></span>
        </div>
    </div>

    <div class="grilla" id="contenedor-vip"></div>

    <div id="modal-qr" class="modal">

        async function getUsosRealizadosDesdeFirestore(comercioId, forzar = false) {
            const leadIdLocal = localStorage.getItem('leadId_v16') || localStorage.getItem('leadId_habitat');
            if (!leadIdLocal) return 0;

                return cacheUsos[comercioId].valor;

            try {
                const leadDoc = await getDoc(doc(db, "leads", leadIdLocal));
                if (leadDoc.exists()) {
                    const data = leadDoc.data();
                    const canjes = data.canjes_por_comercio || {};
                    const comercioObj = listaComercios.find(x => x.id === comercioId);
                    const claveNombre = comercioObj ? comercioObj.nombre.replace(/\s+/g, '_') : comercioId.replace(/\s+/g, '_');
                    const usos = canjes[claveNombre]?.cantidad_usos || 0;
                    
                    cacheUsos[comercioId] = {
                        valor: usos,
                        timestamp: Date.now()
                    };
                    
                    localStorage.setItem('uso_vip_' + comercioId, usos);

        // ============================================

        function obtenerUbicacion() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        ubicacionUsuario = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            precision: pos.coords.accuracy
                        };
                        document.getElementById('infoTexto').innerHTML = `📍 Ubicación obtenida`;
                        document.getElementById('infoUbicacion').style.display = 'flex';
                        resolve(ubicacionUsuario);
                    },
                    (error) => {
                        let mensaje = "❌ No se pudo obtener ubicación";
                        if (error.code === 1) mensaje = "❌ Permiso denegado";
                        if (error.code === 2) mensaje = "❌ Ubicación no disponible";
                        if (error.code === 3) mensaje = "⏳ Tiempo agotado";
                        document.getElementById('infoTexto').innerHTML = mensaje;
                        document.getElementById('infoUbicacion').style.display = 'flex';
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
                );
            });
        }

        function calcularDistancia(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

                todasLasProvincias.forEach(prov => {
                    const opt = document.createElement('option');
                    opt.value = prov;
                    opt.textContent = prov;
                    comboProv.appendChild(opt);

        function aplicarFiltros() {
            const texto = document.getElementById('filtroNombre').value.toLowerCase();
            const vencimiento = document.getElementById('filtroVence').value;
            const provSeleccionada = document.getElementById('filtroProvincia').value;
            const locSeleccionada = document.getElementById('filtroLocalidad').value;
            
            let filtrados = [...comerciosCompletos];
            
            if (texto) {
                filtrados = filtrados.filter(c => (c.nombre || '').toLowerCase().includes(texto));
            }
            
            if (filtroProvinciaActivo && usuarioData && usuarioData.provincia) {
                filtrados = filtrados.filter(c => c.provincia === usuarioData.provincia);
            } else if (filtroLocalidadActivo && usuarioData && usuarioData.localidad) {
                filtrados = filtrados.filter(c => (c.localidad || c.ciudad) === usuarioData.localidad);
            } else if (filtroCercaniaActivo && ubicacionUsuario) {
                filtrados = filtrados.filter(c => {
                    if (c.coordenadas && c.coordenadas.lat && c.coordenadas.lng) {
                        const dist = calcularDistancia(ubicacionUsuario.lat, ubicacionUsuario.lng, c.coordenadas.lat, c.coordenadas.lng);
                        c.distanciaCalculada = dist;
                        return dist <= 10;
                    }
                    return false;
                });
                filtrados.sort((a, b) => (a.distanciaCalculada || 999) - (b.distanciaCalculada || 999));
            } else {
                if (provSeleccionada) {
                    filtrados = filtrados.filter(c => c.provincia === provSeleccionada);
                }
                if (locSeleccionada) {
                    filtrados = filtrados.filter(c => (c.localidad || c.ciudad) === locSeleccionada);
                }
            }
            
            if (vencimiento !== 'todos') {
                const diasLimite = parseInt(vencimiento);
                filtrados = filtrados.filter(c => {
                    const vigencia = parseInt(c.vigenciaVip) || 0;
                    if (vigencia === 0) return true;
                    const inicios = JSON.parse(localStorage.getItem('inicios_cupones_vip') || "{}");
                    const inicio = inicios[c.id] || Date.now();
                    const transcurrido = Date.now() - inicio;
                    const diasPasados = Math.floor(transcurrido / (1000 * 60 * 60 * 24));
                    const diasRestantes = vigencia - diasPasados;
                    return diasRestantes <= diasLimite && diasRestantes >= 0;
                });
            }
            
            renderizarComercios(filtrados);
        }

        function obtenerNombreParcial(nombreCompleto) {
            if (!nombreCompleto) return "Anónimo";
            const partes = nombreCompleto.split(' ');
            if (partes.length === 0) return "Anónimo";
            const primerNombre = partes[0];
            const nombreCorto = primerNombre.length > 6 ? primerNombre.substring(0, 6) + '...' : primerNombre;
            if (partes.length > 1) {
                const apellido = partes[partes.length - 1];
                const letraApellido = apellido.charAt(0).toUpperCase();
                return `${nombreCorto} ${letraApellido}.`;
            }
            return nombreCorto;
        }

        async function renderizarComercios(comercios) {
            const contenedor = document.getElementById('contenedor-vip');
            let html = "";
            const inicios = JSON.parse(localStorage.getItem('inicios_cupones_vip') || "{}");
            
            for (const c of comercios) {
                const usosRealizados = await getUsosRealizadosDesdeFirestore(c.id);
                const usosPermitidos = parseInt(c.usosVip) || 0;
                const esAgotado = (usosPermitidos > 0 && usosRealizados >= usosPermitidos);
                
                const vigenciaTotal = parseInt(c.vigenciaVip) || 0;
                let diasRestantes = vigenciaTotal;
                let mostrarReloj = vigenciaTotal > 0;
                if (mostrarReloj) {
                    if (!inicios[c.id]) inicios[c.id] = Date.now();
                    const transcurrido = Date.now() - inicios[c.id];
                    const diasPasados = Math.floor(transcurrido / (1000 * 60 * 60 * 24));
                    diasRestantes = vigenciaTotal - diasPasados;
                }
                if (mostrarReloj && diasRestantes < 0) continue;
                
                let distanciaHtml = '';
                if (filtroCercaniaActivo && ubicacionUsuario && c.coordenadas && c.distanciaCalculada) {
                    distanciaHtml = `<span class="badge-distancia">📍 a ${c.distanciaCalculada.toFixed(1)}km</span>`;
                }
                
                const htmlLogo = c.logoUrl ? `<div class="logo-container"><img src="${c.logoUrl}" class="logo-c" onerror="this.src='https://via.placeholder.com/120?text=Logo'"></div>` : '';
                const beneficioCompleto = (c.descVip || '0%') + (c.detalleVip ? ' ' + c.detalleVip : '');
                const tieneRedes = (c.facebook || c.instagram || c.web || c.sitioWeb);
                const tieneSorteo = c.titulo_sorteo ? true : false;
                const tienePromo = c.titulo_promo ? true : false;
                const tieneSorteoOPromo = tieneSorteo || tienePromo;
                
                let botonSorteo = '';
                if (tieneSorteoOPromo) {
                    const yaTocado = localStorage.getItem('toco_sorteo_' + c.id) === 'true';
                    const claseAnimacion = yaTocado ? 'sin-pulso' : 'animar-pulso';
                    botonSorteo = `<button class="btn-act btn-sorteo ${claseAnimacion}" id="btn-sorteo-${c.id}" data-nombre="${c.nombre}" onclick="tocarSorteo('${c.id}', '${c.nombre}')">🎁 SORTEOS y PROMOS</button>`;
                }
                
                const mapsUrl = c.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((c.direccion || '') + ' ' + (c.ciudad || '') + ' ' + (c.provincia || ''))}`;
                
                let textoBoton = '';
                let infoVencimiento = '';
                if (!mostrarReloj) {
                    infoVencimiento = `★ Sin vencimiento ★`;
                } else {
                    infoVencimiento = `★ Vence en ${diasRestantes} días ★`;
                }
                
                if (esAgotado) {
                    textoBoton = 'AGOTADO';
                } else {
                    if (usosPermitidos > 0) {
                        textoBoton = `Usar beneficio <span class="contador-inline">${usosRealizados}/${usosPermitidos}</span>`;
                    } else {
                        textoBoton = `Usar beneficio <span class="contador-inline">${usosRealizados}</span>`;
                    }
                }
                
                html += `
                    <div class="card-vip" data-nombre="${(c.nombre || '').toLowerCase()}" data-id="${c.id}">
                        ${htmlLogo}
                        <div class="nombre-c">${c.nombre || ''}</div>
                        <div class="beneficio-c">${beneficioCompleto}</div>
                        <div class="vence-vip">${infoVencimiento} ${distanciaHtml}</div>
                        ${c.direccion ? `<div class="info-txt"><span class="ico-large">📍</span>${c.direccion}</div>` : ""}
                        <div class="btn-stack">
                            ${tieneRedes ? `<button class="btn-act btn-conozca" onclick="verRedes('${c.id}')">Conozca el comercio</button>` : ''}
                            ${botonSorteo}
                            <button class="btn-act btn-llegar" onclick="window.open('${mapsUrl}')">Cómo llegar</button>
                            <button class="btn-act btn-validar" id="btn-val-${c.id}" onclick="abrirQR('${c.id}', '${c.tokenQR}')">Validar con QR</button>
                            <button class="btn-act btn-usar" id="btn-usar-${c.id}" onclick="preguntarCajeroVIP('${c.id}', '${c.nombre}', '${beneficioCompleto}')" ${esAgotado ? 'disabled' : ''}>
                                ${textoBoton}
                            </button>
                        </div>
                    </div>`;
            }
            
            localStorage.setItem('inicios_cupones_vip', JSON.stringify(inicios));
            contenedor.innerHTML = html;
            
            setTimeout(async () => {
                for (const c of comercios) {
                    if (c.titulo_sorteo) {
                        const ganadores = await verificarSorteoFinalizado(c.nombre, c.titulo_sorteo);
                        if (ganadores && ganadores.length > 0 && !localStorage.getItem(`visto_ganadores_${c.nombre}_${c.titulo_sorteo}`)) {
                            const btn = document.getElementById(`btn-sorteo-${c.id}`);
                            if (btn) {
                                iniciarAlternanciaTexto(btn, c.nombre, ganadores, c.titulo_sorteo);
                                btn.dataset.nombre = c.nombre;
                            }
                        }
                    }
                }
            }, 500);
            
            if (scrollPosition > 0) setTimeout(() => window.scrollTo({ top: scrollPosition, behavior: 'auto' }), 100);
        }

        window.tocarSorteo = (id, nombre) => {
            const btn = document.getElementById(`btn-sorteo-${id}`);
            if (btn) { btn.classList.remove('animar-pulso'); btn.classList.add('sin-pulso'); }
            localStorage.setItem('toco_sorteo_' + id, 'true');
            window.location.href = `usuarios_sorteos_promos.html?id=${encodeURIComponent(nombre)}`;
        };

        window.verRedes = (id) => {
            const c = listaComercios.find(x => x.id === id);
            if (!c) return;
            const overlay = document.createElement('div');
            overlay.className = 'redes-overlay';
            overlay.onclick = () => overlay.remove();
            let btns = "";
            if(c.facebook) btns += `<a href="${c.facebook}" target="_blank" class="btn-red" style="background:var(--facebook)">Facebook</a>`;
            if(c.instagram) btns += `<a href="${c.instagram}" target="_blank" class="btn-red" style="background:var(--instagram)">Instagram</a>`;
            if(c.web) btns += `<a href="${c.web}" target="_blank" class="btn-red" style="background:var(--tiktok); border:1px solid white;">TikTok</a>`;
            if(c.sitioWeb) btns += `<a href="${c.sitioWeb}" target="_blank" class="btn-red" style="background:var(--azul-web)">Sitio Web</a>`;
            overlay.innerHTML = `<div class="redes-box" onclick="event.stopPropagation()"><h3 style="color:var(--dorado); margin-top:0;">${c.nombre}</h3>${btns}<button onclick="this.closest('.redes-overlay').remove()" style="margin-top:12px; background:none; border:none; color:gray; font-weight:bold;">CERRAR</button></div>`;
            document.body.appendChild(overlay);
        };

        window.abrirQR = (id, token) => {
            scrollPosition = window.pageYOffset;
            document.getElementById('modal-qr').style.display = 'flex';
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                if (text.trim() === token.trim()) {
                    cerrarScanner();
                    const btnUsar = document.getElementById(`btn-usar-${id}`);
                    if(btnUsar) btnUsar.classList.add('activo');
                    const btnVal = document.getElementById(`btn-val-${id}`);
                    if(btnVal) btnVal.style.display = 'none';
                    const overlay = document.createElement('div');
                    overlay.className = 'qr-validado-overlay';
                    overlay.innerHTML = `<div class="qr-validado-contenido"><div class="check-icon">✅</div><h3>QR VALIDADO</h3><p>Ahora pulse el botón "USAR BENEFICIO"</p></div>`;
                    document.body.appendChild(overlay);
                    setTimeout(() => overlay.remove(), 4000);
                } else {
                    cerrarScanner();
                    document.getElementById('overlay-error-vip').style.display = 'flex';
                }
            }).catch(e => console.error(e));
        };

        window.cerrarScanner = () => {
            document.getElementById('modal-qr').style.display = 'none';
            if(scanner) scanner.stop().then(() => scanner.clear());
        };

        window.cerrarErrorVIP = () => document.getElementById('overlay-error-vip').style.display = 'none';

        // ============================================
        // ⭐ PREGUNTAR CAJERO VIP (CORREGIDO)
        // ============================================
        window.preguntarCajeroVIP = async (id, nombre, beneficio) => {
            const btn = document.getElementById(`btn-usar-${id}`);
            if (!btn || !btn.classList.contains('activo')) {
                alert("⚠️ Primero debes validar el QR del comercio.");
                return;
            }
            
            // Verificar localStorage primero (persiste entre recargas)
            const leadIdChk = localStorage.getItem('leadId_v16') || localStorage.getItem('leadId_habitat');
            if (leadIdChk && localStorage.getItem(`agotado_vip_${leadIdChk}_${id}`) === 'true') {
                btn.innerHTML = 'AGOTADO'; btn.disabled = true; btn.classList.remove('activo');
                const bv = document.getElementById(`btn-val-${id}`);
                if (bv) { bv.disabled = true; bv.style.opacity = '0.4'; bv.onclick = null; }
                return;
            }
            // Forzar lectura Firestore para verificar límite
            const usosActuales = await getUsosRealizadosDesdeFirestore(id, true);
            const comercio = listaComercios.find(c => c.id === id);
            if (comercio) {
                const usosPermitidos = parseInt(comercio.usosVip) || 0;
                if (usosPermitidos > 0 && usosActuales >= usosPermitidos) {
                    alert(`❌ Este cupón ya ha sido usado ${usosPermitidos} vez/veces y no tiene más usos disponibles.`);
                    await actualizarBotonComercio(id, true);
                    return;
                }
            }
            
            const alerta = document.createElement('div');
            alerta.className = 'advertencia-overlay';
            alerta.id = 'alerta-cajero';
            alerta.innerHTML = `<div class="advertencia-contenido"><h3 style="color:red;">⚠️ ATENCIÓN</h3><p>¿Avisaste al cajero que usarás el cupón <b>VIP</b>?<br><br><b>Si no avisaste, perderás el beneficio.</b></p><div style="display:flex; gap:10px;"><button class="btn-si" onclick="finalizarVIP('${id}', '${nombre}', '${beneficio}')">SÍ</button><button class="btn-no" onclick="document.getElementById('alerta-cajero').remove()">NO</button></div></div>`;
            document.body.appendChild(alerta);
        };

        // ============================================
        // ⭐ FINALIZAR VIP (CORREGIDO - Actualiza el botón después del uso)
        // ============================================
        window.finalizarVIP = async (id, nom, ben) => {
            document.getElementById('alerta-cajero')?.remove();
            
            const leadIdLocal = localStorage.getItem('leadId_v16') || localStorage.getItem('leadId_habitat');
            if (!leadIdLocal) {
                alert("Error: No se encontró tu sesión");
                return;
            }
            
            try {
                const ahora = Date.now();
                const fechaLegible = new Date().toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
                const comercioRef = doc(db, "comercios", id);
                const snapComercio = await getDoc(comercioRef);
                const dataCom = snapComercio.data();
                const usosPermitidos = parseInt(dataCom.usosVip) || 0;
                
                // Verificar nuevamente desde Firestore ANTES de procesar
                const usosActuales = await getUsosRealizadosDesdeFirestore(id);
                
                if (usosPermitidos > 0 && usosActuales >= usosPermitidos) {
                    alert(`❌ Este cupón ya ha sido usado ${usosPermitidos} vez/veces y no tiene más usos disponibles.`);
                    await actualizarBotonComercio(id);
                    return;
                }
                
                const nuevosUsos = usosActuales + 1;
                const proximoNro = (dataCom.totalVips || 0) + 1;
                const codigoIdentidad = "VIP-" + proximoNro.toString().padStart(4, '0');
                
                // Actualizar comercio
                await updateDoc(comercioRef, { 
                    totalVips: increment(1), 
                    vipsHoy: increment(1), 
                    vipsSemana: increment(1), 
                    vipsMes: increment(1), 
                    vipsAnio: increment(1), 
                    lastSubmission: fechaLegible 
                });
                
                // Actualizar lead
                const idComercioLimpio = nom.replace(/\s+/g, '_');
                const horaL = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                const nUso = new Date().toLocaleDateString();
                
                const leadRef = doc(db, "leads", leadIdLocal);
                const leadDoc = await getDoc(leadRef);
                const leadData = leadDoc.data();
                
                await updateDoc(leadRef, { 
                    [`canjes_por_comercio.${idComercioLimpio}`]: { 
                        comercio: nom, 
                        codigo: codigoIdentidad, 
                        fecha: nUso, 
                        hora: horaL, 
                        cantidad_usos: nuevosUsos 
                    }, 
                    usos_count: (leadData.usos_count || 0) + 1,
                    lastSubmission: Date.now()
                });
                
                // Actualizar caché inmediatamente
                cacheUsos[id] = {
                    valor: nuevosUsos,
                    timestamp: Date.now()
                };
                localStorage.setItem('uso_vip_' + id, nuevosUsos);
                
                // ⭐ ACTUALIZAR BOTÓN DIRECTO con valores ya calculados (sin Firestore)
                const btnUsarFinal = document.getElementById(`btn-usar-${id}`);
                const btnValFinal  = document.getElementById(`btn-val-${id}`);
                const leadIdFinal  = localStorage.getItem('leadId_v16') || localStorage.getItem('leadId_habitat');
                if (btnUsarFinal) {
                    if (usosPermitidos > 0 && nuevosUsos >= usosPermitidos) {
                        btnUsarFinal.innerHTML = 'AGOTADO';
                        btnUsarFinal.disabled = true;
                        btnUsarFinal.classList.remove('activo');
                        if (btnValFinal) { btnValFinal.disabled = true; btnValFinal.style.opacity = '0.4'; btnValFinal.onclick = null; }
                        if (leadIdFinal) localStorage.setItem(`agotado_vip_${leadIdFinal}_${id}`, 'true');
                    } else {
                        if (usosPermitidos > 0) {
                            btnUsarFinal.innerHTML = `Usar beneficio <span class="contador-inline">${nuevosUsos}/${usosPermitidos}</span>`;
                        } else {
                            btnUsarFinal.innerHTML = `Usar beneficio <span class="contador-inline">${nuevosUsos}</span>`;
                        }
                    }
                }
                
                // Generar código de barras
                JsBarcode("#barcodeVIP", codigoIdentidad, { format: "CODE128", lineColor: "#000", width: 2, height: 40, displayValue: true, fontSize: 14 });
                document.getElementById('exito-comercio').innerText = nom;
                document.getElementById('exito-beneficio').innerText = ben;
                document.getElementById('pantalla-exito').style.display = 'flex';
                
                // Registrar logs
                await addDoc(collection(db, "logs_actividad"), { 
                    timestamp: ahora, 
                    tipo: "canje", 
                    accion: "CANJE VIP", 
                    nombre: `${codigoIdentidad} canjeó ${ben} en ${nom} (uso ${nuevosUsos}/${usosPermitidos === 0 ? '∞' : usosPermitidos})`, 
                    comercioId: id, 
                    modulo: "VIPS" 
                });
                
                await addDoc(collection(db, "logs_vip"), { 
                    comercio: nom, 
                    comercioId: id, 
                    fecha: serverTimestamp(), 
                    uso_nro: nuevosUsos, 
                    tipo: "VIP", 
                    beneficio: ben, 
                    codigoGenerado: codigoIdentidad 
                });
                
                // Contador regresivo
                let s = 30;
                const t = setInterval(() => { 
                    s--; 
                    document.getElementById('countdown').innerText = s; 
                    if(s <= 0) { 
                        clearInterval(t); 
                        document.getElementById('pantalla-exito').style.display = 'none';
                        const card = document.querySelector(`.card-vip[data-id="${id}"]`);
                        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } 
                }, 1000);
                
            } catch(e) { 
                console.error("Error:", e); 
                alert("Error de conexión. Por favor, intentá nuevamente.");
            }
        };

        // ============================================
        // SNAPSHOT DE COMERCIOS
        // ============================================
        onSnapshot(collection(db, "comercios"), async (snap) => {
            const comercios = [];
            for (const d of snap.docs) {
                const c = d.data();
                if (c.estado === "inactivo") continue;
                comercios.push({ id: d.id, ...c });
            }
            comerciosCompletos = comercios;
            listaComercios = comercios;
            aplicarFiltros();
        });

        window.abrirPopupPostulaciones = () => {
            const overlay = document.createElement('div');
            overlay.className = 'popup-estandar';
            overlay.innerHTML = `
                <div class="popup-contenido-estandar">
                    <h3>¿QUÉ DESEAS POSTULAR?</h3>
                    <button class="btn-popup-postulacion comercio" onclick="window.location.href='usuarios_comercios_postulacion.html'">🏪 COMERCIO</button>
                    <button class="btn-popup-postulacion martillero" onclick="alert('Próximamente podrás postularte como MARTILLERO')">🔑 MARTILLERO (próximamente)</button>
                    <button class="btn-popup-postulacion colaborador" onclick="alert('Próximamente podrás postularte como COLABORADOR')">👥 COLABORADOR (próximamente)</button>
                    <button class="btn-popup-postulacion cerrar" onclick="this.closest('.popup-estandar').remove()">CERRAR</button>
                </div>
            `;
            document.body.appendChild(overlay);
        };
    </script>

    <script>
    (function() {
        let deferredPrompt;
        const yaInstalado = localStorage.getItem('habitat_pwa_instalada') === 'true';
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
        function mostrarMensajeInstalacion() {
            const popupAnterior = document.querySelector('.popup-instalacion');
            if (popupAnterior) popupAnterior.remove();
            const overlay = document.createElement('div');
            overlay.className = 'popup-instalacion';
            const logoSvg = `<svg width="60" height="60" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="20" fill="#003D80"/><path d="M30 30H70V40H30V30Z" fill="white"/><path d="M30 45H60V55H30V45Z" fill="white"/><path d="M30 60H50V70H30V60Z" fill="white"/><circle cx="75" cy="75" r="15" fill="#FFD700"/><path d="M70 70L80 80M80 70L70 80" stroke="#003D80" stroke-width="3"/></svg>`;
            if (yaInstalado) {
                overlay.innerHTML = `<div class="popup-contenido">${logoSvg}<h3>¡YA ESTÁ INSTALADA!</h3><p><strong>Nuestra aplicación ya se encuentra en tu dispositivo.</strong><br>Buscá el ícono de Hábitat-Car entre tus aplicaciones.</p><div class="popup-botones"><button class="btn-popup btn-popup-aceptar" id="btn-ok-instalada">ACEPTAR</button></div></div>`;
            } else if (!deferredPrompt) {
                overlay.innerHTML = `<div class="popup-contenido">${logoSvg}<h3>INSTALACIÓN</h3><p>Para instalar la aplicación, buscá en el menú de tu navegador la opción <strong>"Agregar a pantalla de inicio"</strong>.</p><div class="popup-botones"><button class="btn-popup btn-popup-aceptar" id="btn-ok-soporte">ENTENDIDO</button></div></div>`;
            } else {
                overlay.innerHTML = `<div class="popup-contenido">${logoSvg}<h3>¡INSTALÁ LA APLICACIÓN!</h3><p><strong>Para no perderte los beneficios</strong> y tener acceso rápido desde tu pantalla de inicio.</p><div class="popup-botones"><button class="btn-popup btn-popup-aceptar" id="btn-instalar-confirmar">INSTALAR</button><button class="btn-popup btn-popup-cancelar" id="btn-instalar-cancelar">RECHAZAR</button></div></div>`;
            }
            document.body.appendChild(overlay);
            if (yaInstalado) document.getElementById('btn-ok-instalada')?.addEventListener('click', () => overlay.remove());
            else if (!deferredPrompt) document.getElementById('btn-ok-soporte')?.addEventListener('click', () => overlay.remove());
            else {
                document.getElementById('btn-instalar-confirmar')?.addEventListener('click', () => { overlay.remove(); if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then((choiceResult) => { if (choiceResult.outcome === 'accepted') localStorage.setItem('habitat_pwa_instalada', 'true'); deferredPrompt = null; }); } });
                document.getElementById('btn-instalar-cancelar')?.addEventListener('click', () => overlay.remove());
            }
        }
        document.addEventListener('DOMContentLoaded', () => { document.getElementById('btn-instalar-footer')?.addEventListener('click', mostrarMensajeInstalacion); });
    })();
    </script>
</body>
</html>
