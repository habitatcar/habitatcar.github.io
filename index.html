<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABITAT-CAR | ACCESO ADMINISTRATIVO</title>
    <style>
        :root { 
            --azul-oscuro: #0a192f;
            --azul-medio: #334766; 
            --azul-claro: #415a77;
            --celeste-habitat: #004a99;
            --blanco-suave: #e6f1ff;
            --oro: #ffc107; 
            --rojo: #dc3545;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--azul-oscuro); 
            color: var(--blanco-suave);
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: var(--azul-medio);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--azul-claro);
        }

        .logo { 
            height: 100px; 
            width: auto; 
            margin-bottom: 25px; 
        }

        h2 { 
            color: var(--oro); 
            margin-bottom: 30px; 
            font-weight: 300;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85em;
            color: var(--oro);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--oro);
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--celeste-habitat);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 5px 15px rgba(0,74,153,0.4);
        }

        #error-msg {
            color: var(--rojo);
            font-size: 0.9em;
            margin-top: 15px;
            display: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://github.com/habitatcar/habitatcar.github.io/blob/main/logo.png?raw=true" class="logo" alt="HABITAT-CAR">
        
        <h2>PANEL DE CONTROL</h2>

        <div class="input-group">
            <label>Usuario (Email)</label>
            <input type="email" id="user" placeholder="admin@habitatcar.com">
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="pass" placeholder="••••••••">
        </div>

        <button class="btn-login" id="btn-login">INGRESAR AL SISTEMA</button>

        <p id="error-msg">⚠️ Credenciales incorrectas</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",
            storageBucket: "habitatcar-pro.firebasestorage.app",
            messagingSenderId: "311691258694",
            appId: "1:311691258694:web:17a09051dcea7707af9347"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const btnLogin = document.getElementById('btn-login');
        const userInput = document.getElementById('user');
        const passInput = document.getElementById('pass');
        const errorMsg = document.getElementById('error-msg');

        window.validarAcceso = async () => {
            const email = userInput.value.trim();
            const password = passInput.value.trim();
            
            if (!email || !password) {
                errorMsg.textContent = "⚠️ Complete email y contraseña";
                errorMsg.style.display = "block";
                return;
            }
            
            // Mostrar loading
            const originalText = btnLogin.innerHTML;
            btnLogin.innerHTML = '<span class="loading-spinner"></span> VERIFICANDO...';
            btnLogin.disabled = true;
            errorMsg.style.display = "none";
            
            try {
                // Autenticar con Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Verificar rol en Firestore
                const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                
                if (userDoc.exists() && userDoc.data().rol === "admin") {
                    // Registrar log de ingreso
                    await addDoc(collection(db, "logs_actividad"), {
                        timestamp: Date.now(),
                        tipo: "sistema",
                        accion: "LOGIN ADMIN",
                        usuarioId: user.uid,
                        email: email,
                        detalle: `Ingreso exitoso al panel admin`
                    });
                    
                    window.location.href = "admin_comercios.html";
                } else {
                    await auth.signOut();
                    throw new Error("No tienes permisos de administrador");
                }
                
            } catch (error) {
                console.error("Error de login:", error);
                let mensaje = "❌ Usuario o contraseña incorrectos";
                if (error.message === "No tienes permisos de administrador") {
                    mensaje = "❌ No tienes permisos de administrador";
                }
                errorMsg.textContent = mensaje;
                errorMsg.style.display = "block";
                btnLogin.innerHTML = originalText;
                btnLogin.disabled = false;
            }
        };

        btnLogin.onclick = window.validarAcceso;
        
        // Permitir entrar con la tecla Enter
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.validarAcceso();
        });
    </script>
</body>
</html>
