<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc, addDoc, deleteDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
        authDomain: "habitatcar-pro.firebaseapp.com",
        projectId: "habitatcar-pro",
        storageBucket: "habitatcar-pro.firebasestorage.app",
        messagingSenderId: "311691258694",
        appId: "1:311691258694:web:17a09051dcea7707af9347"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const functions = getFunctions(app);
    const auth = getAuth(app);
    window.db = db;

    let postulacionActual = null;
    let tipoActual = null;
    let filtroActual = 'todos';
    let todasLasPostulaciones = { comercios: [], martilleros: [], colaboradores: [] };
    let motivosRechazo = [];
    let motivosSeleccionados = [];

    async function actualizarContadoresHeader() {
        try {
            const comerciosSnap = await getDocs(query(collection(db, "postulaciones_comercios"), where("estado", "==", "pendiente")));
            const martillerosSnap = await getDocs(query(collection(db, "postulaciones_martilleros"), where("estado", "==", "pendiente")));
            const colaboradoresSnap = await getDocs(query(collection(db, "postulaciones_colaboradores"), where("estado", "==", "pendiente")));
            
            const contComercios = document.getElementById('cont-validaciones-comercios');
            const contMartilleros = document.getElementById('cont-validaciones-martilleros');
            const contColaboradores = document.getElementById('cont-validaciones-colaboradores');
            
            if (contComercios) contComercios.innerText = comerciosSnap.size;
            if (contMartilleros) contMartilleros.innerText = martillerosSnap.size;
            if (contColaboradores) contColaboradores.innerText = colaboradoresSnap.size;
        } catch (error) { console.error("Error actualizando contadores:", error); }
    }

    async function cargarMotivosRechazo() {
        try {
            const docRef = doc(db, "config_motivos_rechazo", "motivos");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                motivosRechazo = docSnap.data().lista || [];
            } else {
                motivosRechazo = ["Datos incompletos (falta foto, CUIT, etc.)", "Documentación ilegible (DNI borroso, selfie no clara)", "CUIT no válido o inactivo", "Discrepancia en datos (nombre no coincide con AFIP)", "No se pudo contactar al comercio", "Otro (especificar)"];
                await setDoc(docRef, { lista: motivosRechazo, ultima_actualizacion: new Date().toISOString(), actualizado_por: "admin@habitatcar.com" });
            }
            actualizarVistaMotivos();
        } catch (error) { console.error("Error cargando motivos:", error); }
    }

    async function guardarMotivosRechazo() {
        try { await updateDoc(doc(db, "config_motivos_rechazo", "motivos"), { lista: motivosRechazo, ultima_actualizacion: new Date().toISOString(), actualizado_por: "admin@habitatcar.com" }); } 
        catch (error) { console.error("Error guardando motivos:", error); }
    }

    function actualizarVistaMotivos() {
        const container = document.getElementById('motivos-container');
        if (!container) return;
        container.innerHTML = '';
        motivosRechazo.forEach((motivo, index) => {
            const motivoDiv = document.createElement('div');
            motivoDiv.className = 'motivo-item';
            motivoDiv.innerHTML = `<input type="checkbox" class="motivo-checkbox" data-index="${index}" onchange="actualizarSeleccionMotivos()"><span class="motivo-texto" id="motivo-${index}">${motivo}</span><button class="btn-editar-motivo" onclick="editarMotivo(${index})">✏️ Editar</button>`;
            container.appendChild(motivoDiv);
        });
    }

    window.editarMotivo = (index) => {
        const span = document.getElementById(`motivo-${index}`);
        const textoActual = motivosRechazo[index];
        const input = document.createElement('input');
        input.type = 'text';
        input.value = textoActual;
        input.className = 'motivo-texto editando';
        input.onblur = async () => {
            if (input.value.trim()) {
                motivosRechazo[index] = input.value.trim();
                await guardarMotivosRechazo();
                actualizarVistaMotivos();
                actualizarVistaPrevia();
            }
        };
        input.onkeypress = (e) => { if (e.key === 'Enter') input.blur(); };
        span.replaceWith(input);
        input.focus();
    };

    window.agregarMotivo = async () => {
        const nuevoMotivo = prompt("Nuevo motivo de rechazo:");
        if (nuevoMotivo && nuevoMotivo.trim()) {
            motivosRechazo.push(nuevoMotivo.trim());
            await guardarMotivosRechazo();
            actualizarVistaMotivos();
        }
    };

    window.actualizarSeleccionMotivos = () => {
        motivosSeleccionados = [];
        document.querySelectorAll('.motivo-checkbox:checked').forEach(cb => {
            const index = cb.dataset.index;
            motivosSeleccionados.push(motivosRechazo[index]);
        });
        actualizarVistaPrevia();
    };

    function actualizarVistaPrevia() {
        const motivoLibre = document.getElementById('motivoLibre')?.value || '';
        const vistaPrevia = document.getElementById('vistaPrevia');
        let mensaje = '';
        if (motivosSeleccionados.length > 0) mensaje += motivosSeleccionados.join(', ');
        if (motivoLibre) { if (mensaje) mensaje += ' · '; mensaje += motivoLibre; }
        vistaPrevia.innerHTML = mensaje ? `<strong>Motivo final:</strong> ${mensaje}` : '<span style="color:#888;">Seleccioná al menos un motivo o escribí uno</span>';
    }

    window.abrirModalRechazo = () => {
        motivosSeleccionados = [];
        document.getElementById('motivoLibre').value = '';
        document.getElementById('enviarEmail').checked = true;
        document.getElementById('permitirReintento').checked = false;
        actualizarVistaMotivos();
        actualizarVistaPrevia();
        document.getElementById('modalRechazo').style.display = 'flex';
    };

    window.cerrarModalRechazo = () => { document.getElementById('modalRechazo').style.display = 'none'; };

    window.confirmarRechazo = async () => {
        if (!postulacionActual) return;
        const motivoLibre = document.getElementById('motivoLibre').value;
        const enviarEmail = document.getElementById('enviarEmail').checked;
        const permitirReintento = document.getElementById('permitirReintento').checked;
        let motivoFinal = '';
        if (motivosSeleccionados.length > 0) motivoFinal += motivosSeleccionados.join(', ');
        if (motivoLibre) { if (motivoFinal) motivoFinal += ' · '; motivoFinal += motivoLibre; }
        if (!motivoFinal) { alert("⚠️ Debes seleccionar al menos un motivo o escribir uno"); return; }
        try {
            const postulacionRef = doc(db, `postulaciones_${tipoActual}s`, postulacionActual.id);
            await updateDoc(postulacionRef, { estado: "rechazado", fecha_rechazo: new Date().toISOString(), motivo_rechazo: motivoFinal, enviar_email: enviarEmail, permitir_reintento: permitirReintento });
            if (enviarEmail) {
                try {
                    const enviarEmailRechazo = httpsCallable(functions, 'enviarEmailRechazo');
                    await enviarEmailRechazo({ email: postulacionActual.email, nombreComercio: postulacionActual.nombre_comercio, motivo: motivoFinal, permitirReintento: permitirReintento });
                } catch (emailError) { console.error("❌ Error al enviar email:", emailError); }
            }
            alert("❌ Postulación rechazada correctamente");
            cerrarModalRechazo();
            cerrarModal();
        } catch (error) { console.error("Error al rechazar:", error); alert("❌ Error al rechazar"); }
    };

    function formatearEnlace(tipo, valor) {
        if (!valor) return '-';
        switch(tipo) {
            case 'cuit': return `<a href="https://seti.afip.gob.ar/padron-puc-constancia/consultaCuit?cuit=${valor}" target="_blank">🔍 ${valor}</a>`;
            case 'email': return `<a href="mailto:${valor}">📧 ${valor}</a>`;
            case 'telefono': const tel = valor.replace(/\D/g, ''); return `<a href="https://wa.me/${tel}" target="_blank">📱 ${valor}</a>`;
            case 'instagram': if (valor.includes('instagram.com')) return `<a href="${valor}" target="_blank">📷 Instagram</a>`; else if (valor.startsWith('@')) return `<a href="https://instagram.com/${valor.substring(1)}" target="_blank">📷 ${valor}</a>`; return `<a href="https://instagram.com/${valor}" target="_blank">📷 ${valor}</a>`;
            case 'facebook': if (valor.includes('facebook.com')) return `<a href="${valor}" target="_blank">📘 Facebook</a>`; return `<a href="https://facebook.com/${valor}" target="_blank">📘 ${valor}</a>`;
            case 'tiktok': if (valor.includes('tiktok.com')) return `<a href="${valor}" target="_blank">🎵 TikTok</a>`; else if (valor.startsWith('@')) return `<a href="https://tiktok.com/${valor}" target="_blank">🎵 ${valor}</a>`; return `<a href="https://tiktok.com/@${valor}" target="_blank">🎵 ${valor}</a>`;
            case 'sitioWeb': let url = valor; if (!url.startsWith('http')) url = 'https://' + url; return `<a href="${url}" target="_blank">🌐 Sitio Web</a>`;
            case 'maps': return `<a href="${valor}" target="_blank">📍 Ver en Maps</a>`;
            default: return valor;
        }
    }

    function cargarPostulaciones() {
        const qComercios = query(collection(db, "postulaciones_comercios"), where("estado", "==", "pendiente"));
        onSnapshot(qComercios, (snapshot) => {
            todasLasPostulaciones.comercios = [];
            snapshot.forEach(doc => { todasLasPostulaciones.comercios.push({ id: doc.id, tipo: 'comercio', ...doc.data() }); });
            actualizarContadoresHeader();
            actualizarContadores();
            aplicarFiltro();
        });
        
        const qMartilleros = query(collection(db, "postulaciones_martilleros"), where("estado", "==", "pendiente"));
        onSnapshot(qMartilleros, (snapshot) => {
            todasLasPostulaciones.martilleros = [];
            snapshot.forEach(doc => { todasLasPostulaciones.martilleros.push({ id: doc.id, tipo: 'martillero', ...doc.data() }); });
            actualizarContadoresHeader();
            actualizarContadores();
            aplicarFiltro();
        });
        
        const qColaboradores = query(collection(db, "postulaciones_colaboradores"), where("estado", "==", "pendiente"));
        onSnapshot(qColaboradores, (snapshot) => {
            todasLasPostulaciones.colaboradores = [];
            snapshot.forEach(doc => { todasLasPostulaciones.colaboradores.push({ id: doc.id, tipo: 'colaborador', ...doc.data() }); });
            actualizarContadoresHeader();
            actualizarContadores();
            aplicarFiltro();
        });
    }

    function actualizarContadores() {
        document.getElementById('count-total').innerText = todasLasPostulaciones.comercios.length + todasLasPostulaciones.martilleros.length + todasLasPostulaciones.colaboradores.length;
        document.getElementById('count-comercios').innerText = todasLasPostulaciones.comercios.length;
        document.getElementById('count-martilleros').innerText = todasLasPostulaciones.martilleros.length;
        document.getElementById('count-colaboradores').innerText = todasLasPostulaciones.colaboradores.length;
    }

    function aplicarFiltro() {
        const term = document.getElementById('masterSearch')?.value.toLowerCase() || '';
        if (filtroActual === 'todos' || filtroActual === 'comercios') mostrarComercios(terminoFiltro(todasLasPostulaciones.comercios, term));
        else document.getElementById('lista-comercios-pendientes').innerHTML = '<p style="color:#aaa;">Filtro oculto</p>';
        if (filtroActual === 'todos' || filtroActual === 'martilleros') mostrarMartilleros(terminoFiltro(todasLasPostulaciones.martilleros, term));
        else document.getElementById('lista-martilleros-pendientes').innerHTML = '<p style="color:#aaa;">Filtro oculto</p>';
        if (filtroActual === 'todos' || filtroActual === 'colaboradores') mostrarColaboradores(terminoFiltro(todasLasPostulaciones.colaboradores, term));
        else document.getElementById('lista-colaboradores-pendientes').innerHTML = '<p style="color:#aaa;">Filtro oculto</p>';
    }

    function terminoFiltro(lista, term) { if (!term) return lista; return lista.filter(item => { const nombre = item.nombre_comercio || item.nombre || ''; return nombre.toLowerCase().includes(term); }); }

    function mostrarComercios(lista) {
        const container = document.getElementById('lista-comercios-pendientes');
        container.innerHTML = '';
        if (lista.length === 0) { container.innerHTML = '<p style="color:#aaa;">No hay comercios pendientes</p>'; return; }
        lista.forEach(item => {
            container.innerHTML += `<div class="tarjeta-postulacion" data-id="${item.id}" data-tipo="comercio"><div class="tarjeta-titulo">${item.nombre_comercio || 'Sin nombre'}</div><div class="tarjeta-subtitulo">${item.provincia || ''} • ${item.localidad || ''}</div><div><span class="tarjeta-badge badge-pendiente">PENDIENTE</span></div><button class="btn-eliminar-tarjeta" onclick="event.stopPropagation(); eliminarPostulacion('${item.id}', 'comercio')">🗑️</button></div>`;
        });
        document.querySelectorAll('#lista-comercios-pendientes .tarjeta-postulacion').forEach(tarjeta => {
            tarjeta.addEventListener('click', function(e) { if (e.target.classList.contains('btn-eliminar-tarjeta')) return; const id = this.dataset.id; const tipo = this.dataset.tipo; if (id && tipo) abrirModalValidacion(id, tipo); });
        });
    }

    function mostrarMartilleros(lista) {
        const container = document.getElementById('lista-martilleros-pendientes');
        container.innerHTML = '';
        if (lista.length === 0) { container.innerHTML = '<p style="color:#aaa;">No hay martilleros pendientes</p>'; return; }
        lista.forEach(item => {
            container.innerHTML += `<div class="tarjeta-postulacion" data-id="${item.id}" data-tipo="martillero"><div class="tarjeta-titulo">${item.nombre || ''}</div><div class="tarjeta-subtitulo">MP: ${item.matricula || ''}</div><div><span class="tarjeta-badge badge-pendiente">PENDIENTE</span></div><button class="btn-eliminar-tarjeta" onclick="event.stopPropagation(); eliminarPostulacion('${item.id}', 'martillero')">🗑️</button></div>`;
        });
        document.querySelectorAll('#lista-martilleros-pendientes .tarjeta-postulacion').forEach(tarjeta => {
            tarjeta.addEventListener('click', function(e) { if (e.target.classList.contains('btn-eliminar-tarjeta')) return; const id = this.dataset.id; const tipo = this.dataset.tipo; if (id && tipo) abrirModalValidacion(id, tipo); });
        });
    }

    function mostrarColaboradores(lista) {
        const container = document.getElementById('lista-colaboradores-pendientes');
        container.innerHTML = '';
        if (lista.length === 0) { container.innerHTML = '<p style="color:#aaa;">No hay colaboradores pendientes</p>'; return; }
        lista.forEach(item => {
            container.innerHTML += `<div class="tarjeta-postulacion" data-id="${item.id}" data-tipo="colaborador"><div class="tarjeta-titulo">${item.nombre || ''}</div><div class="tarjeta-subtitulo">${item.tipo_colaboracion || ''}</div><div><span class="tarjeta-badge badge-pendiente">PENDIENTE</span></div><button class="btn-eliminar-tarjeta" onclick="event.stopPropagation(); eliminarPostulacion('${item.id}', 'colaborador')">🗑️</button></div>`;
        });
        document.querySelectorAll('#lista-colaboradores-pendientes .tarjeta-postulacion').forEach(tarjeta => {
            tarjeta.addEventListener('click', function(e) { if (e.target.classList.contains('btn-eliminar-tarjeta')) return; const id = this.dataset.id; const tipo = this.dataset.tipo; if (id && tipo) abrirModalValidacion(id, tipo); });
        });
    }

    window.filtrarPostulaciones = () => { aplicarFiltro(); };
    window.cambiarFiltro = (filtro) => { filtroActual = filtro; document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active')); document.getElementById(`fil-${filtro}`).classList.add('active'); aplicarFiltro(); };

    window.eliminarPostulacion = async (id, tipo) => {
        if (!confirm(`¿Estás seguro de eliminar esta postulación de ${tipo}?`)) return;
        try { await deleteDoc(doc(db, `postulaciones_${tipo}s`, id)); alert(`✅ Postulación de ${tipo} eliminada`); } 
        catch (error) { console.error("Error al eliminar:", error); alert("❌ Error al eliminar"); }
    };

    window.abrirModalValidacion = async (id, tipo) => {
        tipoActual = tipo;
        const docRef = doc(db, `postulaciones_${tipo}s`, id);
        const docSnap = await getDoc(docRef);
        if (!docSnap.exists()) { alert("No se encontró la postulación"); return; }
        postulacionActual = { id, ...docSnap.data() };
        let html = '';
        if (tipo === 'comercio') html = generarHTMLComercio(postulacionActual);
        else if (tipo === 'martillero') html = generarHTMLMartillero(postulacionActual);
        else if (tipo === 'colaborador') html = generarHTMLColaborador(postulacionActual);
        document.getElementById('modal-contenido-dinamico').innerHTML = html;
        document.getElementById('modalValidacion').style.display = 'flex';
    };

    // ===========================================
    // FUNCIÓN GENERAR HTML COMERCIO (CON DESCRIPCIÓN)
    // ===========================================
    function generarHTMLComercio(data) {
        return `
            <div class="info-grid">
                <div class="info-item"><div class="info-label">Comercio</div><div class="info-valor">${data.nombre_comercio || '-'}</div></div>
                <div class="info-item"><div class="info-label">CUIT</div><div class="info-valor">${formatearEnlace('cuit', data.cuit)}</div></div>
                <div class="info-item"><div class="info-label">Rubro</div><div class="info-valor">${data.rubro || '-'}</div></div>
                <div class="info-item"><div class="info-label">Ubicación</div><div class="info-valor">${data.provincia || ''} - ${data.localidad || ''}</div></div>
                <div class="info-item"><div class="info-label">Dirección</div><div class="info-valor">${data.direccion || '-'}</div></div>
                <div class="info-item"><div class="info-label">Teléfono</div><div class="info-valor">${formatearEnlace('telefono', data.telefono)}</div></div>
                <div class="info-item"><div class="info-label">Email</div><div class="info-valor">${formatearEnlace('email', data.email)}</div></div>
                <div class="info-item"><div class="info-label">Instagram</div><div class="info-valor">${formatearEnlace('instagram', data.instagram)}</div></div>
                <div class="info-item"><div class="info-label">TikTok</div><div class="info-valor">${formatearEnlace('tiktok', data.tiktok)}</div></div>
                <div class="info-item"><div class="info-label">Sitio Web</div><div class="info-valor">${formatearEnlace('sitioWeb', data.sitioWeb)}</div></div>
                <div class="info-item"><div class="info-label">Facebook</div><div class="info-valor">${formatearEnlace('facebook', data.facebook)}</div></div>
                <div class="info-item"><div class="info-label">Google Maps</div><div class="info-valor">${formatearEnlace('maps', data.mapsUrl)}</div></div>
                <div class="info-item"><div class="info-label">Nombre Titular</div><div class="info-valor">${data.nombre_titular || '-'}</div></div>
                <div class="info-item"><div class="info-label">Apellido Titular</div><div class="info-valor">${data.apellido_titular || '-'}</div></div>
                <div class="info-item"><div class="info-label">Descripción del Comercio</div><div class="info-valor">${(data.descripcion_comercio || '-').replace(/\n/g, '<br>')}</div></div>
            </div>
            <h3 style="color: var(--dorado); margin: 20px 0 10px;">📸 Documentación</h3>
            <div class="documentos-container">
                ${data.foto_fachada_url ? `<div class="documento-card"><img src="${data.foto_fachada_url}" alt="Fachada" onclick="window.open('${data.foto_fachada_url}')"><a href="${data.foto_fachada_url}" target="_blank">Ver Fachada</a></div>` : ''}
                ${data.foto_dni_url ? `<div class="documento-card"><img src="${data.foto_dni_url}" alt="DNI" onclick="window.open('${data.foto_dni_url}')"><a href="${data.foto_dni_url}" target="_blank">Ver DNI</a></div>` : ''}
                ${data.foto_selfie_url ? `<div class="documento-card"><img src="${data.foto_selfie_url}" alt="Selfie" onclick="window.open('${data.foto_selfie_url}')"><a href="${data.foto_selfie_url}" target="_blank">Ver Selfie con DNI</a></div>` : ''}
                ${data.constancia_afip_url ? `<div class="documento-card"><i class="fas fa-file-pdf" style="font-size: 48px; color: var(--rojo);"></i><a href="${data.constancia_afip_url}" target="_blank">Ver Constancia AFIP</a></div>` : ''}
            </div>
            <div class="acciones-container">
                <button class="btn btn-aprobar" onclick="aprobarComercio()">✅ APROBAR</button>
                <button class="btn btn-rechazar" onclick="abrirModalRechazo()">❌ RECHAZAR</button>
                <button class="btn btn-contactar" onclick="contactarWhatsApp()">📞 CONTACTAR</button>
                <button class="btn btn-eliminar-modal" onclick="eliminarPostulacionDesdeModal()">🗑️ ELIMINAR</button>
            </div>
            <button class="btn btn-volver" onclick="cerrarModal()" style="margin-top: 10px;">VOLVER</button>
        `;
    }

    function generarHTMLMartillero(data) { return `<p style="text-align:center; padding:20px;">Próximamente - Validación de martilleros</p>`; }
    function generarHTMLColaborador(data) { return `<p style="text-align:center; padding:20px;">Próximamente - Validación de colaboradores</p>`; }

    // ===========================================
    // APROBAR COMERCIO (GUARDA DATOS POSTULACION)
    // ===========================================
    window.aprobarComercio = async () => {
        try {
            if (!postulacionActual) { alert("❌ No hay postulación seleccionada"); return; }
            if (tipoActual !== 'comercio') { alert("❌ Esta función solo es para comercios"); return; }
            if (!confirm("¿Confirmás que los datos son correctos y querés aprobar este comercio?")) return;
            
            const idBase = postulacionActual.nombre_comercio.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "_");
            const idComercio = `${idBase}_${Math.floor(1000 + Math.random() * 9000)}`;
            const tokenQR = `token_${idBase}_${Math.floor(100000 + Math.random() * 899999)}`;
            
            let uid = null;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, postulacionActual.email, "123456");
                uid = userCredential.user.uid;
            } catch (authError) {
                if (authError.code === 'auth/email-already-in-use') {
                    try {
                        const signInResult = await signInWithEmailAndPassword(auth, postulacionActual.email, "123456");
                        uid = signInResult.user.uid;
                        await signOut(auth);
                    } catch (signInError) {
                        const usarManual = confirm("El email ya existe en Auth pero no se pudo obtener el UID automáticamente.\n\n¿Querés ingresar manualmente el UID?");
                        if (usarManual) {
                            const uidManual = prompt("Ingresá el UID del usuario (desde Firebase Console):");
                            if (uidManual && uidManual.trim()) uid = uidManual.trim();
                            else return;
                        } else { uid = "temp_" + Date.now(); }
                    }
                } else { alert(`❌ Error al crear usuario: ${authError.message}`); return; }
            }
            if (!uid) { alert("❌ Error crítico: No se pudo obtener un UID válido"); return; }
            
            // CREAR OBJETO CON DATOS DE POSTULACIÓN
            const datosPostulacion = {
                cuit: postulacionActual.cuit,
                nombre_titular: postulacionActual.nombre_titular,
                apellido_titular: postulacionActual.apellido_titular,
                foto_dni_url: postulacionActual.foto_dni_url,
                foto_selfie_url: postulacionActual.foto_selfie_url,
                foto_fachada_url: postulacionActual.foto_fachada_url,
                constancia_afip_url: postulacionActual.constancia_afip_url,
                descripcion_comercio: postulacionActual.descripcion_comercio || '',
                fecha_postulacion: postulacionActual.fecha_postulacion,
                instagram: postulacionActual.instagram || '',
                facebook: postulacionActual.facebook || '',
                tiktok: postulacionActual.tiktok || '',
                sitioWeb: postulacionActual.sitioWeb || '',
                mapsUrl: postulacionActual.mapsUrl || ''
            };
            
            const nuevoComercio = {
                uid: uid,
                idComercio: idComercio,
                nombre: postulacionActual.nombre_comercio,
                rubro: postulacionActual.rubro,
                provincia: postulacionActual.provincia,
                localidad: postulacionActual.localidad,
                ciudad: postulacionActual.localidad,
                direccion: postulacionActual.direccion,
                telefono: postulacionActual.telefono,
                emailDueno: postulacionActual.email,
                instagram: postulacionActual.instagram || "",
                tiktok: postulacionActual.tiktok || "",
                sitioWeb: postulacionActual.sitioWeb || "",
                facebook: postulacionActual.facebook || "",
                mapsUrl: postulacionActual.mapsUrl || "",
                tokenQR: tokenQR,
                descLead: "",
                detalleLead: "",
                usosLead: 1,
                vigenciaLead: 30,
                descVip: "",
                detalleVip: "",
                usosVip: 0,
                vigenciaVip: 30,
                estado: "activo",
                nivel_confianza: 0,
                usos_cupones: 0,
                postulacion_id: postulacionActual.id,
                fecha_alta: new Date().toISOString(),
                foto_fachada_url: postulacionActual.foto_fachada_url,
                foto_dni_url: postulacionActual.foto_dni_url,
                foto_selfie_url: postulacionActual.foto_selfie_url,
                constancia_afip_url: postulacionActual.constancia_afip_url,
                password: "123456",
                rol: "comerciante",
                publicado: false,
                datos_postulacion: datosPostulacion,
                terminos_comercio_aceptados: false,
                fecha_aceptacion_terminos: null,
                primer_ingreso: true
            };
            
            await addDoc(collection(db, "comercios"), nuevoComercio);
            
            const postulacionRef = doc(db, "postulaciones_comercios", postulacionActual.id);
            await updateDoc(postulacionRef, { estado: "validado", fecha_validacion: new Date().toISOString(), validado_por: "admin@habitatcar.com", id_comercio_generado: idComercio, token_qr_generado: tokenQR });
            
            try {
                const enviarEmailSetup = httpsCallable(functions, 'enviarEmailSetup');
                await enviarEmailSetup({ email: postulacionActual.email, nombreComercio: postulacionActual.nombre_comercio, idComercio: idComercio });
            } catch (emailError) { console.error("Error email:", emailError); }
            
            alert(`✅ Comercio aprobado\n\nID: ${idComercio}\nContraseña: 123456\n\nESTADO: NO PUBLICADO (el comerciante debe publicarlo manualmente desde su panel)\n\n📋 DATOS DE POSTULACIÓN GUARDADOS EN LA FICHA DEL COMERCIO`);
            cerrarModal();
        } catch (error) { console.error("❌ Error grave:", error); alert("❌ Error al aprobar: " + error.message); }
    };
    
    window.eliminarPostulacionDesdeModal = async () => { if (!postulacionActual) return; await eliminarPostulacion(postulacionActual.id, tipoActual); cerrarModal(); };
    
    window.contactarWhatsApp = () => {
        if (!postulacionActual) return;
        let telefono = postulacionActual.telefono || '';
        telefono = telefono.replace(/\D/g, '');
        if (!telefono) { alert("No hay número de teléfono"); return; }
        const nombreCompleto = `${postulacionActual.nombre_titular || ''} ${postulacionActual.apellido_titular || ''}`.trim();
        const mensaje = `Hola ${nombreCompleto || ''}, soy Maximiliano, Martillero Público de Habitat-Car (MP 279). Recibí tu postulación para ${postulacionActual.nombre_comercio || 'el comercio'}. ¿Podemos coordinar una breve llamada para validar los datos?`;
        window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
    };
    
    window.cerrarModal = () => { document.getElementById('modalValidacion').style.display = 'none'; postulacionActual = null; tipoActual = null; };
    
    cargarPostulaciones();
    cargarMotivosRechazo();
    document.getElementById('motivoLibre')?.addEventListener('input', actualizarVistaPrevia);
</script>
</body>
</html>
