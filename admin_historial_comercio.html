<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Canjes | Hábitat-Car</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --azul-oscuro: #0a192f;
            --azul-medio: #334766;
            --azul-claro: #415a77;
            --celeste-habitat: #004a99;
            --blanco-suave: #e6f1ff;
            --borravino: #800020;
            --verde: #28a745;
            --rojo: #dc3545;
            --oro: #ffc107;
            --naranja: #ff8c00;
            --dorado: #d4af37;
            --gris-claro: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--azul-oscuro);
            color: var(--blanco-suave);
            padding: 20px;
        }
        .header {
            background: #004a99;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo { height: 60px; width: auto; }
        .btn-volver {
            background: var(--gris-claro);
            color: var(--azul-oscuro);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-volver:hover { background: var(--oro); transform: translateY(-2px); }
        .comercio-info {
            background: var(--azul-medio);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid var(--dorado);
        }
        .comercio-info h1 { color: var(--oro); margin-bottom: 10px; }
        .comercio-info p { color: var(--blanco-suave); font-size: 14px; }
        .filtros-bar {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filtro-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 13px;
        }
        .filtro-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-filtro {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: var(--celeste-habitat);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-filtro:hover { background: var(--oro); color: var(--azul-oscuro); }
        .btn-pdf { background: var(--rojo); }
        .btn-pdf:hover { background: #b91c1c; }
        .btn-enviar { background: var(--verde); }
        .btn-enviar:hover { background: #1e7e34; }
        .tabla-container {
            overflow-x: auto;
            background: var(--azul-medio);
            border-radius: 15px;
            padding: 5px;
            max-height: 60vh;
            overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th {
            background: var(--azul-oscuro);
            color: var(--oro);
            position: sticky;
            top: 0;
            font-size: 13px;
        }
        td { font-size: 13px; }
        .badge-lead {
            background: var(--verde);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-vip {
            background: var(--dorado);
            color: var(--azul-oscuro);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .input-monto, .input-factura {
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 12px;
            width: 100px;
        }
        .btn-guardar {
            background: var(--verde);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }
        .btn-guardar:hover { background: #1e7e34; }
        .sin-datos { text-align: center; padding: 50px; color: var(--gris-claro); }
        .resumen {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .resumen-card {
            background: var(--azul-medio);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .resumen-card h3 { font-size: 28px; color: var(--oro); }
        .resumen-card p { font-size: 12px; color: var(--gris-claro); }
        .nombre-usuario { font-weight: bold; color: var(--oro); }
        .whatsapp-parcial { font-family: monospace; font-size: 12px; }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 10px;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--azul-claro);
            border-top-color: var(--oro);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .codigo-badge {
            background: var(--azul-oscuro);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            color: var(--oro);
        }
        .fecha-rango {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .fecha-rango input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 12px;
        }
        .modal-envio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-contenido {
            background: var(--azul-medio);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 2px solid var(--dorado);
        }
        .modal-contenido h3 {
            color: var(--oro);
            margin-bottom: 15px;
        }
        .modal-contenido input, .modal-contenido select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
        }
        .modal-botones {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-modal {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-modal-enviar {
            background: var(--verde);
            color: white;
        }
        .btn-modal-cancelar {
            background: var(--rojo);
            color: white;
        }
        .debug-panel {
            background: rgba(255,193,7,0.1);
            border: 1px solid var(--oro);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 12px;
            font-family: monospace;
            color: var(--oro);
            display: none;
        }
        .debug-panel.visible { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://github.com/habitatcar/habitatcar.github.io/blob/main/logo.png?raw=true" class="logo" alt="Habitat-Car">
        <a href="admin_comercios.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver a Comercios</a>
    </div>

    <div id="comercio-info" class="comercio-info">
        <h1 id="comercio-nombre">Cargando...</h1>
        <p id="comercio-detalle"></p>
        <p id="comercio-email" style="font-size:12px; margin-top:8px; color:var(--gris-claro);"></p>
    </div>

    <div class="resumen">
        <div class="resumen-card">
            <h3 id="total-canjes">0</h3>
            <p>Total Canjes</p>
        </div>
        <div class="resumen-card">
            <h3 id="total-leads">0</h3>
            <p>Canjes LEAD</p>
        </div>
        <div class="resumen-card">
            <h3 id="total-vips">0</h3>
            <p>Canjes VIP</p>
        </div>
        <div class="resumen-card">
            <h3 id="monto-total">$0</h3>
            <p>Monto Total Facturado</p>
        </div>
    </div>

    <div class="filtros-bar">
        <select id="filtro-periodo" class="filtro-select" onchange="cambiarPeriodo()">
            <option value="hoy">📅 HOY</option>
            <option value="ayer">📅 AYER</option>
            <option value="semana">📅 ESTA SEMANA</option>
            <option value="mes">📅 ESTE MES</option>
            <option value="anio">📅 ESTE AÑO</option>
            <option value="rango">📅 RANGO PERSONALIZADO</option>
        </select>
        <div id="rango-fechas" class="fecha-rango" style="display: none;">
            <input type="date" id="fecha-desde">
            <span>hasta</span>
            <input type="date" id="fecha-hasta">
            <button class="btn-filtro" onclick="aplicarRangoFechas()">Aplicar</button>
        </div>
        <input type="text" id="filtro-usuario" class="filtro-input" placeholder="Buscar por nombre o WhatsApp" style="width:180px">
        <select id="filtro-tipo" class="filtro-select">
            <option value="todos">Todos los tipos</option>
            <option value="LEAD">LEAD</option>
            <option value="VIP">VIP</option>
        </select>
        <button class="btn-filtro" onclick="aplicarFiltros()"><i class="fas fa-search"></i> Buscar</button>
        <button class="btn-filtro" onclick="limpiarFiltros()"><i class="fas fa-eraser"></i> Limpiar</button>
        <button class="btn-filtro btn-pdf" onclick="exportarPDF()"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
        <button class="btn-filtro btn-enviar" onclick="abrirModalEnvio()"><i class="fas fa-paper-plane"></i> Enviar Reporte</button>
    </div>

    <div id="debug-panel" class="debug-panel">
        <strong>🔍 Diagnóstico:</strong> <span id="debug-texto"></span>
    </div>

    <div class="tabla-container">
        <table id="tabla-canjes">
            <thead>
                66
                    <th>Fecha y Hora</th>
                    <th>Tipo</th>
                    <th>Usuario</th>
                    <th>WhatsApp</th>
                    <th>Código Canje</th>
                    <th>N° Factura</th>
                    <th>Monto ($)</th>
                    <th>Acciones</th>
                </thead>
            <tbody id="lista-canjes">
                <tr><td colspan="8" class="loading-spinner"><div class="spinner"></div> Cargando historial...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, updateDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",
            storageBucket: "habitatcar-pro.firebasestorage.app",
            messagingSenderId: "311691258694",
            appId: "1:311691258694:web:17a09051dcea7707af9347"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const comercioIdParam    = urlParams.get('id')     || '';
        const comercioNombreParam = decodeURIComponent(urlParams.get('nombre') || '');

        let todosLosCanjes = [];
        let canjesFiltrados = [];
        let unsubscribe = null;
        let emailComercio = '';

        // Obtener email del comercio
        async function cargarEmailComercio() {
            if (!comercioIdParam) return;
            try {
                const comercioRef = doc(db, "comercios", comercioIdParam);
                const comercioSnap = await getDoc(comercioRef);
                if (comercioSnap.exists()) {
                    emailComercio = comercioSnap.data().emailDueno || '';
                    if (emailComercio) {
                        document.getElementById('comercio-email').innerHTML = `<i class="fas fa-envelope"></i> Email para reportes: ${emailComercio}`;
                    }
                }
            } catch(e) {
                console.error("Error cargando email:", e);
            }
        }

        function esCanje(accionUp) {
            return accionUp.includes('CANJE');
        }

        function tipoCanje(accionUp) {
            if (accionUp.includes('VIP')) return 'VIP';
            return 'LEAD';
        }

        function normalizar(str) {
            if (!str) return '';
            return str.toString().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }

        function perteneceAlComercio(data) {
            if (comercioIdParam && comercioIdParam !== 'null' && comercioIdParam !== '') {
                if (data.comercioId && data.comercioId === comercioIdParam) return true;
            }
            if (comercioNombreParam) {
                const nombreDoc    = normalizar(data.nombreComercio || data.comercio || '');
                const nombreBuscar = normalizar(comercioNombreParam);
                if (nombreDoc && nombreBuscar && nombreDoc === nombreBuscar) return true;
            }
            return false;
        }

        function mostrarInfoComercio() {
            document.getElementById('comercio-nombre').innerText = comercioNombreParam || 'Comercio';
            document.getElementById('comercio-detalle').innerHTML =
                `ID: ${comercioIdParam || '---'} | Historial de canjes | Actualización en tiempo real`;
        }

        function actualizarResumen() {
            const total      = todosLosCanjes.length;
            const totalLeads = todosLosCanjes.filter(c => c.tipo === 'LEAD').length;
            const totalVips  = todosLosCanjes.filter(c => c.tipo === 'VIP').length;
            const montoTotal = todosLosCanjes.reduce((s, c) => s + (parseFloat(c.monto) || 0), 0);
            document.getElementById('total-canjes').innerText = total;
            document.getElementById('total-leads').innerText  = totalLeads;
            document.getElementById('total-vips').innerText   = totalVips;
            document.getElementById('monto-total').innerText  = `$${montoTotal.toFixed(2)}`;
        }

        function normalizarTexto(t) {
            if (!t) return '';
            return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }

        function formatearFecha(timestamp) {
            if (!timestamp) return '---';
            try {
                const fecha = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return fecha.toLocaleString('es-AR', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch(e) { return '---'; }
        }

        function ocultarWhatsapp(w) {
            if (!w) return '---';
            const s = w.toString();
            if (s.length <= 6) return s;
            return s.slice(0, 4) + '****' + s.slice(-2);
        }

        function ocultarNombre(nombreCompleto) {
            if (!nombreCompleto) return '---';
            const partes = nombreCompleto.split(',');
            if (partes.length >= 2) {
                const apellido = partes[0].trim();
                const nombre   = partes[1].trim().split(' ')[0];
                return `${nombre} ${apellido.charAt(0)}.`;
            }
            const nombres = nombreCompleto.split(' ');
            if (nombres.length >= 2) return `${nombres[0]} ${nombres[1].charAt(0)}.`;
            return nombreCompleto.length > 10 ? nombreCompleto.substring(0, 10) + '...' : nombreCompleto;
        }

        // Filtros por fecha
        let fechaDesdeGlobal = null;
        let fechaHastaGlobal = null;

        function aplicarFiltroFecha() {
            aplicarFiltros();
        }

        window.cambiarPeriodo = () => {
            const periodo = document.getElementById('filtro-periodo').value;
            const rangoDiv = document.getElementById('rango-fechas');
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            
            if (periodo === 'rango') {
                rangoDiv.style.display = 'flex';
                fechaDesdeGlobal = null;
                fechaHastaGlobal = null;
                aplicarFiltros();
                return;
            }
            rangoDiv.style.display = 'none';
            
            const inicio = new Date(hoy);
            const fin = new Date(hoy);
            fin.setHours(23, 59, 59, 999);
            
            switch(periodo) {
                case 'hoy':
                    fechaDesdeGlobal = hoy;
                    fechaHastaGlobal = fin;
                    break;
                case 'ayer':
                    inicio.setDate(inicio.getDate() - 1);
                    fin.setDate(fin.getDate() - 1);
                    fechaDesdeGlobal = inicio;
                    fechaHastaGlobal = fin;
                    break;
                case 'semana':
                    inicio.setDate(inicio.getDate() - inicio.getDay());
                    fin.setDate(inicio.getDate() + 6);
                    fin.setHours(23, 59, 59, 999);
                    fechaDesdeGlobal = inicio;
                    fechaHastaGlobal = fin;
                    break;
                case 'mes':
                    inicio.setDate(1);
                    fechaDesdeGlobal = inicio;
                    fechaHastaGlobal = fin;
                    break;
                case 'anio':
                    inicio.setMonth(0, 1);
                    fechaDesdeGlobal = inicio;
                    fechaHastaGlobal = fin;
                    break;
            }
            aplicarFiltros();
        };

        window.aplicarRangoFechas = () => {
            const desde = document.getElementById('fecha-desde').value;
            const hasta = document.getElementById('fecha-hasta').value;
            if (desde) fechaDesdeGlobal = new Date(desde);
            if (hasta) {
                const fechaHasta = new Date(hasta);
                fechaHasta.setHours(23, 59, 59, 999);
                fechaHastaGlobal = fechaHasta;
            }
            aplicarFiltros();
        };

        function filtrarPorFecha(canje) {
            if (!fechaDesdeGlobal && !fechaHastaGlobal) return true;
            const fechaCanje = canje.timestamp ? (canje.timestamp.toDate ? canje.timestamp.toDate() : new Date(canje.timestamp)) : null;
            if (!fechaCanje) return false;
            if (fechaDesdeGlobal && fechaCanje < fechaDesdeGlobal) return false;
            if (fechaHastaGlobal && fechaCanje > fechaHastaGlobal) return false;
            return true;
        }

        window.aplicarFiltros = () => {
            const usuarioFiltro = normalizarTexto(document.getElementById('filtro-usuario').value);
            const tipoFiltro    = document.getElementById('filtro-tipo').value;

            canjesFiltrados = todosLosCanjes.filter(canje => {
                if (!filtrarPorFecha(canje)) return false;
                
                const nombreNorm = normalizarTexto(canje.nombre || '');
                const wappMatch  = canje.whatsapp && canje.whatsapp.toString().includes(usuarioFiltro);
                if (usuarioFiltro && !nombreNorm.includes(usuarioFiltro) && !wappMatch) return false;

                if (tipoFiltro !== 'todos' && canje.tipo !== tipoFiltro) return false;
                return true;
            });

            renderizarTabla();
        };

        window.limpiarFiltros = () => {
            document.getElementById('filtro-usuario').value = '';
            document.getElementById('filtro-tipo').value = 'todos';
            document.getElementById('filtro-periodo').value = 'hoy';
            cambiarPeriodo();
        };

        function renderizarTabla() {
            const tbody = document.getElementById('lista-canjes');
            if (canjesFiltrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="sin-datos">📭 No hay registros de canjes para mostrar</td></tr>';
                return;
            }
            let html = '';
            canjesFiltrados.forEach(canje => {
                const fecha        = formatearFecha(canje.timestamp);
                const tipoClass    = canje.tipo === 'VIP' ? 'badge-vip' : 'badge-lead';
                const nombreMostrar = ocultarNombre(canje.nombre || '');
                const whatsappMostrar = ocultarWhatsapp(canje.whatsapp);
                const codigo       = canje.idValidacion || '---';
                const usoTexto     = canje.usoNumero ? ` (uso ${canje.usoNumero})` : '';
                const factura      = canje.numeroFactura || '';
                const monto        = canje.monto ? parseFloat(canje.monto).toFixed(2) : '';

                html += `
                <tr>
                    <td style="white-space:nowrap;">${fecha}</td>
                    <td><span class="${tipoClass}">${canje.tipo}</span></td>
                    <td class="nombre-usuario">${nombreMostrar}</td>
                    <td class="whatsapp-parcial">${whatsappMostrar}</td>
                    <td><span class="codigo-badge">${codigo}${usoTexto}</span></td>
                    <td><input type="text" id="factura-${canje.id}" class="input-factura" value="${factura.replace(/"/g,'&quot;')}" placeholder="N° Factura"></td>
                    <td><input type="number" id="monto-${canje.id}" class="input-monto" value="${monto}" placeholder="Monto" step="0.01"></td>
                    <td><button class="btn-guardar" onclick="guardarDatos('${canje.id}')"><i class="fas fa-save"></i> Guardar</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        window.guardarDatos = async (logId) => {
            const facturaInput = document.getElementById(`factura-${logId}`);
            const montoInput   = document.getElementById(`monto-${logId}`);
            const numeroFactura = facturaInput ? facturaInput.value.trim() : '';
            const monto = montoInput ? parseFloat(montoInput.value) : null;
            try {
                const logRef  = doc(db, 'logs_actividad', logId);
                const updates = {};
                if (numeroFactura !== '') updates.numeroFactura = numeroFactura;
                if (monto !== null && !isNaN(monto)) updates.monto = monto;
                if (Object.keys(updates).length > 0) {
                    await updateDoc(logRef, updates);
                    const toast = document.createElement('div');
                    toast.textContent = '✅ Datos guardados';

                    <h3><i class="fas fa-paper-plane"></i> Enviar Reporte</h3>
                    <select id="tipo-envio">
                        <option value="email">📧 Enviar por Email</option>
                        <option value="whatsapp">📱 Enviar por WhatsApp</option>
                    </select>
                    <input type="text" id="destino-envio" placeholder="${emailComercio || 'Email o WhatsApp (ej: 5493881234567)'}" value="${emailComercio || ''}">
                    <div class="modal-botones">
                        <button class="btn-modal btn-modal-enviar" onclick="enviarReporte()">Enviar</button>
                        <button class="btn-modal btn-modal-cancelar" onclick="this.closest('.modal-envio').remove()">Cancelar</button>

            pdfDoc.text(`Total Canjes: ${totalCanjes} | LEAD: ${totalLeads} | VIP: ${totalVips} | Monto Total: $${montoTotal.toFixed(2)}`, 14, 62);
            
            const tablaData = canjesFiltrados.map(c => [

        // SNAPSHOT PRINCIPAL
        function iniciarSnapshot() {
            if (!comercioIdParam && !comercioNombreParam) {
                document.getElementById('lista-canjes').innerHTML =
                    '69e<td colspan="8" class="sin-datos">❌ No se especificó un comercio</td></tr>';
                return;
            }

            if (unsubscribe) unsubscribe();

            const logsRef = collection(db, 'logs_actividad');
            const q = query(logsRef, orderBy('timestamp', 'desc'), limit(2000));

            unsubscribe = onSnapshot(q, (snapshot) => {
                console.log(`📊 Snapshot total: ${snapshot.size} documentos`);
                todosLosCanjes = [];
                let totalEnSnapshot = 0;
                let totalSonCanje   = 0;
                let totalDelComercio = 0;

                snapshot.forEach(docSnap => {
                    const data   = docSnap.data();
                    const accion = (data.accion || '').toUpperCase().trim();
                    totalEnSnapshot++;

                    if (!esCanje(accion)) return;
                    totalSonCanje++;

                    if (!perteneceAlComercio(data)) return;
                    totalDelComercio++;

                    todosLosCanjes.push({
                        id:   docSnap.id,
                        ...data,
                        tipo: tipoCanje(accion)
                    });
                });

                todosLosCanjes.sort((a, b) => {
                    const ta = a.timestamp ? (a.timestamp.toDate ? a.timestamp.toDate() : new Date(a.timestamp)) : 0;
                    const tb = b.timestamp ? (b.timestamp.toDate ? b.timestamp.toDate() : new Date(b.timestamp)) : 0;
                    return tb - ta;
                });

                console.log(`✅ Total: ${totalEnSnapshot} | Son canjes: ${totalSonCanje} | De este comercio: ${totalDelComercio}`);

                const debugPanel = document.getElementById('debug-panel');
                const debugTexto = document.getElementById('debug-texto');
                if (todosLosCanjes.length === 0) {
                    debugPanel.classList.add('visible');
                    debugTexto.innerText =
                        `Docs en snapshot: ${totalEnSnapshot} | Son canjes: ${totalSonCanje} | ` +
                        `De este comercio: ${totalDelComercio} | ` +
                        `Buscando id="${comercioIdParam}" o nombre="${comercioNombreParam}"`;
                } else {
                    debugPanel.classList.remove('visible');
                }

                actualizarResumen();
                cambiarPeriodo(); // Aplica filtro de fecha por defecto

                if (todosLosCanjes.length === 0) {
                    document.getElementById('lista-canjes').innerHTML =
                        '68e<td colspan="8" class="sin-datos">📭 No hay canjes registrados para este comercio</td></tr>';
                }

            }, (error) => {
                console.error('❌ Error en snapshot:', error);
                document.getElementById('lista-canjes').innerHTML =
                    `68e<td colspan="8" class="sin-datos">❌ Error: ${error.message}</td></tr>`;
            });
        }

        mostrarInfoComercio();
        cargarEmailComercio();
        iniciarSnapshot();
    </script>
