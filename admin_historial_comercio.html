<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Canjes | Hábitat-Car</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --azul-oscuro: #0a192f;
            --azul-medio: #334766;
            --azul-claro: #415a77;
            --celeste-habitat: #004a99;
            --blanco-suave: #e6f1ff;
            --borravino: #800020;
            --verde: #28a745;
            --rojo: #dc3545;
            --oro: #ffc107;
            --naranja: #ff8c00;
            --dorado: #d4af37;
            --gris-claro: #e2e8f0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--azul-oscuro);
            color: var(--blanco-suave);
            padding: 20px;
        }
        .header {
            background: #004a99;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo { height: 60px; width: auto; }
        .btn-volver {
            background: var(--gris-claro);
            color: var(--azul-oscuro);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-volver:hover {
            background: var(--oro);
            transform: translateY(-2px);
        }
        .comercio-info {
            background: var(--azul-medio);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid var(--dorado);
        }
        .comercio-info h1 {
            color: var(--oro);
            margin-bottom: 10px;
        }
        .comercio-info p {
            color: var(--blanco-suave);
            font-size: 14px;
        }
        .filtros-bar {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filtro-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 13px;
        }
        .btn-filtro {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: var(--celeste-habitat);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-filtro:hover {
            background: var(--oro);
            color: var(--azul-oscuro);
        }
        .btn-pdf {
            background: var(--rojo);
            margin-left: auto;
        }
        .btn-pdf:hover {
            background: #b91c1c;
        }
        .tabla-container {
            overflow-x: auto;
            background: var(--azul-medio);
            border-radius: 15px;
            padding: 5px;
            max-height: 60vh;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: var(--azul-oscuro);
            color: var(--oro);
            position: sticky;
            top: 0;
            font-size: 13px;
        }
        td {
            font-size: 13px;
        }
        .badge-lead {
            background: var(--verde);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-vip {
            background: var(--dorado);
            color: var(--azul-oscuro);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .input-monto, .input-factura {
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--azul-claro);
            background: var(--azul-oscuro);
            color: white;
            font-size: 12px;
            width: 100px;
        }
        .btn-guardar {
            background: var(--verde);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }
        .btn-guardar:hover {
            background: #1e7e34;
        }
        .sin-datos {
            text-align: center;
            padding: 50px;
            color: var(--gris-claro);
        }
        .resumen {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .resumen-card {
            background: var(--azul-medio);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .resumen-card h3 {
            font-size: 28px;
            color: var(--oro);
        }
        .resumen-card p {
            font-size: 12px;
            color: var(--gris-claro);
        }
        .nombre-usuario {
            font-weight: bold;
            color: var(--oro);
        }
        .whatsapp-parcial {
            font-family: monospace;
            font-size: 12px;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 10px;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--azul-claro);
            border-top-color: var(--oro);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://github.com/habitatcar/habitatcar.github.io/blob/main/logo.png?raw=true" class="logo" alt="Habitat-Car">
        <a href="admin_comercios.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver a Comercios</a>
    </div>

    <div id="comercio-info" class="comercio-info">
        <h1 id="comercio-nombre">Cargando...</h1>
        <p id="comercio-detalle"></p>
    </div>

    <div class="resumen">
        <div class="resumen-card">
            <h3 id="total-canjes">0</h3>
            <p>Total Canjes</p>
        </div>
        <div class="resumen-card">
            <h3 id="total-leads">0</h3>
            <p>Canjes LEAD</p>
        </div>
        <div class="resumen-card">
            <h3 id="total-vips">0</h3>
            <p>Canjes VIP</p>
        </div>
        <div class="resumen-card">
            <h3 id="monto-total">$0</h3>
            <p>Monto Total Facturado</p>
        </div>
    </div>

    <div class="filtros-bar">
        <input type="text" id="filtro-fecha" class="filtro-input" placeholder="Buscar por fecha (dd/mm/aaaa)">
        <input type="text" id="filtro-usuario" class="filtro-input" placeholder="Buscar por nombre o WhatsApp">
        <select id="filtro-tipo" class="filtro-input">
            <option value="todos">Todos los tipos</option>
            <option value="LEAD">LEAD</option>
            <option value="VIP">VIP</option>
        </select>
        <button class="btn-filtro" onclick="aplicarFiltros()"><i class="fas fa-search"></i> Buscar</button>
        <button class="btn-filtro" onclick="limpiarFiltros()"><i class="fas fa-eraser"></i> Limpiar</button>
        <button class="btn-filtro btn-pdf" onclick="exportarPDF()"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
    </div>

    <div class="tabla-container">
        <table id="tabla-canjes">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Tipo</th>
                    <th>Usuario</th>
                    <th>WhatsApp</th>
                    <th>Código Canje</th>
                    <th>N° Factura</th>
                    <th>Monto ($)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-canjes">
                <tr><td colspan="8" class="loading-spinner"><div class="spinner"></div> Cargando historial...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, updateDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",
            storageBucket: "habitatcar-pro.firebasestorage.app",
            messagingSenderId: "311691258694",
            appId: "1:311691258694:web:17a09051dcea7707af9347"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const comercioId = urlParams.get('id');
        const comercioNombre = urlParams.get('nombre') || '';

        let todosLosCanjes = [];
        let canjesFiltrados = [];
        let unsubscribe = null;

        // ============================================
        // ⭐ FUNCIÓN PARA NORMALIZAR TEXTO (sin acentos)
        // ============================================
        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9\s]/g, '')
                .trim();
        }

        function mostrarInfoComercio() {
            const nombreDecodificado = decodeURIComponent(comercioNombre) || 'Comercio';
            document.getElementById('comercio-nombre').innerText = nombreDecodificado;
            document.getElementById('comercio-detalle').innerHTML = `ID: ${comercioId || '---'} | Historial completo de canjes de cupones | Actualización en tiempo real`;
        }

        function actualizarResumen() {
            const total = todosLosCanjes.length;
            const totalLeads = todosLosCanjes.filter(c => c.tipo === "LEAD").length;
            const totalVips = todosLosCanjes.filter(c => c.tipo === "VIP").length;
            const montoTotal = todosLosCanjes.reduce((sum, c) => sum + (parseFloat(c.monto) || 0), 0);
            
            document.getElementById('total-canjes').innerText = total;
            document.getElementById('total-leads').innerText = totalLeads;
            document.getElementById('total-vips').innerText = totalVips;
            document.getElementById('monto-total').innerText = `$${montoTotal.toFixed(2)}`;
        }

        function formatearFecha(timestamp) {
            if (!timestamp) return '---';
            try {
                let fecha = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return fecha.toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
            } catch(e) {
                return '---';
            }
        }

        function ocultarWhatsapp(whatsapp) {
            if (!whatsapp) return '---';
            const str = whatsapp.toString();
            if (str.length <= 6) return str;
            return str.slice(0, 4) + '****' + str.slice(-2);
        }

        function ocultarNombre(nombreCompleto) {
            if (!nombreCompleto) return '---';
            const partes = nombreCompleto.split(',');
            if (partes.length >= 2) {
                const apellido = partes[0].trim();
                const nombre = partes[1].trim().split(' ')[0];
                return `${nombre} ${apellido.charAt(0)}.`;
            }
            const nombres = nombreCompleto.split(' ');
            if (nombres.length >= 2) {
                return `${nombres[0]} ${nombres[1].charAt(0)}.`;
            }
            return nombreCompleto.length > 10 ? nombreCompleto.substring(0, 10) + '...' : nombreCompleto;
        }

        window.aplicarFiltros = () => {
            const fechaFiltro = document.getElementById('filtro-fecha').value.toLowerCase();
            const usuarioFiltro = normalizarTexto(document.getElementById('filtro-usuario').value);
            const tipoFiltro = document.getElementById('filtro-tipo').value;
            
            canjesFiltrados = todosLosCanjes.filter(canje => {
                const fechaStr = formatearFecha(canje.timestamp);
                const fechaMatch = !fechaFiltro || fechaStr.toLowerCase().includes(fechaFiltro);
                
                const nombreCompleto = canje.nombre || '';
                const nombreNormalizado = normalizarTexto(nombreCompleto);
                const usuarioMatch = !usuarioFiltro || nombreNormalizado.includes(usuarioFiltro);
                
                const tipoMatch = tipoFiltro === 'todos' || canje.tipo === tipoFiltro;
                
                return fechaMatch && usuarioMatch && tipoMatch;
            });
            
            renderizarTabla();
        };

        window.limpiarFiltros = () => {
            document.getElementById('filtro-fecha').value = '';
            document.getElementById('filtro-usuario').value = '';
            document.getElementById('filtro-tipo').value = 'todos';
            aplicarFiltros();
        };

        function renderizarTabla() {
            const tbody = document.getElementById('lista-canjes');
            
            if (canjesFiltrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="sin-datos">📭 No hay registros de canjes para mostrar</td></tr>';
                return;
            }
            
            let html = '';
            canjesFiltrados.forEach(canje => {
                const fecha = formatearFecha(canje.timestamp);
                const tipoClass = canje.tipo === 'VIP' ? 'badge-vip' : 'badge-lead';
                const nombreMostrar = ocultarNombre(canje.nombre || '');
                const whatsappMostrar = ocultarWhatsapp(canje.whatsapp);
                const codigo = canje.idValidacion || canje.codigo || '---';
                const factura = canje.numeroFactura || '';
                const monto = canje.monto ? parseFloat(canje.monto).toFixed(2) : '';
                
                html += `
                    <tr>
                        <td style="white-space: nowrap;">${fecha}</td>
                        <td><span class="${tipoClass}">${canje.tipo}</span></td>
                        <td class="nombre-usuario">${nombreMostrar}</td>
                        <td class="whatsapp-parcial">${whatsappMostrar}</td>
                        <td style="font-family: monospace; font-size: 11px;">${codigo}</td>
                        <td><input type="text" id="factura-${canje.id}" class="input-factura" value="${factura.replace(/"/g, '&quot;')}" placeholder="N° Factura"></td>
                        <td><input type="number" id="monto-${canje.id}" class="input-monto" value="${monto}" placeholder="Monto" step="0.01"></td>
                        <td><button class="btn-guardar" onclick="guardarDatos('${canje.id}')"><i class="fas fa-save"></i> Guardar</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        window.guardarDatos = async (logId) => {
            const facturaInput = document.getElementById(`factura-${logId}`);
            const montoInput = document.getElementById(`monto-${logId}`);
            
            const numeroFactura = facturaInput ? facturaInput.value.trim() : '';
            const monto = montoInput ? parseFloat(montoInput.value) : null;
            
            try {
                const logRef = doc(db, "logs_actividad", logId);
                const updates = {};
                if (numeroFactura) updates.numeroFactura = numeroFactura;
                if (monto !== null && !isNaN(monto)) updates.monto = monto;
                
                if (Object.keys(updates).length > 0) {
                    await updateDoc(logRef, updates);
                    
                    // Actualizar en el array local
                    const canje = todosLosCanjes.find(c => c.id === logId);
                    if (canje) {
                        if (numeroFactura) canje.numeroFactura = numeroFactura;
                        if (monto !== null && !isNaN(monto)) canje.monto = monto;
                    }
                    
                    actualizarResumen();
                    aplicarFiltros();
                    
                    const toast = document.createElement('div');
                    toast.textContent = '✅ Datos guardados';
                    toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#28a745;color:white;padding:10px 20px;border-radius:8px;z-index:1000;';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2000);
                }
            } catch (error) {
                console.error("Error guardando datos:", error);
                alert("❌ Error al guardar los datos");
            }
        };

        window.exportarPDF = async () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            
            const comercioNombreTexto = decodeURIComponent(comercioNombre) || 'Comercio';
            const fechaActual = new Date().toLocaleString('es-AR');
            
            doc.setFontSize(18);
            doc.setTextColor(0, 74, 153);
            doc.text(`Historial de Canjes - ${comercioNombreTexto}`, 14, 20);
            
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`Generado: ${fechaActual}`, 14, 28);
            doc.text(`Total canjes: ${canjesFiltrados.length}`, 14, 34);
            
            const totalMonto = canjesFiltrados.reduce((sum, c) => sum + (parseFloat(c.monto) || 0), 0);
            doc.text(`Monto total facturado: $${totalMonto.toFixed(2)}`, 14, 40);
            
            const tablaData = canjesFiltrados.map(canje => [
                formatearFecha(canje.timestamp),
                canje.tipo,
                ocultarNombre(canje.nombre || ''),
                ocultarWhatsapp(canje.whatsapp),
                canje.idValidacion || canje.codigo || '---',
                canje.numeroFactura || '---',
                canje.monto ? `$${parseFloat(canje.monto).toFixed(2)}` : '---'
            ]);
            
            doc.autoTable({
                startY: 48,
                head: [['Fecha', 'Tipo', 'Usuario', 'WhatsApp', 'Código', 'N° Factura', 'Monto']],
                body: tablaData,
                headStyles: { fillColor: [0, 74, 153], textColor: 255, fontSize: 9 },
                bodyStyles: { fontSize: 8 },
                theme: 'striped'
            });
            
            doc.save(`historial_${comercioNombreTexto.replace(/\s+/g, '_')}_${new Date().getTime()}.pdf`);
        };

        // =============================================
        // ⭐ INICIAR SNAPSHOT EN TIEMPO REAL - CORREGIDO
        // =============================================
        function iniciarSnapshot() {
            if (!comercioId || !comercioNombre) {
                document.getElementById('lista-canjes').innerHTML = '<tr><td colspan="8" class="sin-datos">❌ No se especificó un comercio válido</td></tr>';
                return;
            }
            
            if (unsubscribe) unsubscribe();
            
            const logsRef = collection(db, "logs_actividad");
            
            // ⭐ CORRECCIÓN: Filtrar por nombreComercio (que SÍ existe en los logs)
            // Usamos nombre normalizado para evitar problemas con acentos/mayúsculas
            const nombreComercioNormalizado = normalizarTexto(decodeURIComponent(comercioNombre));
            
            console.log("🔍 Iniciando snapshot para comercio:", nombreComercioNormalizado);
            
            // Primero cargamos todos los logs de tipo CANJE y filtramos en cliente
            // (Firestore no permite filter por texto parcial, así que filtramos después)
            const q = query(logsRef, where("tipo", "==", "canje"), orderBy("timestamp", "desc"));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                console.log("📊 Snapshot recibido, documentos totales:", snapshot.size);
                todosLosCanjes = [];
                
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    // ⭐ Filtrar por nombre de comercio (normalizado para comparar)
                    const nombreEnLog = normalizarTexto(data.nombreComercio || '');
                    
                    if ((data.accion === "CANJE VIP" || data.accion === "CANJE LEADS") && 
                        nombreEnLog === nombreComercioNormalizado) {
                        
                        todosLosCanjes.push({
                            id: docSnap.id,
                            ...data,
                            tipo: data.accion === "CANJE VIP" ? "VIP" : "LEAD"
                        });
                    }
                });
                
                console.log("📊 Canjes encontrados para este comercio:", todosLosCanjes.length);
                actualizarResumen();
                aplicarFiltros();
                
            }, (error) => {
                console.error("❌ Error en snapshot:", error);
                document.getElementById('lista-canjes').innerHTML = `<tr><td colspan="8" class="sin-datos">❌ Error: ${error.message}</td></tr>`;
            });
        }

        // Inicializar
        mostrarInfoComercio();
        iniciarSnapshot();
    </script>
</body>
</html>
