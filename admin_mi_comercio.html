<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Comercio | HABITAT-CAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --azul-oscuro: #0a192f;
            --azul-medio: #1e2a4a;
            --azul-claro: #2a3a6a;
            --dorado: #d4af37;
            --dorado-oscuro: #b8960c;
            --verde-exito: #28a745;
            --rojo-error: #dc3545;
            --blanco: #ffffff;
            --gris-claro: #f0f2f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-medio) 100%);
            color: var(--blanco);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--dorado);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }
        
        .btn-volver {
            background: linear-gradient(135deg, var(--azul-claro), var(--azul-medio));
            color: var(--blanco);
            border: 2px solid var(--dorado);
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-volver:hover {
            background: var(--dorado);
            color: var(--azul-oscuro);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .full {
            grid-column: span 2;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--dorado);
            font-weight: 600;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: var(--blanco);
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--dorado);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        
        .read-only {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #ccc !important;
            cursor: not-allowed;
        }
        
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--dorado), var(--dorado-oscuro));
            color: var(--azul-oscuro);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
        }
        
        .loading, .error {
            text-align: center;
            padding: 50px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .loading i {
            color: var(--dorado);
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        .error {
            color: var(--rojo-error);
            border: 2px solid var(--rojo-error);
        }
        
        details {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--dorado);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        summary {
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            color: var(--dorado);
            background: rgba(212, 175, 55, 0.1);
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        summary::-webkit-details-marker {
            display: none;
        }
        
        summary::after {
            content: "▼";
            font-size: 0.8em;
            transition: transform 0.3s;
        }
        
        details[open] summary::after {
            transform: rotate(180deg);
        }
        
        .details-content {
            padding: 15px;
        }
        
        /* MODAL PROFESIONAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-contenido {
            background: linear-gradient(135deg, var(--azul-medio), var(--azul-oscuro));
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 3px solid var(--dorado);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
        }
        
        .modal-titulo {
            color: var(--dorado);
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .modal-mensaje {
            color: var(--blanco);
            font-size: 1.1em;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .modal-icono {
            font-size: 4em;
            margin-bottom: 15px;
        }
        
        .modal-icono.exito {
            color: var(--verde-exito);
        }
        
        .modal-icono.error {
            color: var(--rojo-error);
        }
        
        .modal-boton {
            background: linear-gradient(135deg, var(--dorado), var(--dorado-oscuro));
            color: var(--azul-oscuro);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
        }
        
        .modal-boton:hover {
            background: transparent;
            color: var(--dorado);
            border-color: var(--dorado);
            transform: scale(1.05);
        }
        
        .modal-boton.error-btn {
            background: linear-gradient(135deg, var(--rojo-error), #b02a37);
        }
        
        .modal-boton.error-btn:hover {
            background: transparent;
            color: var(--rojo-error);
            border-color: var(--rojo-error);
        }
        
        .logo-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            border: 3px solid var(--dorado);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- MODAL PROFESIONAL -->
    <div id="modalProfesional" class="modal-overlay">
        <div class="modal-contenido">
            <img src="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png" class="modal-logo" alt="Hábitat-Car">
            <div id="modalIcono" class="modal-icono"></div>
            <div id="modalTitulo" class="modal-titulo"></div>
            <div id="modalMensaje" class="modal-mensaje"></div>
            <button id="modalBoton" class="modal-boton">ACEPTAR</button>
        </div>
    </div>

    <div class="header">
        <img src="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png" class="logo" alt="Habitat-Car">
        <h1 style="color: var(--dorado); margin: 0; font-size: 1.8em; text-transform: uppercase; letter-spacing: 2px;">MI COMERCIO</h1>
        <a href="admin_ingreso_duenos.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i> VOLVER AL PANEL
        </a>
    </div>

    <div class="container">
        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Cargando tu comercio...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="form-container" style="display: block;">
            <div class="card-form">
                <h2 style="color: var(--dorado); margin-top: 0; margin-bottom: 20px; text-align: center; font-size: 1.8em;">EDITAR MI COMERCIO</h2>
                <input type="hidden" id="edit-id">
                <input type="hidden" id="logo-url-actual">

                <div class="form-grid">
                    <div>
                        <label>Nombre Fantasía</label>
                        <input type="text" id="nombre-input" class="read-only" readonly>
                    </div>

                    <div>
                        <label>Rubro</label>
                        <input type="text" id="rubro-input" class="read-only" readonly>
                    </div>

                    <div>
                        <label>ID Sistema</label>
                        <input type="text" id="id-input" class="read-only" readonly>
                    </div>

                    <div>
                        <label>Token QR</label>
                        <input type="text" id="token-input" class="read-only" readonly>
                    </div>

                    <div class="full">
                        <label>Logo</label>
                        <input type="file" id="logo-file" accept="image/*">
                        <div id="logo-preview" style="margin-top: 10px;"></div>
                    </div>

                    <details>
                        <summary>🎁 BENEFICIO LEADS</summary>
                        <div class="details-content">
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                                <div>
                                    <label>Desc. %</label>
                                    <input type="text" id="desc-lead">
                                </div>
                                <div>
                                    <label>Usos</label>
                                    <input type="number" id="usos-lead" value="1">
                                </div>
                                <div>
                                    <label>Vigencia (días)</label>
                                    <input type="number" id="vigencia-lead">
                                </div>
                            </div>
                            <input type="text" id="detalle-lead" placeholder="Detalle del beneficio" style="margin-top: 10px;">
                        </div>
                    </details>

                    <details>
                        <summary>👑 BENEFICIO VIP</summary>
                        <div class="details-content">
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                                <div>
                                    <label>Desc. %</label>
                                    <input type="text" id="desc-vip">
                                </div>
                                <div>
                                    <label>Usos</label>
                                    <input type="number" id="usos-vip" value="0">
                                </div>
                                <div>
                                    <label>Vigencia (días)</label>
                                    <input type="number" id="vigencia-vip">
                                </div>
                            </div>
                            <input type="text" id="detalle-vip" placeholder="Detalle del beneficio" style="margin-top: 10px;">
                        </div>
                    </details>

                    <details>
                        <summary>🌐 REDES SOCIALES</summary>
                        <div class="details-content">
                            <div>
                                <label>Facebook</label>
                                <input type="text" id="facebook-input" placeholder="https://facebook.com/...">
                            </div>
                            <div>
                                <label>Instagram</label>
                                <input type="text" id="instagram-input" placeholder="https://instagram.com/...">
                            </div>
                            <div>
                                <label>TikTok</label>
                                <input type="text" id="web-input" placeholder="https://tiktok.com/...">
                            </div>
                            <div>
                                <label>Sitio Web</label>
                                <input type="text" id="sitio-web-input" placeholder="https://...">
                            </div>
                        </div>
                    </details>

                    <details>
                        <summary>🎁 SORTEOS Y PROMOCIONES</summary>
                        <div class="details-content">
                            <div>
                                <label>Título del Sorteo</label>
                                <input type="text" id="titulo_sorteo">
                            </div>
                            <div>
                                <label>Descripción del Sorteo</label>
                                <textarea id="descripcion_sorteo" rows="2"></textarea>
                            </div>
                            <div>
                                <label>Cantidad de Premios</label>
                                <input type="number" id="cantidad_premios" min="1" value="1">
                            </div>
                            <div>
                                <label>Fecha y Hora del Sorteo</label>
                                <input type="datetime-local" id="fecha_sorteo">
                            </div>
                            <div style="margin-top: 15px;">
                                <label>Título de la Promoción</label>
                                <input type="text" id="titulo_promo">
                            </div>
                            <div>
                                <label>Descripción de la Promo</label>
                                <textarea id="descripcion_promo" rows="2"></textarea>
                            </div>
                            <div>
                                <label>Promo válida hasta:</label>
                                <input type="datetime-local" id="promo_vence">
                            </div>
                        </div>
                    </details>

                    <div class="full">
                        <label>Dirección</label>
                        <input type="text" id="direccion-input">
                    </div>

                    <div>
                        <label>Provincia</label>
                        <select id="provincia-input" onchange="actualizarLocalidades()">
                            <option value="">Seleccionar...</option>
                            <option value="Buenos Aires">Buenos Aires</option>
                            <option value="CABA">CABA</option>
                            <option value="Córdoba">Córdoba</option>
                            <option value="Santa Fe">Santa Fe</option>
                            <option value="Mendoza">Mendoza</option>
                            <option value="Neuquén">Neuquén</option>
                            <option value="Entre Ríos">Entre Ríos</option>
                            <option value="Tucumán">Tucumán</option>
                            <option value="Salta">Salta</option>
                            <option value="Misiones">Misiones</option>
                            <option value="Corrientes">Corrientes</option>
                            <option value="Santiago del Estero">Santiago del Estero</option>
                            <option value="San Juan">San Juan</option>
                            <option value="Jujuy">Jujuy</option>
                            <option value="Río Negro">Río Negro</option>
                            <option value="Formosa">Formosa</option>
                            <option value="Chaco">Chaco</option>
                            <option value="Chubut">Chubut</option>
                            <option value="San Luis">San Luis</option>
                            <option value="Catamarca">Catamarca</option>
                            <option value="La Rioja">La Rioja</option>
                            <option value="La Pampa">La Pampa</option>
                            <option value="Santa Cruz">Santa Cruz</option>
                            <option value="Tierra del Fuego">Tierra del Fuego</option>
                        </select>
                    </div>

                    <div>
                        <label>Ciudad / Localidad</label>
                        <select id="ciudad-input">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>

                    <div>
                        <label>WhatsApp</label>
                        <input type="text" id="telefono-input">
                    </div>

                    <div>
                        <label>Ubicación Maps</label>
                        <input type="text" id="maps-url" placeholder="URL de Google Maps">
                    </div>

                    <div>
                        <label>Email del Dueño</label>
                        <input type="email" id="email-input" class="read-only" readonly>
                    </div>

                    <div>
                        <label>Contraseña</label>
                        <input type="password" id="password-input" placeholder="Nueva contraseña (opcional)">
                        <small style="color: #aaa; display: block; margin-top: 5px;">Dejar en blanco para mantener la actual</small>
                    </div>

                    <div>
                        <label>Frecuencia de Reporte</label>
                        <select id="reporte-input">
                            <option value="Semanal">Semanal</option>
                            <option value="Quincenal">Quincenal</option>
                            <option value="Mensual">Mensual</option>
                        </select>
                    </div>
                </div>

                <button class="btn-submit" onclick="guardar()">
                    <i class="fas fa-save"></i> GUARDAR CAMBIOS
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",
            storageBucket: "habitatcar-pro.firebasestorage.app",
            messagingSenderId: "311691258694",
            appId: "1:311691258694:web:17a09051dcea7707af9347"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Obtener UID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');

        console.log("UID recibido:", uid);

        if (!uid) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').innerHTML = '❌ No se especificó un UID de comercio';
        }

        // Función para mostrar modal
        function mostrarModal(tipo, mensaje) {
            const modal = document.getElementById('modalProfesional');
            const icono = document.getElementById('modalIcono');
            const titulo = document.getElementById('modalTitulo');
            const mensajeEl = document.getElementById('modalMensaje');
            const boton = document.getElementById('modalBoton');

            if (tipo === 'exito') {
                icono.innerHTML = '<i class="fas fa-check-circle"></i>';
                icono.className = 'modal-icono exito';
                titulo.innerText = '¡OPERACIÓN EXITOSA!';
                boton.className = 'modal-boton';
            } else {
                icono.innerHTML = '<i class="fas fa-times-circle"></i>';
                icono.className = 'modal-icono error';
                titulo.innerText = '¡ERROR!';
                boton.className = 'modal-boton error-btn';
            }

            mensajeEl.innerText = mensaje;
            modal.style.display = 'flex';

            // Cerrar al hacer click en el botón
            boton.onclick = () => {
                modal.style.display = 'none';
                if (tipo === 'exito') {
                    location.reload(); // Recargar después del éxito
                }
            };

            // Cerrar al hacer click fuera del modal
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            };
        }

        // Función para actualizar localidades
        window.actualizarLocalidades = async (seleccionada = "") => {
            const prov = document.getElementById('provincia-input').value;
            const ciudadSelect = document.getElementById('ciudad-input');
            ciudadSelect.innerHTML = '<option value="">Cargando...</option>';

            if (!prov) {
                ciudadSelect.innerHTML = '<option value="">Seleccionar...</option>';
                return;
            }

            try {
                const response = await fetch(`https://apis.datos.gob.ar/georef/api/municipios?provincia=${encodeURIComponent(prov)}&max=1000&campos=id,nombre`);
                const data = await response.json();
                ciudadSelect.innerHTML = '<option value="">Seleccionar...</option>';

                if (data.municipios && data.municipios.length > 0) {
                    data.municipios.sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.nombre;
                        opt.textContent = m.nombre;
                        ciudadSelect.appendChild(opt);
                    });
                }

                if (seleccionada) ciudadSelect.value = seleccionada;

            } catch (error) {
                console.error("Error cargando localidades:", error);
                ciudadSelect.innerHTML = '<option value="">Error al cargar</option>';
            }
        };

        // Función para cargar el comercio
        async function cargarComercio() {
            document.getElementById('loading').style.display = 'flex';
            
            try {
                console.log("Buscando comercio con UID:", uid);
                
                const q = query(collection(db, "comercios"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    console.error("No se encontró comercio con UID:", uid);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerHTML = '❌ No se encontró el comercio';
                    return;
                }

                const docSnap = querySnapshot.docs[0];
                const data = docSnap.data();
                const fbId = docSnap.id;

                console.log("Comercio encontrado:", data.nombre);

                document.getElementById('edit-id').value = fbId;

                // Llenar formulario
                document.getElementById('nombre-input').value = data.nombre || '';
                document.getElementById('rubro-input').value = data.rubro || '';
                document.getElementById('id-input').value = data.idComercio || '';
                document.getElementById('token-input').value = data.tokenQR || '';
                document.getElementById('logo-url-actual').value = data.logoUrl || '';
                document.getElementById('desc-lead').value = data.descLead || '';
                document.getElementById('detalle-lead').value = data.detalleLead || '';
                document.getElementById('usos-lead').value = data.usosLead || 1;
                document.getElementById('vigencia-lead').value = data.vigenciaLead || '';
                document.getElementById('desc-vip').value = data.descVip || '';
                document.getElementById('detalle-vip').value = data.detalleVip || '';
                document.getElementById('usos-vip').value = data.usosVip || 0;
                document.getElementById('vigencia-vip').value = data.vigenciaVip || '';
                document.getElementById('titulo_sorteo').value = data.titulo_sorteo || '';
                document.getElementById('descripcion_sorteo').value = data.descripcion_sorteo || '';
                document.getElementById('cantidad_premios').value = data.cantidad_premios || 1;
                document.getElementById('fecha_sorteo').value = data.fecha_sorteo || '';
                document.getElementById('titulo_promo').value = data.titulo_promo || '';
                document.getElementById('descripcion_promo').value = data.descripcion_promo || '';
                document.getElementById('promo_vence').value = data.promo_vence || '';
                document.getElementById('direccion-input').value = data.direccion || '';
                document.getElementById('provincia-input').value = data.provincia || '';
                document.getElementById('telefono-input').value = data.telefono || '';
                document.getElementById('facebook-input').value = data.facebook || '';
                document.getElementById('instagram-input').value = data.instagram || '';
                document.getElementById('web-input').value = data.web || '';
                document.getElementById('sitio-web-input').value = data.sitioWeb || '';
                document.getElementById('maps-url').value = data.mapsUrl || '';
                document.getElementById('email-input').value = data.emailDueno || '';
                document.getElementById('reporte-input').value = data.frecuenciaReporte || 'Semanal';

                if (data.provincia) {
                    await actualizarLocalidades(data.ciudad);
                }

                if (data.logoUrl) {
                    document.getElementById('logo-preview').innerHTML = `<img src="${data.logoUrl}" class="logo-preview">`;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('form-container').style.display = 'block';

            } catch (error) {
                console.error("Error cargando comercio:", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = '❌ Error al cargar los datos';
            }
        }

        // Función para subir logo
        async function subirLogo(archivo) {
            if (!archivo) return null;
            const nombreArchivo = `logos/${Date.now()}_${archivo.name}`;
            const storageRef = ref(storage, nombreArchivo);
            const snapshot = await uploadBytes(storageRef, archivo);
            return await getDownloadURL(snapshot.ref);
        }

        // Función para guardar
        window.guardar = async () => {
            const fbId = document.getElementById('edit-id').value;
            const file = document.getElementById('logo-file').files[0];

            const data = {
                nombre: document.getElementById('nombre-input').value,
                rubro: document.getElementById('rubro-input').value,
                descLead: document.getElementById('desc-lead').value,
                detalleLead: document.getElementById('detalle-lead').value,
                usosLead: parseInt(document.getElementById('usos-lead').value) || 1,
                vigenciaLead: document.getElementById('vigencia-lead').value,
                descVip: document.getElementById('desc-vip').value,
                detalleVip: document.getElementById('detalle-vip').value,
                usosVip: parseInt(document.getElementById('usos-vip').value) || 0,
                vigenciaVip: document.getElementById('vigencia-vip').value,
                titulo_sorteo: document.getElementById('titulo_sorteo').value,
                descripcion_sorteo: document.getElementById('descripcion_sorteo').value,
                cantidad_premios: parseInt(document.getElementById('cantidad_premios').value) || 1,
                fecha_sorteo: document.getElementById('fecha_sorteo').value,
                titulo_promo: document.getElementById('titulo_promo').value,
                descripcion_promo: document.getElementById('descripcion_promo').value,
                promo_vence: document.getElementById('promo_vence').value,
                direccion: document.getElementById('direccion-input').value,
                provincia: document.getElementById('provincia-input').value,
                ciudad: document.getElementById('ciudad-input').value,
                telefono: document.getElementById('telefono-input').value,
                facebook: document.getElementById('facebook-input').value,
                instagram: document.getElementById('instagram-input').value,
                web: document.getElementById('web-input').value,
                sitioWeb: document.getElementById('sitio-web-input').value,
                mapsUrl: document.getElementById('maps-url').value,
                frecuenciaReporte: document.getElementById('reporte-input').value
            };

            const newPassword = document.getElementById('password-input').value;
            if (newPassword) {
                data.password = newPassword;
            }

            try {
                await updateDoc(doc(db, "comercios", fbId), data);

                if (file) {
                    const logoUrl = await subirLogo(file);
                    await updateDoc(doc(db, "comercios", fbId), { logoUrl });
                }

                mostrarModal('exito', 'SUS DATOS FUERON ACTUALIZADOS CORRECTAMENTE');

            } catch (error) {
                console.error("Error guardando:", error);
                mostrarModal('error', 'HUBO UN ERROR AL GUARDAR LOS CAMBIOS');
            }
        };

        // Iniciar carga
        cargarComercio();
    </script>
</body>
</html>
