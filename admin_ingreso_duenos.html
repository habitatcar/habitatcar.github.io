<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Panel Comercio | HABITAT-CAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --dorado: #d4af37; }
        body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; padding: 16px; padding-bottom: 90px; }
        .text-dorado { color: var(--dorado); }
        .bg-dorado { background: var(--dorado); }
        .card { background: #111; border-radius: 20px; padding: 16px; }
        .badge-vip { background: rgba(212,175,55,0.2); color: #d4af37; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-lead { background: rgba(59,130,246,0.2); color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .contenedor-tabla { max-height: 400px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background: #1a1a1a; z-index: 10; }
        #customAlert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: black; border: 2px solid var(--dorado); padding: 12px 24px; border-radius: 40px; z-index: 9999; display: none; font-weight: bold; white-space: nowrap; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-content { background: #1a1a1a; border-radius: 32px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--dorado); padding: 20px; }
        @media (max-width: 640px) { .valor-metrica { font-size: 28px; } }
        
        /* Estilos para el PDF - fondo blanco */
        .pdf-reporte {
            background: white;
            font-family: Arial, sans-serif;
            padding: 30px;
            color: #1f2937;
        }
        .pdf-reporte h1 { color: #b8860b; font-size: 24px; margin: 0; }
        .pdf-reporte h2 { color: #b8860b; font-size: 18px; margin: 0 0 10px 0; }
        .pdf-reporte .resumen { background: #f3f4f6; padding: 15px; border-radius: 12px; margin: 15px 0; }
        .pdf-reporte table { width: 100%; border-collapse: collapse; font-size: 10px; }
        .pdf-reporte th { background: #f3f4f6; padding: 8px; text-align: left; border-bottom: 2px solid #e5e7eb; }
        .pdf-reporte td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; }
        .pdf-reporte .badge-vip-pdf { background: #fef3c7; color: #b8860b; padding: 2px 8px; border-radius: 12px; font-size: 9px; font-weight: bold; display: inline-block; }
        .pdf-reporte .badge-lead-pdf { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 12px; font-size: 9px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

<div id="customAlert"></div>

<div id="app">
    <!-- HEADER -->
    <div class="flex items-center justify-between flex-wrap gap-3 border-b-2 border-dorado pb-4 mb-6">
        <div class="flex items-center gap-3">
            <img src="https://github.com/habitatcar/habitatcar.github.io/blob/main/logo.png?raw=true" class="h-12 md:h-16" alt="logo">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-white">HABITAT-CAR</h1>
                <p class="text-dorado text-[10px] uppercase tracking-wider">Gestiones Automotor e Inmobiliarias</p>
            </div>
        </div>
        <button id="btnCerrarSesion" onclick="cerrarSesion()" class="bg-red-600 px-4 py-2 rounded-full text-sm font-bold hidden">🔒 SALIR</button>
    </div>

    <div id="nombreComercio" class="text-center text-dorado font-bold text-lg mb-2"></div>

    <!-- LOGIN -->
    <div id="loginBox" class="card border border-dorado max-w-md mx-auto">
        <h2 class="text-dorado text-center font-bold mb-4">ACCESO COMERCIO</h2>
        <input type="email" id="email" placeholder="Email" class="w-full bg-black border border-gray-700 p-3 rounded-xl mb-3 text-white">
        <input type="password" id="password" placeholder="Contraseña" class="w-full bg-black border border-gray-700 p-3 rounded-xl mb-4 text-white">
        <button onclick="login()" class="w-full bg-dorado text-black font-bold py-3 rounded-xl">INGRESAR</button>
        <p id="errorMsg" class="text-red-500 text-xs text-center mt-3 hidden"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button onclick="irAFicha()" class="bg-dorado text-black font-bold py-3 rounded-xl">⚙️ MI FICHA</button>
            <button onclick="abrirVIP()" class="bg-yellow-600 text-white font-bold py-3 rounded-xl">✨ INVITACIONES VIP</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="card text-center"><div class="text-gray-400 text-[10px]">TOTAL</div><div id="total" class="text-3xl font-bold">0</div></div>
            <div class="card text-center"><div class="text-gray-400 text-[10px]">VIP</div><div id="vip" class="text-3xl font-bold text-dorado">0</div></div>
            <div class="card text-center"><div class="text-gray-400 text-[10px]">LEAD</div><div id="lead" class="text-3xl font-bold text-blue-500">0</div></div>
            <div class="card text-center"><div class="text-gray-400 text-[10px]">ÚLTIMO</div><div id="ultimo" class="text-sm font-bold">--:--</div></div>
        </div>

        <div class="card mb-5">
            <canvas id="grafico" height="200"></canvas>
        </div>

        <div class="card p-0 overflow-hidden">
            <div class="contenedor-tabla">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-900 text-gray-400 text-[10px] uppercase">
                        <tr><th class="p-3">FECHA</th><th>TIPO</th><th>CUPÓN</th><th>DETALLE</th></tr>
                    </thead>
                    <tbody id="tablaRegistros" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL VIP -->
    <div id="modalVIP" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4"><h2 class="text-dorado text-xl font-bold">✨ Pases VIP</h2><button onclick="cerrarVIP()" class="text-gray-400 text-2xl">&times;</button></div>
            <div id="listaTokens" class="space-y-3 max-h-[50vh] overflow-y-auto"></div>
            <button onclick="cerrarVIP()" class="w-full mt-4 bg-gray-800 py-3 rounded-xl text-sm">CERRAR</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/90 border-t border-dorado p-3 flex gap-3 justify-center">
        <button onclick="generarPDF()" class="bg-white text-black px-5 py-2 rounded-xl font-bold">🖨️ PDF</button>
        <button onclick="compartirPDF()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold">📤 COMPARTIR</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
        authDomain: "habitatcar-pro.firebaseapp.com",
        projectId: "habitatcar-pro",
        storageBucket: "habitatcar-pro.firebasestorage.app",
        messagingSenderId: "311691258694",
        appId: "1:311691258694:web:17a09051dcea7707af9347"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    let comercio = null;
    let grafico = null;
    let registros = [];

    const alerta = (msg) => { let a = document.getElementById('customAlert'); a.innerText = msg; a.style.display = 'block'; setTimeout(() => a.style.display = 'none', 3000); };
    window.cerrarSesion = () => signOut(auth).then(() => location.reload());

    window.login = async () => {
        const email = document.getElementById('email').value;
        const pwd = document.getElementById('password').value;
        if(!email || !pwd) return alerta("Completá ambos campos");
        try {
            await signInWithEmailAndPassword(auth, email, pwd);
        } catch(e) {
            alerta(e.code === 'auth/invalid-credential' ? "Email o contraseña incorrectos" : "Error de conexión");
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if(!user) { 
            document.getElementById('loginBox').classList.remove('hidden'); 
            document.getElementById('dashboard').classList.add('hidden'); 
            document.getElementById('btnCerrarSesion').style.display = 'none'; 
            return; 
        }
        document.getElementById('btnCerrarSesion').style.display = 'block';
        const q = query(collection(db, "comercios"), where("uid", "==", user.uid));
        const snap = await getDocs(q);
        if(snap.empty) { alerta("Comercio no encontrado"); return; }
        comercio = { id: snap.docs[0].id, ...snap.docs[0].data() };
        document.getElementById('nombreComercio').innerText = comercio.nombre || "";
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        iniciarGrafico();
        escucharCanjes(comercio.id);
    });

    function iniciarGrafico() {
        const ctx = document.getElementById('grafico').getContext('2d');
        grafico = new Chart(ctx, {
            type: 'line',
            data: { labels: ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], datasets: [
                { label: 'VIP', data: [0,0,0,0,0,0,0], borderColor: '#d4af37', borderWidth: 2, fill: false },
                { label: 'LEAD', data: [0,0,0,0,0,0,0], borderColor: '#3b82f6', borderWidth: 2, fill: false }
            ]},
            options: { responsive: true, maintainAspectRatio: true }
        });
    }

    function escucharCanjes(comercioId) {
        const qVip = query(collection(db, "logs_vip"), where("comercioId", "==", comercioId));
        const qLead = query(collection(db, "logs_actividad"), where("comercioId", "==", comercioId), where("tipo", "==", "canje"));
        onSnapshot(qVip, (snap) => snap.docChanges().forEach(c => c.type === 'added' && agregarRegistro(c.doc.data(), true)));
        onSnapshot(qLead, (snap) => snap.docChanges().forEach(c => c.type === 'added' && agregarRegistro(c.doc.data(), false)));
    }

    function agregarRegistro(d, esVip) {
        let fecha = d.fecha?.toDate ? d.fecha.toDate() : (d.timestamp ? new Date(d.timestamp) : new Date());
        let cupon = d.idValidacion || d.codigoGenerado || d.idCupon || '-';
        let detalle = d.beneficio || d.detalle || d.nombre || '-';
        registros.unshift({ fecha, tipo: esVip ? 'VIP' : 'LEAD', cupon, detalle });
        if(registros.length > 100) registros.pop();
        
        let dia = fecha.getDay() === 0 ? 6 : fecha.getDay() - 1;
        if(grafico && dia >= 0 && dia <= 6) {
            grafico.data.datasets[esVip ? 0 : 1].data[dia]++;
            grafico.update();
        }
        
        let vip = parseInt(document.getElementById('vip').innerText);
        let lead = parseInt(document.getElementById('lead').innerText);
        if(esVip) document.getElementById('vip').innerText = vip + 1;
        else document.getElementById('lead').innerText = lead + 1;
        document.getElementById('total').innerText = (esVip ? vip + 1 : vip) + (esVip ? lead : lead + 1);
        document.getElementById('ultimo').innerText = fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        
        let tbody = document.getElementById('tablaRegistros');
        tbody.insertAdjacentHTML('afterbegin', `
            <tr><td class="p-2 text-xs">${fecha.toLocaleDateString()}<br><span class="text-gray-500">${fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></td>
            <td><span class="${esVip ? 'badge-vip' : 'badge-lead'}">${esVip ? 'VIP' : 'LEAD'}</span></td>
            <td class="text-xs font-mono">${cupon}</td>
            <td class="text-xs text-gray-400">${detalle}</td></tr>
        `);
        while(tbody.children.length > 100) tbody.removeChild(tbody.lastChild);
    }

    window.irAFicha = () => { if(comercio) location.href = `admin_mi_comercio.html?uid=${comercio.uid}`; };

    window.enviarWhatsApp = (link, nombre) => {
        let msg = `🏆 *REGISTRO VIP - HÁBITAT-CAR* 🏆\n\n¡Hola! Como sos parte importante de nuestro negocio *"${nombre}"* te comparto un pase VIP exclusivo para que accedas a cupones de descuentos especiales y exclusivos del Ecosistema Habitat-Car.\n\n✨ Beneficios exclusivos:\n• Descuentos especiales\n• Promociones anticipadas\n• Atención preferencial\n\n👉 Activá tu pase VIP aquí: ${link}\n\n¡No dejes pasar esta oportunidad! 🚀`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        alerta("📱 Abriendo WhatsApp");
    };

    window.copiarLink = (link) => { navigator.clipboard.writeText(link); alerta("✅ Link copiado"); };

    window.abrirVIP = async () => {
        if(!comercio) return;
        let modal = document.getElementById('modalVIP');
        let cont = document.getElementById('listaTokens');
        modal.style.display = 'flex';
        cont.innerHTML = '<div class="text-center text-dorado py-8">Cargando...</div>';
        
        let q = query(collection(db, "tokens_vip"), where("comercioId", "==", comercio.idComercio));
        let snap = await getDocs(q);
        let docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
        
        if(docs.length === 0) {
            for(let i=0;i<10;i++) {
                let tkn = `vip_${Math.random().toString(36).substring(2,8)}_${comercio.idComercio?.substring(0,3)}`;
                await addDoc(collection(db, "tokens_vip"), { token: tkn, comercioId: comercio.idComercio, estado: 'disponible', fechaCreacion: Date.now() });
            }
            return abrirVIP();
        }
        
        let disponibles = docs.filter(t => t.estado === 'disponible');
        let usadas = docs.filter(t => t.estado !== 'disponible');
        let html = '';
        if(disponibles.length) html += `<div class="text-dorado text-xs font-bold mb-2">🟢 DISPONIBLES (${disponibles.length})</div>`;
        disponibles.forEach((t,i) => {
            let link = `https://habitatcar.github.io/usuarios_registro_vip.html?t=${t.token}`;
            html += `<div class="bg-black/40 border border-dorado/40 rounded-xl p-3 mb-2">
                <div class="flex justify-between items-start mb-2"><div><span class="text-xs font-bold text-dorado">Invitación #${i+1}</span><div class="text-[10px] text-green-400">🟢 DISPONIBLE</div></div></div>
                <div class="flex gap-2"><button onclick="copiarLink('${link}')" class="flex-1 bg-gray-700 py-2 rounded-xl text-xs font-bold">📋 COPIAR</button><button onclick="enviarWhatsApp('${link}','${comercio.nombre.replace(/'/g, "\\'")}')" class="flex-1 bg-green-600 py-2 rounded-xl text-xs font-bold">💬 WHATSAPP</button></div>
            </div>`;
        });
        if(usadas.length) html += `<div class="text-gray-500 text-xs font-bold mt-3 mb-2">🔴 CANJEADAS (${usadas.length})</div>`;
        usadas.forEach(t => {
            html += `<div class="bg-black/20 border border-red-900/30 rounded-xl p-2 mb-1 opacity-60"><div class="text-[10px] text-gray-500">${t.token.substring(0,15)}... - CANJEADA</div></div>`;
        });
        cont.innerHTML = html;
    };

    window.cerrarVIP = () => { document.getElementById('modalVIP').style.display = 'none'; };

    // GENERAR PDF CON HTML2PDF - FONDO BLANCO
    window.generarPDF = async (soloBlob = false) => {
        let nombreComercio = comercio?.nombre || "Mi Comercio";
        let totalVip = parseInt(document.getElementById('vip').innerText) || 0;
        let totalLead = parseInt(document.getElementById('lead').innerText) || 0;
        let total = totalVip + totalLead;
        let conversion = total > 0 ? Math.round((totalVip/total)*100) : 0;
        
        // Construir tabla HTML
        let tablaHtml = '';
        registros.slice(0, 50).forEach(r => {
            let badgeClass = r.tipo === 'VIP' ? 'badge-vip-pdf' : 'badge-lead-pdf';
            let badgeText = r.tipo === 'VIP' ? 'VIP' : 'LEAD';
            tablaHtml += `
                <tr>
                    <td style="padding: 6px 8px; border-bottom: 1px solid #e5e7eb;">${r.fecha.toLocaleDateString()} ${r.fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
                    <td style="padding: 6px 8px; border-bottom: 1px solid #e5e7eb;"><span class="${badgeClass}" style="background:${r.tipo === 'VIP' ? '#fef3c7' : '#dbeafe'}; color:${r.tipo === 'VIP' ? '#b8860b' : '#1e40af'}; padding:2px 8px; border-radius:12px; font-size:9px; font-weight:bold;">${badgeText}</span></td>
                    <td style="padding: 6px 8px; border-bottom: 1px solid #e5e7eb;">${r.cupon}</td>
                    <td style="padding: 6px 8px; border-bottom: 1px solid #e5e7eb;">${r.detalle}</td>
                </tr>
            `;
        });
        
        // Obtener datos del gráfico
        let datosVip = grafico?.data.datasets[0].data || [0,0,0,0,0,0,0];
        let datosLead = grafico?.data.datasets[1].data || [0,0,0,0,0,0,0];
        let dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        let tablaSemanal = '';
        dias.forEach((dia, i) => {
            tablaSemanal += `<tr><td style="padding:6px;">${dia}</td><td style="padding:6px; text-align:center;">${datosVip[i]}</td><td style="padding:6px; text-align:center;">${datosLead[i]}</td><td style="padding:6px; text-align:center;">${datosVip[i] + datosLead[i]}</td></tr>`;
        });
        
        // HTML completo del PDF
        let pdfHtml = `
            <div class="pdf-reporte" style="background: white; font-family: Arial, sans-serif; padding: 30px; color: #1f2937;">
                <div style="text-align: center; border-bottom: 3px solid #b8860b; padding-bottom: 20px; margin-bottom: 20px;">
                    <img src="https://github.com/habitatcar/habitatcar.github.io/blob/main/logo.png?raw=true" style="height: 60px;">
                    <h1 style="color: #b8860b; font-size: 24px; margin: 10px 0 0 0;">HABITAT-CAR</h1>
                    <p style="color: #b8860b; font-size: 11px;">NEGOCIOS INMOBILIARIOS y GESTIONES DEL AUTOMOTOR</p>
                </div>
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="color: #b8860b; font-size: 18px; margin: 0;">${nombreComercio}</h2>
                    <p style="color: #6b7280; font-size: 10px;">Reporte generado: ${new Date().toLocaleString()}</p>
                </div>
                
                <div style="background: #f3f4f6; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                    <h3 style="color: #1f2937; font-size: 14px; margin: 0 0 10px 0;">📊 RESUMEN EJECUTIVO</h3>
                    <div style="display: flex; justify-content: space-around; text-align: center;">
                        <div><p style="color: #6b7280; font-size: 10px; margin:0;">TOTAL USUARIOS</p><p style="font-size: 28px; font-weight: bold; margin:5px 0;">${total}</p></div>
                        <div><p style="color: #6b7280; font-size: 10px; margin:0;">CANJES VIP</p><p style="font-size: 28px; font-weight: bold; color:#b8860b; margin:5px 0;">${totalVip}</p></div>
                        <div><p style="color: #6b7280; font-size: 10px; margin:0;">CANJES LEAD</p><p style="font-size: 28px; font-weight: bold; color:#3b82f6; margin:5px 0;">${totalLead}</p></div>
                    </div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb; text-align: center;">
                        <p style="color: #6b7280; font-size: 10px;">📈 Tasa de conversión: ${conversion}% | ⏱️ Último acceso: ${document.getElementById('ultimo').innerText}</p>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #1f2937; font-size: 14px; margin: 0 0 10px 0;">📈 ACTIVIDAD SEMANAL</h3>
                    <div style="background: #f9fafb; padding: 15px; border-radius: 12px;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                            <tr style="background: #f3f4f6;"><th style="padding: 8px; text-align: left;">Día</th><th style="padding: 8px; text-align: center;">VIP</th><th style="padding: 8px; text-align: center;">LEAD</th><th style="padding: 8px; text-align: center;">Total</th></tr>
                            ${tablaSemanal}
                        </table>
                    </div>
                </div>
                
                <div>
                    <h3 style="color: #1f2937; font-size: 14px; margin: 0 0 10px 0;">📋 REGISTRO DE ACTIVIDAD</h3>
                    <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                        <thead><tr style="background: #f3f4f6;"><th style="padding: 8px; text-align: left;">Fecha/Hora</th><th style="padding: 8px; text-align: left;">Tipo</th><th style="padding: 8px; text-align: left;">Cupón</th><th style="padding: 8px; text-align: left;">Detalle</th></tr></thead>
                        <tbody>${tablaHtml || '<tr><td colspan="4" style="text-align:center; padding:20px;">Sin registros de actividad</td></tr>'}</tbody>
                    </table>
                    <p style="color: #9ca3af; font-size: 8px; text-align: center; margin-top: 20px;">Reporte generado por HABITAT-CAR - Sistema de Gestión Comercial</p>
                </div>
            </div>
        `;
        
        // Crear elemento temporal para el PDF
        let tempDiv = document.createElement('div');
        tempDiv.innerHTML = pdfHtml;
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        tempDiv.style.top = '0';
        document.body.appendChild(tempDiv);
        
        let nav = document.querySelector('.fixed.bottom-0');
        nav.style.display = 'none';
        
        let opt = { 
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `Reporte_${nombreComercio.replace(/\s/g, '_')}_${new Date().toISOString().slice(0,10)}.pdf`, 
            image: { type: 'jpeg', quality: 0.95 }, 
            html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true }, 
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } 
        };
        
        try {
            let worker = html2pdf().set(opt).from(tempDiv);
            if (soloBlob) {
                let blob = await worker.output('blob');
                document.body.removeChild(tempDiv);
                nav.style.display = 'flex';
                return blob;
            }
            await worker.save();
            document.body.removeChild(tempDiv);
            nav.style.display = 'flex';
            alerta("✅ PDF generado correctamente");
        } catch(e) {
            console.error(e);
            document.body.removeChild(tempDiv);
            nav.style.display = 'flex';
            alerta("❌ Error al generar PDF");
        }
    };

    window.compartirPDF = async () => {
        try {
            let pdfBlob = await window.generarPDF(true);
            let file = new File([pdfBlob], `Reporte_${comercio?.nombre || 'Comercio'}.pdf`, { type: "application/pdf" });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'Reporte HABITAT-CAR' });
                alerta("✅ Reporte compartido");
            } else {
                alerta("📱 Tu navegador no soporta compartir archivos. El PDF se descargó.");
            }
        } catch(e) {
            if(e.name !== 'AbortError') alerta("❌ Error al compartir");
        }
    };
</script>
