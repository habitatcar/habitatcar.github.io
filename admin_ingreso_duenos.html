<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Panel | HABITAT-CAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dorado: #d4af37;
            --dorado-oscuro: #b8960c;
            --negro-fondo: #0a0a0a;
            --azul-medio: #1e2a4a;
            --azul-claro: #2a3a6a;
            --verde-exito: #28a745;
            --verde-claro: #4caf50;
            --rojo-error: #dc3545;
            --gris-volver: #6c757d;
        }

        body {
            background: linear-gradient(135deg, var(--negro-fondo) 0%, var(--azul-medio) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--dorado);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            height: 70px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }
        .btn-cerrar-sesion {
            background: var(--rojo-error);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-cerrar-sesion:hover {
            background: #bb2d3b;
            transform: scale(1.02);
        }

        .login-card {
            max-width: 400px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid var(--dorado);
        }
        .login-card input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--dorado);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--dorado-oscuro);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .btn-accion {
            background: linear-gradient(135deg, var(--dorado), var(--dorado-oscuro));
            color: var(--negro-fondo);
            font-weight: 800;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
            border: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        .btn-accion:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
        }
        .btn-accion-secundario {
            background: linear-gradient(135deg, var(--azul-claro), var(--azul-medio));
            color: white;
            border: 2px solid var(--dorado);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border-left: 5px solid var(--dorado);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: 800;
            color: var(--dorado);
        }
        .stat-label {
            font-size: 0.8em;
            text-transform: uppercase;
            color: #aaa;
            margin-top: 8px;
        }

        .grafico-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .tabla-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px;
            color: var(--dorado);
            border-bottom: 2px solid var(--dorado);
        }
        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-contenido {
            background: linear-gradient(135deg, var(--azul-medio), var(--azul-oscuro));
            border-radius: 20px;
            padding: 25px;
            max-width: 320px;
            width: 85%;
            text-align: center;
            border: 3px solid var(--dorado);
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-logo {
            width: 100px;
            margin-bottom: 15px;
        }
        .modal-boton {
            background: var(--verde-claro);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--dorado);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #customAlert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            border: 2px solid var(--dorado);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 10001;
            font-weight: bold;
            display: none;
            white-space: nowrap;
        }

        .footer-fijo {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            text-align: center;
            font-size: 12px;
            z-index: 900;
        }
        .footer-fijo a {
            color: var(--dorado);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div id="customAlert"></div>

<div id="modalInvitaciones" class="modal-overlay">
    <div class="modal-contenido">
        <img src="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png" class="modal-logo">
        <h2 style="color: var(--dorado);">🎉 ¡Felicidades!</h2>
        <p style="margin: 10px 0;">Te otorgamos <strong>10 pases VIP</strong> de cortesía para tus clientes especiales.</p>
        <div id="contenedor-tokens" style="max-height: 300px; overflow-y: auto; margin: 15px 0; text-align: left;"></div>
        <button class="modal-boton" onclick="cerrarInvitaciones()">CERRAR</button>
    </div>
</div>

<div id="pdf-content">
    <div class="header">
        <img src="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png" class="logo">
        <div style="text-align: center;">
            <h1 style="margin: 0; font-size: 1.5em;">HABITAT-CAR</h1>
            <p style="margin: 0; font-size: 0.7em;">Gestiones del Automotor</p>
        </div>
        <button onclick="cerrarSesion()" class="btn-cerrar-sesion" id="btn-cerrar-sesion" style="display: none;">
            <i class="fas fa-sign-out-alt"></i> SALIR
        </button>
    </div>

    <div id="loginBox" class="login-card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://raw.githubusercontent.com/habitatcar/habitatcar.github.io/main/logo.png" style="height: 80px;">
        </div>
        <h2 style="color: var(--dorado); text-align: center; margin-bottom: 20px;">Acceso Comercio</h2>
        <input type="email" id="emailInput" placeholder="Email del dueño">
        <input type="password" id="passwordInput" placeholder="Contraseña">
        <button onclick="loginComerciante()" class="btn-accion" style="background: var(--dorado); color: black; margin-top: 10px;">
            <i class="fas fa-key"></i> INGRESAR
        </button>
    </div>

    <div id="dashboard" class="dashboard" style="display: none;">
        <div class="action-buttons">
            <button onclick="irAFicha()" class="btn-accion">
                <i class="fas fa-edit"></i> EDITAR MI FICHA
            </button>
            <button onclick="abrirInvitacionesVIP()" class="btn-accion btn-accion-secundario">
                <i class="fas fa-gift"></i> INVITACIONES VIP
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Usuarios</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statVip">0</div>
                <div class="stat-label">Canjes VIP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statLead">0</div>
                <div class="stat-label">Canjes Lead</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statUltima">--:--</div>
                <div class="stat-label">Último Canje</div>
            </div>
        </div>

        <div class="grafico-container">
            <canvas id="graficoSemanal"></canvas>
        </div>

        <div class="tabla-container">
            <h3 style="color: var(--dorado); margin-bottom: 15px;">📋 Historial de Canjes</h3>
            <div style="max-height: 400px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr><th>Fecha/Hora</th><th>Categoría</th><th>Nro Cupón</th><th>Detalle</th></tr>
                    </thead>
                    <tbody id="tablaMaestra"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="footer-fijo">
    <a href="https://www.habitatcar.com.ar" target="_blank">www.habitatcar.com.ar</a> | 
    <a href="https://wa.me/543884618228" target="_blank">388-4618228</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, getDocs, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import Chart from "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
        authDomain: "habitatcar-pro.firebaseapp.com",
        projectId: "habitatcar-pro",
        storageBucket: "habitatcar-pro.firebasestorage.app",
        messagingSenderId: "311691258694",
        appId: "1:311691258694:web:17a09051dcea7707af9347"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    let miGrafico = null;
    let comercioActual = null;
    let unsubVip = null, unsubLead = null;

    function mostrarAlerta(mensaje, esError = false) {
        const alerta = document.getElementById('customAlert');
        alerta.style.background = esError ? '#dc3545' : '#28a745';
        alerta.innerText = mensaje;
        alerta.style.display = 'block';
        setTimeout(() => { alerta.style.display = 'none'; }, 3000);
    }

    window.cerrarSesion = () => {
        signOut(auth).then(() => location.reload());
    };

    // ============================================
    // BUSCAR COMERCIO POR UID - CON PARCHE AUTOMÁTICO
    // ============================================
    async function buscarComercioPorUID(uid, userEmail) {
        try {
            console.log("🔍 Buscando comercio con UID:", uid);
            
            // 1. Buscar por UID
            const q = query(collection(db, "comercios"), where("uid", "==", uid));
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                const docSnap = querySnapshot.docs[0];
                comercioActual = { id: docSnap.id, ...docSnap.data() };
                console.log("✅ Comercio encontrado por UID:", comercioActual.nombre);
                mostrarDashboard();
                return;
            }
            
            // 2. Si no encuentra por UID, buscar por email
            console.log("⚠️ No encontrado por UID. Buscando por email:", userEmail);
            const qEmail = query(collection(db, "comercios"), where("emailDueno", "==", userEmail));
            const emailSnapshot = await getDocs(qEmail);
            
            if (!emailSnapshot.empty) {
                const docSnap = emailSnapshot.docs[0];
                comercioActual = { id: docSnap.id, ...docSnap.data() };
                console.log("✅ Comercio encontrado por EMAIL:", comercioActual.nombre);
                
                // CORREGIR: Agregar el UID que faltaba
                await updateDoc(doc(db, "comercios", docSnap.id), { uid: uid });
                console.log("✅ UID guardado correctamente en el comercio");
                comercioActual.uid = uid;
                
                mostrarDashboard();
                return;
            }
            
            // 3. No encontró nada
            console.error("❌ No se encontró comercio para este usuario");
            mostrarAlerta("❌ No se encontró tu comercio. Contactá al administrador.", true);
            signOut(auth);
            
        } catch (error) {
            console.error("Error en búsqueda:", error);
            mostrarAlerta("⚠️ Error al buscar comercio", true);
        }
    }

    function mostrarDashboard() {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('btn-cerrar-sesion').style.display = 'flex';
        
        // Mostrar nombre del comercio
        const nombreComercio = comercioActual.nombre || "Mi Comercio";
        document.querySelector('.header h1').innerHTML = `HABITAT-CAR<br><span style="font-size: 0.6em; color: var(--dorado);">${nombreComercio}</span>`;
        
        inicializarGrafico();
        iniciarSuscripciones(comercioActual.id);
    }

    // Verificar sesión al cargar
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("✅ Usuario autenticado:", user.email);
            buscarComercioPorUID(user.uid, user.email);
        } else {
            console.log("❌ No hay usuario autenticado");
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('btn-cerrar-sesion').style.display = 'none';
        }
    });

    window.loginComerciante = async () => {
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        
        if(!email || !password) {
            mostrarAlerta("⚠️ Complete email y contraseña", true);
            return;
        }

        console.log("🔑 Intentando login con:", email);
        
        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            console.log("✅ Login exitoso:", userCredential.user.email);
            // El onAuthStateChanged se encargará de buscar el comercio
        } catch (error) {
            console.error("❌ Error de login:", error.code, error.message);
            if (error.code === 'auth/user-not-found') {
                mostrarAlerta("❌ Usuario no registrado. Verificá tu email.", true);
            } else if (error.code === 'auth/wrong-password') {
                mostrarAlerta("❌ Contraseña incorrecta. Intentá de nuevo.", true);
            } else {
                mostrarAlerta("❌ Error al iniciar sesión: " + error.message, true);
            }
        }
    };

    window.abrirInvitacionesVIP = async () => {
        if (!comercioActual) return;
        
        const modal = document.getElementById('modalInvitaciones');
        const cont = document.getElementById('contenedor-tokens');
        
        modal.style.display = 'flex';
        cont.innerHTML = '<div style="text-align:center;"><div class="loader"></div> Cargando...</div>';

        try {
            const qTokens = query(collection(db, "tokens_vip"), where("comercioId", "==", comercioActual.idComercio));
            const snap = await getDocs(qTokens);
            let docs = snap.docs.map(d => ({id: d.id, ...d.data()}));

            if (docs.length === 0) {
                for (let i = 0; i < 10; i++) {
                    const randomStr = Math.random().toString(36).substring(2, 8);
                    const tkn = `vip_${randomStr}_${comercioActual.idComercio.substring(0,3)}`;
                    await addDoc(collection(db, "tokens_vip"), {
                        token: tkn,
                        comercioId: comercioActual.idComercio,
                        estado: 'disponible',
                        creadoPor: 'comercio',
                        fechaCreacion: Date.now()
                    });
                }
                return abrirInvitacionesVIP(); 
            }

            cont.innerHTML = "";
            docs.forEach((t, i) => {
                const link = `https://habitatcar.github.io/usuarios_registro_vip.html?t=${t.token}`;
                const esUsado = t.estado !== 'disponible';
                
                cont.innerHTML += `
                    <div style="background: rgba(0,0,0,0.5); border: 1px solid ${esUsado ? '#800020' : '#d4af37'}; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>Invitación ${i+1}</strong>
                                <span style="color: ${esUsado ? '#dc3545' : '#28a745'}; margin-left: 8px;">${esUsado ? 'USADO' : 'DISPONIBLE'}</span>
                            </div>
                            <button onclick="copiarLinkPase('${link}')" style="background: #d4af37; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">📋 COPIAR</button>
                        </div>
                    </div>`;
            });
        } catch (e) { 
            console.error(e); 
            mostrarAlerta("❌ Error al cargar invitaciones", true);
        }
    };

    window.copiarLinkPase = (l) => {
        navigator.clipboard.writeText(l).then(() => {
            mostrarAlerta("✅ Enlace VIP copiado");
        });
    };

    window.cerrarInvitaciones = () => {
        document.getElementById('modalInvitaciones').style.display = 'none';
    };

    function iniciarSuscripciones(comercioId) {
        const qVip = query(collection(db, "logs_vip"), where("comercioId", "==", comercioId));
        unsubVip = onSnapshot(qVip, (snap) => procesarSnapshot(snap, "VIP"));
        const qLead = query(collection(db, "logs_actividad"), where("comercioId", "==", comercioId), where("tipo", "==", "canje"));
        unsubLead = onSnapshot(qLead, (snap) => procesarSnapshot(snap, "LEAD"));
    }

    function procesarSnapshot(snap, tipo) {
        const tabla = document.getElementById('tablaMaestra');
        snap.docChanges().forEach((change) => {
            if (change.type === "added") {
                const d = change.doc.data();
                const docId = change.doc.id;
                if (document.getElementById(docId)) return;

                let fecha = d.fecha?.toDate ? d.fecha.toDate() : (d.timestamp ? new Date(d.timestamp) : new Date());
                const timestamp = fecha.getTime();
                const esVip = (tipo === "VIP");
                
                if (miGrafico) {
                    let diaIndex = fecha.getDay(); 
                    let diaAjustado = diaIndex === 0 ? 6 : diaIndex - 1; 
                    miGrafico.data.datasets[esVip ? 0 : 1].data[diaAjustado]++;
                    miGrafico.update();
                }

                const filaHTML = `
                    <tr id="${docId}" data-time="${timestamp}">
                        <td>${fecha.toLocaleDateString()}<br><small>${fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</small></td>
                        <td><span style="background: ${esVip ? '#d4af37' : '#004a99'}; padding: 4px 8px; border-radius: 8px; font-size: 11px;">${esVip ? 'VIP' : 'LEAD'}</span></td>
                        <td><code>${d.idValidacion || d.codigoGenerado || d.idCupon || '---'}</code></td>
                        <td>${d.beneficio || d.detalle || 'Sin detalle'}</td>
                    </tr>`;

                tabla.insertAdjacentHTML('afterbegin', filaHTML);

                const elStat = document.getElementById(esVip ? 'statVip' : 'statLead');
                elStat.innerText = parseInt(elStat.innerText) + 1;
                document.getElementById('statTotal').innerText = parseInt(document.getElementById('statVip').innerText) + parseInt(document.getElementById('statLead').innerText);
                document.getElementById('statUltima').innerText = fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
        });
    }

    window.irAFicha = () => {
        if (comercioActual) {
            window.location.href = `admin_mi_comercio.html?uid=${comercioActual.uid}`;
        }
    };

    function inicializarGrafico() {
        const ctx = document.getElementById('graficoSemanal').getContext('2d');
        if (miGrafico) miGrafico.destroy();
        miGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],
                datasets: [
                    { label: 'VIP', data: [0,0,0,0,0,0,0], borderColor: '#d4af37', tension: 0.4, fill: false },
                    { label: 'LEAD', data: [0,0,0,0,0,0,0], borderColor: '#3b82f6', tension: 0.4, fill: false }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: true,
                plugins: { 
                    legend: { labels: { color: '#aaa' } }
                },
                scales: {
                    y: { grid: { color: '#334766' }, ticks: { color: '#aaa' } },
                    x: { grid: { color: '#334766' }, ticks: { color: '#aaa' } }
                }
            }
        });
    }
</script>
</body>
</html>
