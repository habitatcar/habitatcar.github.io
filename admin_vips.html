<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel VIPs | TEST</title>
    <style>
        body {
            background: #0a192f;
            color: white;
            font-family: monospace;
            padding: 20px;
        }
        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
        .log {
            background: #1a2a45;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 12px;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #6bff6b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #334766;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #004a99;
        }
    </style>
</head>
<body>
    <h1>🔧 DIAGNÓSTICO - Panel VIPs</h1>
    
    <div>
        <button onclick="testFirebase()">1️⃣ Probar conexión Firebase</button>
        <button onclick="testVips()">2️⃣ Buscar VIPs</button>
        <button onclick="testRestablecer()">3️⃣ Probar RESTABLECER (con ID manual)</button>
    </div>
    
    <div id="logs" class="log">
        <strong>📋 LOG DE DIAGNÓSTICO:</strong><br>
        Esperando acciones...
    </div>
    
    <div id="resultados"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5M0kPsdU8Hk_YX3uEahfoQ5k9PD8SUXM",
            authDomain: "habitatcar-pro.firebaseapp.com",
            projectId: "habitatcar-pro",
            storageBucket: "habitatcar-pro.firebasestorage.app",
            messagingSenderId: "311691258694",
            appId: "1:311691258694:web:17a09051dcea7707af9347"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let listaVIPs = [];
        
        function agregarLog(mensaje, esError = false) {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const clase = esError ? 'error' : 'success';
            logsDiv.innerHTML += `<div class="${clase}">[${timestamp}] ${mensaje}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(mensaje);
        }
        
        // Función para mostrar resultados en tabla
        function mostrarVIPs(vips) {
            const div = document.getElementById('resultados');
            if (!vips || vips.length === 0) {
                div.innerHTML = '<p>⚠️ No se encontraron VIPs en la base de datos.</p>';
                return;
            }
            
            let html = '<h3>👑 Socios VIP encontrados:</h3>';
            html += ' <table>';
            html += ' <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>WhatsApp</th><th>Usos</th><th>Acciones</th></tr>';
            
            vips.forEach(vip => {
                html += ` <tr>
                    <td>${vip.id.substring(0, 8)}...</td>
                    <td>${vip.nombres || '---'}</td>
                    <td>${vip.apellido || '---'}</td>
                    <td>${vip.whatsapp || '---'}</td>
                    <td><strong style="color: #ff6b6b;">${vip.usos_count || 0}</strong></td>
                    <td><button onclick="testRestablecerID('${vip.id}', '${vip.apellido}', '${vip.nombres}')">🔄 Probar RESTABLECER</button></td>
                </tr>`;
            });
            html += '</table>';
            div.innerHTML = html;
        }
        
        // TEST 1: Probar conexión a Firebase
        window.testFirebase = async () => {
            agregarLog("🔌 Probando conexión a Firebase...");
            try {
                const testRef = collection(db, "leads");
                const snapshot = await getDocs(query(testRef, where("convertidoVIP", "==", true)));
                agregarLog(`✅ Conexión exitosa! Se encontraron ${snapshot.size} documentos en la consulta.`);
                return true;
            } catch (error) {
                agregarLog(`❌ Error de conexión: ${error.message}`, true);
                return false;
            }
        };
        
        // TEST 2: Buscar VIPs
        window.testVips = async () => {
            agregarLog("🔍 Buscando socios VIP (convertidoVIP == true)...");
            try {
                const q = query(collection(db, "leads"), where("convertidoVIP", "==", true));
                const snapshot = await getDocs(q);
                
                agregarLog(`📊 Resultado: ${snapshot.size} VIPs encontrados`);
                
                if (snapshot.size === 0) {
                    agregarLog("⚠️ No hay usuarios VIP en la base de datos. Probá creando uno primero.", true);
                    document.getElementById('resultados').innerHTML = '<p style="color: orange;">⚠️ No hay socios VIP registrados en la base de datos.</p>';
                    return;
                }
                
                listaVIPs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    listaVIPs.push({
                        id: doc.id,
                        ...data,
                        usos_count: data.usos_count || 0
                    });
                });
                
                agregarLog(`✅ Lista cargada. Usos totales: ${listaVIPs.reduce((sum, v) => sum + (v.usos_count || 0), 0)}`);
                mostrarVIPs(listaVIPs);
                
            } catch (error) {
                agregarLog(`❌ Error al buscar VIPs: ${error.message}`, true);
            }
        };
        
        // TEST 3: Función RESTABLECER CORREGIDA
        window.testRestablecerID = async (id, apellido, nombres) => {
            const pass = prompt("🔒 Clave ADMIN para RESTABLECER:");
            if (pass !== "admin1234") {
                agregarLog("❌ Clave incorrecta", true);
                return;
            }
            
            agregarLog(`🔄 RESTABLECIENDO cupones para: ${apellido} ${nombres} (ID: ${id})`);
            
            try {
                const docRef = doc(db, "leads", id);
                
                // Obtener datos ANTES del restablecimiento
                const antes = await getDocs(query(collection(db, "leads"), where("convertidoVIP", "==", true)));
                let usosAntes = 0;
                antes.forEach(d => {
                    if (d.id === id) usosAntes = d.data().usos_count || 0;
                });
                agregarLog(`📊 Usos ANTES: ${usosAntes}`);
                
                // Actualizar en Firestore
                const updateData = {
                    usos_count: 0,
                    lastSubmission: Date.now(),
                    canjes_por_comercio: {}
                };
                
                await updateDoc(docRef, updateData);
                agregarLog(`✅ Datos actualizados en Firestore: usos_count=0, canjes_por_comercio={}`);
                
                // Registrar en LOG
                await addDoc(collection(db, "logs_actividad"), {
                    usuarioId: id,
                    nombre: `${apellido} ${nombres}`,
                    tipo: "VIP",
                    accion: "RESTABLECER CUPONES VIP",
                    detalle: `Cupones de ${apellido} ${nombres} restablecidos`,
                    timestamp: Date.now(),
                    fecha: new Date().toLocaleString()
                });
                agregarLog(`✅ Log registrado en logs_actividad`);
                
                // Verificar después
                const despues = await getDocs(query(collection(db, "leads"), where("convertidoVIP", "==", true)));
                let usosDespues = 0;
                despues.forEach(d => {
                    if (d.id === id) usosDespues = d.data().usos_count || 0;
                });
                agregarLog(`📊 Usos DESPUÉS: ${usosDespues}`);
                
                if (usosDespues === 0) {
                    agregarLog(`✅ ¡ÉXITO! Los cupones se restablecieron correctamente`);
                } else {
                    agregarLog(`⚠️ ADVERTENCIA: Los usos siguen en ${usosDespues}`, true);
                }
                
                // Recargar la lista
                await window.testVips();
                
            } catch (error) {
                agregarLog(`❌ ERROR al restablecer: ${error.message}`, true);
                console.error(error);
            }
        };
        
        // Función global para que funcione desde los botones dinámicos
        window.testRestablecerID = window.testRestablecerID;
        
        // TEST 4: Restablecer masivo
        window.testRestablecerMasivo = async () => {
            if (!listaVIPs || listaVIPs.length === 0) {
                agregarLog("⚠️ No hay VIPs para restablecer. Primero ejecutá 'Buscar VIPs'", true);
                return;
            }
            
            const pass = prompt("🔒 Clave ADMIN para RESTABLECIMIENTO MASIVO:");
            if (pass !== "admin1234") {
                agregarLog("❌ Clave incorrecta", true);
                return;
            }
            
            agregarLog(`🔄 RESTABLECIMIENTO MASIVO de ${listaVIPs.length} VIPs...`);
            
            let exitosos = 0;
            let fallidos = 0;
            
            for (const vip of listaVIPs) {
                try {
                    const docRef = doc(db, "leads", vip.id);
                    await updateDoc(docRef, {
                        usos_count: 0,
                        lastSubmission: Date.now(),
                        canjes_por_comercio: {}
                    });
                    exitosos++;
                    agregarLog(`✅ ${vip.apellido} ${vip.nombres} - restablecido`);
                } catch (e) {
                    fallidos++;
                    agregarLog(`❌ ${vip.apellido} ${vip.nombres} - error: ${e.message}`, true);
                }
            }
            
            agregarLog(`📊 RESULTADO FINAL: ${exitosos} exitosos, ${fallidos} fallidos`);
            
            if (exitosos > 0) {
                await window.testVips(); // Recargar
            }
        };
        
        // Agregar botón de restablecimiento masivo
        setTimeout(() => {
            const divBotones = document.querySelector('div');
            const btnMasivo = document.createElement('button');
            btnMasivo.textContent = '🔄 RESTABLECER MASIVO (TODOS)';
            btnMasivo.onclick = window.testRestablecerMasivo;
            btnMasivo.style.background = '#dc3545';
            btnMasivo.style.color = 'white';
            divBotones.appendChild(btnMasivo);
        }, 1000);
        
        // Mensaje inicial
        agregarLog("🚀 Página de diagnóstico cargada. Hacé clic en 'Probar conexión Firebase' para comenzar.");
    </script>
</body>
</html>
